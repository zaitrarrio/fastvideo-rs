# B4a GPU identity cell b4a-h3-4step-tea (scripts/gpu/runpod-matrix.sh b4a,
# docs/adr/0020-step-cache.md): FastH3 Preview 4-step VSA (as
# profiles/h3/fasth3_4step_vsa) with a TeaCache loose enough to reuse.
# Forward 0 warms up, forward 3 cools down, forwards 1 and 2 reuse the
# whole-stack residual while the accumulated rel-L1 of the block-0
# modulated input stays under 1.0. Not a served profile: it exists so the
# baseline and the PR build run the reuse path on a short recipe.

[id]
name = "b4a_h3_4step_teacache"
family = "minimax_h3"
description = "FastH3 4-step VSA with TeaCache on forwards 1-2 (B4a identity cell)."

[pipeline]
model = "h3"
recipe = "4step-vsa"

[techniques.vsa]

[techniques.teacache]
threshold = 1.0
retain_steps = 1
cooldown_steps = 1
coefficients = [1.0, 0.0]

[techniques.mxfp8]

[techniques.bf16_activations]
