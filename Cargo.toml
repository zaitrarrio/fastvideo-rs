[workspace]
resolver = "2"
members = [
    "crates/fastvideo-ops",
    "crates/fastvideo-core",
    "crates/fastvideo-models",
    "crates/fastvideo-loader",
    "crates/fastvideo-cudarc",
    "crates/fastvideo-cli",
    "crates/fastvideo-gpucheck",
    "crates/fastvideo-mlx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
description = "Rust inference port of FastVideo (Wan / LTX / H3) on cudarc CUDA."
repository = "https://github.com/zaitrarrio/fastvideo-rs"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
toml = "0.8"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
safetensors = "0.6"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"
rand_distr = "0.5"
memmap2 = "0.9"
sha2 = "0.10"
rayon = "1"

fastvideo-ops = { path = "crates/fastvideo-ops" }
fastvideo-core = { path = "crates/fastvideo-core" }
fastvideo-models = { path = "crates/fastvideo-models" }
fastvideo-loader = { path = "crates/fastvideo-loader" }
fastvideo-cudarc = { path = "crates/fastvideo-cudarc" }
cudarc = { version = "0.17", default-features = false, features = ["std", "driver", "cublas", "cublaslt", "cudnn", "nvrtc", "f16", "cuda-version-from-build-system", "dynamic-loading"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Real inference runs are release builds. LTO + a single codegen unit cost
# build time only, but help every host-side glue path this workspace still
# has (shape/stride math, CPU fallback loops, safetensors dtype conversion) —
# free throughput for code we don't want to (or can't yet) move to the GPU.
# `panic = "abort"` drops unwind-table overhead; this binary doesn't rely on
# catching panics across an FFI boundary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
