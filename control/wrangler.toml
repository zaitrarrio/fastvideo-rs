# fv-control: the cluster controller (docs/control/README.md).
# Secrets (wrangler secret put, never here): RUNPOD_API_KEY,
# CLOUDFLARE_API_KEY, GITHUB_PAT, CONTROL_KEK, SESSION_SECRET,
# CLOUDRIFT_API_KEY (optional: the CloudRift provider, docs/ops/cloudrift.md),
# GITHUB_RUNNER_PAT, BUILD_CACHE_R2_ACCESS_KEY_ID, BUILD_CACHE_R2_SECRET_ACCESS_KEY
# (optional: build pods' runners and R2 cache, docs/dev/build-pods-fv-control.md),
# OWNER_PASSPHRASE_HASH. Deploy: scripts/serve/fv-control.sh deploy staging.
name = "fv-control"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The editor bundle (public/editor.js) is built from ui/ before dev and deploy.
[build]
command = "node build-ui.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ingest/*", "/healthz", "/serverless/*", "/serverless-uploads/*"]

[[durable_objects.bindings]]
name = "CLUSTER_OPS"
class_name = "ClusterOps"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClusterOps"]

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "dev"
GITHUB_REPO = "zaitrarrio/fastvideo-rs"
RELEASE_WORKFLOW = "release.yml"
SERVE_REPO = "ghcr.io/zaitrarrio/fastvideo-rs-serve"
BALANCE_FLOOR = "8"

[[d1_databases]]
binding = "DB"
database_name = "fv-control"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The jobs D1s the Jobs view reads (src/jobs.ts), local stand-ins here:
# fv-jobs (direct workers, standalone pods; also releases) and the edge's.
[[d1_databases]]
binding = "JOBS_DB"
database_name = "fv-jobs"
database_id = "00000000-0000-0000-0000-000000000001"

[[d1_databases]]
binding = "EDGE_DB"
database_name = "fv-edge"
database_id = "00000000-0000-0000-0000-000000000002"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "fv-control-logs"

# ---------------------------------------------------------------- staging
[env.staging]
name = "fv-control-staging"
workers_dev = true

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ingest/*", "/healthz", "/serverless/*", "/serverless-uploads/*"]

[[env.staging.durable_objects.bindings]]
name = "CLUSTER_OPS"
class_name = "ClusterOps"

[env.staging.triggers]
crons = ["* * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
CF_ACCOUNT_ID = "0cd06fd37ee4e07de370821cb3852a8a"
GITHUB_REPO = "zaitrarrio/fastvideo-rs"
RELEASE_WORKFLOW = "release.yml"
SERVE_REPO = "ghcr.io/zaitrarrio/fastvideo-rs-serve"
BALANCE_FLOOR = "8"
PUBLIC_URL = "https://fv-control-staging.maximalize.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "fv-control"
database_id = "b883b6a2-adf6-483b-8d45-9231de9d256c"
migrations_dir = "migrations"

[[env.staging.d1_databases]]
binding = "JOBS_DB"
database_name = "fv-jobs"
database_id = "1796e295-a7f0-4402-bbed-ec94ccb27c15"

# The edge's D1 (EDGE_D1_DATABASE_ID): edge workers' jobs, read only (the Jobs view).
[[env.staging.d1_databases]]
binding = "EDGE_DB"
database_name = "fv-edge-staging"
database_id = "a375f088-b904-48ce-9d33-a972074402a2"

# The staging edge (control_plane = edge clusters): a service binding, since a
# Worker cannot fetch another workers.dev Worker of the account (error 1042).
[[env.staging.services]]
binding = "EDGE"
service = "fv-edge-staging"

[[env.staging.r2_buckets]]
binding = "LOGS"
bucket_name = "fv-control-logs"

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "fv_control_metrics"
