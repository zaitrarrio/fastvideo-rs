[server]
bind = "0.0.0.0:8000"
state_dir = "/fvstate"
shutdown_grace_s = 10
sync_timeout_s = 600

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "remote"

[gateway]
caps_refresh_s = 60
tick_s = 5
metrics_window_s = 600
watch_poll_ms = 1000
runpod_api_base = "https://api.runpod.ai/v2"

[aliases]
"MiniMax-H3" = "fasth3"

[protocols]
openai_videos = true
fastwan = true
minimax = true
fal = true
fal_director = true
ltx = true
reactor = true
native = true
# Every worker config's fal apps (the union; the workers mount the same ids;
# runpod.toml and the H3 configs mount the default H3 apps). An app whose
# model no pool serves answers 404 ("model ... is not served by any pool");
# the gateway starts and serves the rest (tests/gateway_bases.rs).
fal_apps = ["minimax/h3-max", "fal-ai/ltx-2.3", "fal-ai/wan", "nobody/serves-this"]

[limits]
queue_max = 256
body_max_mb = 64


[[pools]]
id = "wan"
kind = "pod"
urls = []
max_queued = 64
dispatch_timeout_s = 30
job_timeout_s = 1800
stale_after_s = 120
retries = 1
[[pools.models]]
id = "fastwan22-ti2v-5b"
family = "wan"
recipe = "wan-turbo"
[[pools.models]]
id = "wan22-ti2v-5b"
family = "wan"
recipe = "wan-max"

[[pools]]
id = "fastwan21"
kind = "pod"
urls = []
max_queued = 64
dispatch_timeout_s = 30
job_timeout_s = 900
stale_after_s = 90
retries = 1
[[pools.models]]
id = "fastwan21-1.3b"
family = "wan"
recipe = "fastwan21-1.3b"

[[pools]]
id = "sfwan"
kind = "pod"
urls = []
max_queued = 8
dispatch_timeout_s = 30
job_timeout_s = 1800
stale_after_s = 60
retries = 1
[[pools.models]]
id = "sfwan21-1.3b"
family = "wan"
recipe = "sfwan21-1.3b"

[autoscale]
enabled = false
