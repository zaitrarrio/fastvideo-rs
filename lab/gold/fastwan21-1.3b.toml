# Gold standard of `fastwan21-1.3b` (wan, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as FastVideo/FastWan2.1-T2V-1.3B-Diffusers (fal fastvideo/fastwan21-1.3b): 480p, 3 DMD steps, VSA; a 24 GB card.

schema = 1

[model]
variant = "fastwan21-1.3b"
family = "wan"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 81
fps = 16
steps = 3
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
note = "fv-gpucheck --vsa wan gen (fast_wan_t2v_480p, DMD 3 steps, VSA), FASTVIDEO_WAN_VAE=full, --mode fast, --dit-offload resident. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5."

[latency]
measures = "gen"
p50_s = 4.85
min_s = 4.85
max_s = 4.86
denoise_s = 1.92
decode_s = 2.91
load_s = 67.6
peak_gib = 27.1

[quality]
note = "No quality measured in the raw-inference run."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00335

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

