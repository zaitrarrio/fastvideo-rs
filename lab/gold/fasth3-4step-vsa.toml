# Gold standard of `fasth3-4step-vsa` (h3, turbo): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.

schema = 1

[model]
variant = "fasth3-4step-vsa"
family = "h3"
profile = "h3/fasth3_4step_vsa"

[tier]
name = "turbo"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
steps = 4
note = "fv-gpucheck h3 gen --techniques h3/fasth3_4step_vsa --h3-recipe 4step-vsa (FastH3 Preview LoRA, VSA 0.9, MXFP8 linears, bf16 activations), official ViT VAE, --text-encoder resident-fp8, --dit-offload resident. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5. The serving default canvas is 1344x768."

[workload.upstream]
target = "fasth3-4step-vsa"
image = "fastvideo-rs-upstream-fastvideo"
rev = "e90be59"

[latency]
measures = "gen"
p50_s = 9.84
min_s = 9.75
max_s = 9.85
denoise_s = 7.07
decode_s = 2.71
load_s = 138.8
peak_gib = 60.3

[quality]
cell = "oracle target fasth3-4step-vsa: 1344x768x124, the matrix prompt, seed 1024, the reference's noise and text injected; ours on one H100 SXM with the default dc VSA kernel (runtime f9be674, 2026-09-29), the reference (FastVideo e90be59, strict eager route) on an RTX PRO 6000."
oracle = "H3 matches the reference to the model's own bf16/f32 noise floor: our bf16 and f32 runs part from each other as much as either parts from the reference, block for block, with no systematic offset (docs/oracle.md, Results: H3, 2026-09-26). The 2026-09-29 dc arm is at or below the 2026-09-26 RTX PRO 6000 tma2 profile everywhere."
psnr_vs_upstream_min_db = 19.73
lpips_vs_upstream_max = 0.236
note = "Clip PSNR / SSIM / LPIPS vs the reference: dc 19.73 dB / 0.699 / 0.236; tma2 19.17 dB / 0.691 / 0.238 (the kernel the RTX PRO 6000 runs). This tier is the baseline the h3attn arms are gated against."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00681

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

