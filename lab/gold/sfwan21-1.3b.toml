# Gold standard of `sfwan21-1.3b` (wan, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as sfwan21-1.3b: the causal streaming model (Reactor and native streams); a 24 GB card.

schema = 1

[model]
variant = "sfwan21-1.3b"
family = "wan"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
seconds = 5.0
fps = 16
steps = 4
prompt_set = "one fox prompt (artifacts/perf/raw-inference/bench.sh), seed 7"
seeds = [7]
note = "fv-gpucheck --mode fast wan stream --run r,seconds=10,rope=rebased,sink=3,sheet=0: TAEHV decode inside every block, CUDA graphs, bf16; five 10 s rollouts after one warm-up. The figures are per 5 s of video (seconds = 5.0) as docs/perf/raw-inference.md reports them."

[latency]
measures = "stream"
p50_s = 5.27
fps = 15.18
ttff_s = 0.43
peak_gib = 26.7
note = "Steady fps median 15.18 (15.14-15.24); block p50 0.782 s for 12 frames; about 5 % short of real time on sm_120, matching the 15.22 fps of docs/serve/e2e/wan.md. MXFP8 changes nothing (15.16 fps). H100 SXM: 23.8 frames/s, block p50 about 0.51 s, about 3.4 s per 5 s of video (another GPU)."

[quality]
note = "The SF-Wan oracle (target sfwan13, FastVideo WanCausalDMDPipeline) is defined in docs/oracle.md; its results are in docs/ports/wan.md 'SF-Wan', outside D2's sources."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00365

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

[[source]]
fields = ["latency.measures", "latency.p50_s", "latency.fps", "latency.ttff_s", "latency.peak_gib", "workload"]
