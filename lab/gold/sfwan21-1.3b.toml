heading = "RTX PRO 6000 (sm_120)"
date = "2026-09-30"
note = "Table 'SF-Wan 1.3B streaming, 832x480, 16 fps', row 'default (TAEHV, bf16)': steady fps 15.18 (15.14-15.24), 5.27 s per 5 s of video, block p50 0.782 s, TTFF 0.43 s, peak 26.7 GiB."

[[source]]
