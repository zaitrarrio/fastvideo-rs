[[source]]
fields = []
path = "docs/techniques.md"
heading = "H3 attention arms (`h3attn`, RTX PRO 6000, 2026-09-27)"
date = "2026-09-27"
note = "The measured FastH3 8-step cells run profile h3/fasth3_8step (VSA 0.8, MXFP8): 768p denoise 45.76 s, and the h3arms baselines 46.52 s (768p) / 16.48 s (480p). That is the VSA recipe, not this dense variant; no number here is this variant's."

[[source]]
fields = []
path = "docs/oracle.md"
heading = "Results: H3 (2026-09-26, RTX PRO 6000, runtime f49db62 / 5312e4b / b1226e9)"
date = "2026-09-26"
note = "The oracle's 8-step target is FastH3 8-step V2 with VSA 0.8 (matches the reference to the bf16/f32 noise floor); the dense control is the 4-step dense LoRA. Neither is this variant."

[[source]]
