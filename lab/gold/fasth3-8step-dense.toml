# Gold standard of `fasth3-8step-dense` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# No preset serves it (control/src/presets.ts NOT_8STEP: its 148 GB h3-8step tree does not fit the family pod).

schema = 1

[model]
variant = "fasth3-8step-dense"
family = "h3"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1344
height = 768
frames = 124
fps = 24
prompt_set = "scripts/gpu/prompts-eval.json (the five gate prompts)"
steps = 8
note = "The latency numbers are the gold run's (7e580e5, 2026-10-26): one request of the gold cell (lab/cells/gold-fasth3-8step-dense.toml: runpod-matrix.sh's default prompt, seed 1024, the served default), not the prompt set above."

[latency]
measures = "serve_job"
p50_s = 71.33
denoise_s = 65.68
decode_s = 4.84
peak_gib = 61.0
note = "One serve-engine job of the gold cell (n = 1, the gold run at 7e580e5, 2026-10-26): p50_s is submit to MP4, the text encode of the uncached prompt (0.37 s) included; decode_s is video_decode + encode."

[quality]

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.04934

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-8step-dense/summary.json"
date = "2026-10-26"

[[source]]
fields = []
path = "docs/techniques.md"
heading = "H3 attention arms (`h3attn`, RTX PRO 6000, 2026-09-27)"
date = "2026-09-27"
note = "The measured FastH3 8-step cells run profile h3/fasth3_8step (VSA 0.8, MXFP8): 768p denoise 45.76 s, and the h3arms baselines 46.52 s (768p) / 16.48 s (480p). That is the VSA recipe, not this dense variant; no number here is this variant's."

[[source]]
fields = []
path = "docs/oracle.md"
heading = "Results: H3 (2026-09-26, RTX PRO 6000, runtime f49db62 / 5312e4b / b1226e9)"
date = "2026-09-26"
note = "The oracle's 8-step target is FastH3 8-step V2 with VSA 0.8 (matches the reference to the bf16/f32 noise floor); the dense control is the 4-step dense LoRA. Neither is this variant."

[[source]]
fields = ["cost.usd_per_hr"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "H3 NVFP4 tier: three speed / quality options (2026-10-14)"
date = "2026-10-14"
note = "RTX PRO 6000 at $2.49/hr in EU-RO-1, the most recent dated price of the class. Older: $2.09/hr in EUR-IS-1 (docs/perf/raw-inference.md 2026-09-30, docs/perf/sol-bench.md 2026-10-06); $2.59/hr for the Workstation Edition in EU-RO-1 (docs/perf/h3-vae-decode-speed.md 2026-10-14). usd_per_clip = usd_per_hr x latency.p50_s / 3600, derived."

[[source]]
fields = ["latency.measures", "latency.p50_s", "latency.denoise_s", "latency.decode_s", "latency.peak_gib", "cost.usd_per_clip"]
path = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-8step-dense/gpucheck-out/engine.json"
heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026090916-e804, arm `fasth3-8step-dense`, exit 0, 168 s): one serve-engine job of the gold cell (lab/cells/gold-fasth3-8step-dense.toml: runpod-matrix.sh's default prompt, seed 1024, 1344x768, 124 frames, 8 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 71.33 (text 0.37, denoise 65.68, video_decode 4.72, encode 0.12), load_s 95.4, peak_memory_mb 62479 (61.0 GiB). Host RAM (summary.json): peak 78470 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). load_s (95.4 s) is not in the fields: it was page-cache warm (fasth3-4step-vsa-nvfp4-taeh3 read h3-base earlier in the pod; no cold load of this variant was measured (the pod's first H3 arm, fasth3-4step-vsa-nvfp4-taeh3, loaded its own tree and h3-base in 88.1 s)). usd_per_clip = cost.usd_per_hr x latency.p50_s / 3600, derived."

