# Gold standard of `ltx25-distill-dense` (ltx2, max): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as ltx-pro: LTX-2.5 distilled two-stage, dense stage 2; SageAttention2 on sm_120.

schema = 1

[model]
variant = "ltx25-distill-dense"
family = "ltx2"
profile = "ltx2/ltx25_distill_dense"

[tier]
name = "max"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1920
height = 1088
frames = 121
fps = 24
steps = 11
prompt_set = "ltx-multishot, ltx-newsbroadcast, ltx-frogyoga (scripts/gpu/prompts-eval.json) x 3 seeds (own, +1000, +2000)"
seeds = [42, 1042, 2042]
note = "steps = 8 stage-1 + 3 stage-2. The ltx-pro gate under the calibrated rule: one RTX PRO 6000 Server Edition pod (p63ptu6lo1wbgb, EUR-IS-1, $2.09/hr), image fastvideo-rs-serve:sha-ee9de1a, 1920x1080 requested (1088 generated), 5 s, 9 clips per arm after a warm-up, kernel picks pinned; SageAttention2 on, as the recipe runs on sm_120."

[workload.upstream]
target = "ltx25-512p-dense"
image = "sol-ltx25"
rev = "fd4ded7"

[latency]
measures = "end_to_end"
p50_s = 31.73
denoise_s = 20.0
note = "benchmark.json total_s with the prompt cached (median of 9); denoise 20.00 s = stage 1 6.59 s + stage 2 12.49 s with Sage, against 22.85 s / 34.29 s for the bf16 cuDNN arm (1.142x denoise, 1.08x total). A serve job of the same model logged denoise 22.80 s (Sage, first routed call)."

[quality]
cell = "oracle: 768x512x121, dense stage 2, the matrix prompt, seed 1024; sol-engine gpu_infer.py on Lightricks/LTX-2 fd4ded7, all 18 seeded draws, both text contexts and the stage-2 entry state injected."
oracle = "pass: LTX-2.5 distilled two-stage, dense stage 2, at 512p our bf16 run is closer to the reference than to our own f32 run at every block and step (typically by 2x in the blocks); what is left is below the model's bf16/f32 noise floor (docs/oracle.md)."
gate = "pass under the calibrated rule (docs/perf/sage-attention.md §9): SageAttention2, on by default for this recipe on sm_120, against the bf16 dense kernels; 3 of 3 prompts inside the bf16 band, no outlier; LPIPS 0.18-0.31 and PSNR 21.1-25.5 dB against the bf16 control (the control's own kernel swap: 0.16-0.37 / 18.2-26.3 dB)."
note = "The gate compares Sage against our own bf16 arms, not against upstream; per-prompt sharpness ratios 0.992-1.016, jitter 0.98-1.02."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.02195

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

