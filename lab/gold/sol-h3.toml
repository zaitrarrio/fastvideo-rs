# Gold standard of `sol-h3` (h3, max): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.

schema = 1

[model]
variant = "sol-h3"
family = "h3"
profile = "h3/sol_h3_4step_engine_ladder"

[tier]
name = "max"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
steps = 4
note = "fv-gpucheck h3 gen --techniques h3/sol_h3_4step_engine_ladder --h3-recipe sol-h3 (Sol engine route, tau 1.0 / 1.25 / 1.5, MXFP8), official ViT VAE, --text-encoder resident-fp8, --dit-offload resident. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5. The serving default canvas is 1344x768; this run measured every model at its smallest size. Run before the MXFP8 video-decoder default: reproduce with FASTVIDEO_H3_VAE_MXFP8=0 (bf16 video decode, the default before 2026-10-14). Since 2026-10-14 the 36-block decoder runs MXFP8 block linears by default (docs/perf/h3-vae-decode-speed.md §5)."

[workload.env]
FASTVIDEO_H3_VAE_MXFP8 = "0"

[latency]
measures = "gen"
p50_s = 8.87
min_s = 8.82
max_s = 8.89
denoise_s = 6.13
decode_s = 2.69
load_s = 122.6
peak_gib = 54.7
note = "At 480p H3 max beats H3 turbo by about 0.9 s of denoise: the VSA gather / gate overhead costs more than it saves at this grid; the tiers were tuned at 768p (docs/perf/raw-inference.md, Notes)."

[quality]
cell = "h3attn arm sol_h3_4step_engine_ladder: 1344x768x124, the five gate prompts (scripts/gpu/prompts-eval.json), medians, b299214, RTX PRO 6000, 2026-09-27, against Sol-H3 4-step dense in the same process."
gate = "pass vs Sol-H3 4-step dense at 768p (docs/techniques.md, H3 attention arms): the fastest Sol-H3 route that passes the lossy gate."
sharpness_ratio = 1.02
jitter_ratio = 1.05
note = "The gate numbers are against our own dense Sol-H3 arm, not against upstream."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00614

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026091001-7421/sol-h3/summary.json"
date = "2026-10-26"

