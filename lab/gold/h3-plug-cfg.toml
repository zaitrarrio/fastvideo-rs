# Gold standard of `h3-plug-cfg` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# MiniMax-H3 + the LongLive-Plug CFG LoRA (rank 128) as an unmerged branch: the base 50-point grid (49 positive forwards, shifts 12 / 3, Euler), dense attention, MXFP8 base.

schema = 1

[model]
variant = "h3-plug-cfg"
family = "h3"
profile = "h3/plug_h3_cfg_dense"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1344
height = 768
frames = 124
fps = 24
steps = 49
prompt_set = "scripts/gpu/prompts-eval.json (the five gate prompts)"
note = "No gold run yet: the variant was added on 2026-11-18 with the adapter as an unmerged branch (FASTVIDEO_H3_LORA_BRANCH). The base is already guidance-distilled, so the adapter has no serving value of its own (docs/serve/research-longlive.md §12.4); served for use with downstream H3 variants."

[latency]

[quality]

[cost]
usd_per_hr = 2.49

[[source]]
fields = []
path = "docs/techniques.md"
heading = "LongLive-Plug recipes"
date = "2026-11-18"
note = "The recipe (base MiniMax-H3 + the LongLive-Plug adapter), the branch-against-merge rule and the env knob; the served variants. Not a D2 source; named here so D3 knows where to look."

[[source]]
fields = []
path = "docs/serve/research-longlive.md"
heading = "12.7 Five-prompt check against base H3: results"
date = "2026-10-06"
note = "The existing Plug numbers, measured with the adapter MERGED into the bf16 weights before MXFP8 (the old path), on an earlier binary: h3-plug-4step dense 4 forwards 32.65 s denoise / 39.7 s per clip at 1344x768x124, peak 57.7 GiB; h3-plug-cfg 98.50 s denoise / 101.8 s (§12.3, 480p). Not this variant's path (the branch keeps the whole adapter; the merge kept a third of it in bf16 and a tenth in MXFP8, docs/techniques.md), so no field is copied; the gold run measures the served default."

[[source]]
fields = ["cost.usd_per_hr"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "H3 NVFP4 tier: three speed / quality options (2026-10-14)"
date = "2026-10-14"
note = "RTX PRO 6000 at $2.49/hr in EU-RO-1, the most recent dated price of the class. Older: $2.09/hr in EUR-IS-1 (docs/perf/raw-inference.md 2026-09-30, docs/perf/sol-bench.md 2026-10-06); $2.59/hr for the Workstation Edition in EU-RO-1 (docs/perf/h3-vae-decode-speed.md 2026-10-14). usd_per_clip = usd_per_hr x latency.p50_s / 3600, derived once a gold run gives p50_s."

