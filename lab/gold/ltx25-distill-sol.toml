# Gold standard of `ltx25-distill-sol` (ltx2, turbo): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as ltx-turbo (fal lightricks/ltx-2.5 /fast): LTX-2.5 distilled two-stage, Sol stage 2.

schema = 1

[model]
variant = "ltx25-distill-sol"
family = "ltx2"
profile = "ltx2/ltx25_distill_sol"

[tier]
name = "turbo"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1280
height = 768
frames = 121
fps = 24
steps = 11
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
note = "steps = 8 stage-1 + 3 stage-2. The 720p tier generated at 1280x768 (two-stage canvas multiple of 64, padded and cropped as the server does). fv-gpucheck ltx2 gen --techniques ltx2/ltx25_distill_sol --model-version 2.5 --two-stage --text resident --offload none, conv VAE, audio on. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5."

[workload.upstream]
target = "ltx25-512p"
image = "sol-ltx25"
rev = "fd4ded7"

[latency]
measures = "gen"
p50_s = 10.04
min_s = 9.69
max_s = 10.08
denoise_s = 8.53
decode_s = 1.46
load_s = 66.1
peak_gib = 66.0
note = "peak_gib is the process peak with Gemma resident before it is dropped after encoding; the timed-run peak is 43.3 GiB. Denoise covers stage 1, the upsample (0.49-0.55 s, the one weight transfer in the timed region) and stage 2."

[quality]
cell = "oracle: 768x512x121, Sol stage 2 (the arms differ only in stage 2), the matrix prompt, seed 1024; sol-engine gpu_infer.py on Lightricks/LTX-2 fd4ded7, draws, text and the stage-2 entry state injected."
oracle = "pass: stage 1 is the dense arm's (identical run); the Sol stage 2 adds the expected top-k selection spread on top of dense (s2 blocks 2.9e-3 / 8.7e-3 / 2.9e-2 / 2.3e-2, s2 latents 1.8e-2 / 7.4e-2 / 0.125) and stays within the bf16/f32 floor (docs/oracle.md)."
note = "This tier is the baseline of the LTX draft; no gate run of it against a baseline."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00694

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

