# Gold standard of `fasth3-4step-vsa-480p-taeh3` (h3, draft): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.

schema = 1

[model]
variant = "fasth3-4step-vsa-480p-taeh3"
family = "h3"
profile = "h3/fasth3_4step_vsa"

[tier]
name = "draft"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
steps = 4
note = "The turbo recipe (h3/fasth3_4step_vsa, 4step-vsa) decoded by TAEH3 at its 480p canvas. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5. Run before the MXFP8 video-decoder default: reproduce with FASTVIDEO_H3_VAE_MXFP8=0 (bf16 video decode, the default before 2026-10-14). TAEH3 decodes without the official decoder's linears, so the switch does not touch its decode (docs/techniques.md, H3 VAE decode speed); it is named so the cell is exact."

[workload.env]
FASTVIDEO_H3_VAE_MXFP8 = "0"

[latency]
measures = "gen"
p50_s = 7.35
min_s = 7.33
max_s = 7.37
denoise_s = 7.04
decode_s = 0.24
load_s = 117.4
peak_gib = 57.6

[quality]
gate = "fail: TAEH3 fails the gate's sharpness floor against its official-VAE twin (the turbo recipe at 480p); the frames are the same picture, softer. Never a default: the draft / fast-preview decoder by design (owner decision 2026-10-14, docs/perf/h3-nvfp4-tier-options.md decision 2)."
cell = "h3arms run 2c637f7 (RTX PRO 6000, 2026-09-27), 832x480x124, the five-prompt set, medians: TAEH3 against its twin with the official 36-block decoder in bf16 (the default before 2026-10-14)."
sharpness_ratio = 0.87
note = "vs the twin: LPIPS 0.123, PSNR 26.3 dB, sharpness 0.87 (docs/techniques.md, 2026-09-27). The TAEH3 measurements compare against our own official decode, not against upstream."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00508

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

