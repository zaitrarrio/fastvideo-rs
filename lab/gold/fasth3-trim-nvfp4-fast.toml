# Gold standard of `fasth3-trim-nvfp4-fast` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as h3-trim-nvfp4-fast: Trim NVFP4 with the VSA fine stage on sparse FP4 tensor cores; sm_120 only.

schema = 1

[model]
variant = "fasth3-trim-nvfp4-fast"
family = "h3"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "talking-head, one prompt of scripts/gpu/prompts-hd5.json"
seeds = [1024]
steps = 8
note = "GPU smoke of what shipped (2026-10-14): one RTX PRO 6000 (pod 2d8zzz9gsqsop3, US-NC-1, $2.49/hr, r2 mode), image fastvideo-rs-runtime:sha-b564268, recipe trim-8step-nvfp4-fp4attn, --warm then one timed generation, MXFP8 26-block decoder. One prompt, one run: no band."

[latency]
measures = "end_to_end"
p50_s = 9.27
denoise_s = 7.53
decode_s = 1.45
peak_gib = 21.1
note = "One timed generation (n = 1). The options run of the same day (c56aac4, bf16 decoder, before the glue fusions): 480p denoise 9.21 s, e2e 11.23 s, peak 19.7 GiB; 768p 24.64 / 29.31 / 27.1 (1.29x / 1.30x the V2-NVFP4 denoise, and under upstream's V2-NVFP4 10.25 / 29.3 s)."

[quality]
gate = "fail against every comparable arm (Trim bf16, Trim NVFP4, V2-NVFP4): a different model's sample, not gate-equivalent to any H3 tier; shipped as the opt-in fastest tier judged by eye (owner decision 2026-10-14, decision 3)."
cell = "c56aac4 options run, bf16 26-block decoder: 832x480x124, scripts/gpu/prompts-hd5.json, medians over the five prompts (480p values); Trim NVFP4 + FP4 attention against Trim bf16 (FASTVIDEO_H3_QUANT=off). Not the ship-smoke cell the latency comes from."
sharpness_ratio = 0.92
jitter_ratio = 0.82
note = "Gate at 480p vs Trim bf16: PSNR 11.4 dB, LPIPS 0.62, sharpness 0.92, jitter 0.82 (768p: 11.1 / 0.60 / 0.94 / 0.92)."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00641

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-trim-nvfp4-fast/summary.json"
date = "2026-10-26"

