heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026090916-e804, arm `fasth3-trim-nvfp4-fast`, exit 0, 22 s): one serve-engine job of the gold cell (lab/cells/gold-fasth3-trim-nvfp4-fast.toml: runpod-matrix.sh's default prompt, seed 1024, 832x480, 124 frames, 8 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 9.92 (text 0.44, denoise 7.51, video_decode 1.51, encode 0.12), load_s 11.4, peak_memory_mb 44100 (43.1 GiB). Host RAM (summary.json): peak 30016 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). None of its numbers is copied into this file: the file's [latency] is one measurement of another kind (latency.measures), load_s and peak_gib are of the process that measured, and a serve job includes the text encode of an uncached prompt and is one request."

