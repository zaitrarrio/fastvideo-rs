# Gold standard of `wan22-ti2v-5b` (wan, max): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as wan-max (fal-ai/wan): Wan 2.2 TI2V-5B, 50 UniPC steps, CFG 5; a 32 GB card.

schema = 1

[model]
variant = "wan22-ti2v-5b"
family = "wan"

[tier]
name = "max"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1280
height = 704
frames = 121
fps = 24
steps = 50
prompt_set = "the sol-bench prompt (one prompt; scripts/gpu/sol-bench-pod.sh)"
seeds = [1024]
note = "sol-bench phase A, instance 2: T2V 704x1280, 50 UniPC steps, CFG 5, shift 5, --warm, one timed request; RTX PRO 6000 Server (96 GB, sm_120, driver 595.91), EUR-IS-1, image fastvideo-rs-runtime@sha256:76aba91a (sha-c74c5f5), $2.09/hr. The run used the Wan defaults (the default DiT precision is bf16: docs/perf/raw-inference.md adds FASTVIDEO_WAN_QUANT=mxfp8 only in its max-speed arm); the quant pin (WAN_QUANT=off, Diffusers sigmas, full VAE) was made explicit from phase B on."

[workload.upstream]
target = "wan5b-base (sol-engine models/ at 670482d: 1x GB200, 5-prompt median 70.25 s)"

[latency]
measures = "end_to_end"
p50_s = 164.89
denoise_s = 151.14
decode_s = 13.71
load_s = 84.43
note = "One timed request (n = 1); total_s excludes load; text 0.01 s (cache hit). Upstream: 70.25 s on one GB200 (5-prompt median), so ours / theirs 2.35x on different hardware. Our EasyCache 0.036 arm (not served): 86.21 s, 1.91x over this base."

[quality]
cell = "oracle: Diffusers AutoencoderKLWan encode / decode of a 9-frame 704x1280 clip (fp32) and one bf16 WanTransformer3DModel forward per timestep layout, H100, wan/cfce899-09271307 (scripts/gpu/upstream/oracle_wan22.py)."
oracle = "module-level pass: VAE decode PSNR 65.7 dB (rel-L2 1.8e-3; exact f32 mode 1.4e-4), encode rel-L2 1.8e-3, DiT output rel-L2 2.7e-2 (t2v) / 1.5e-2 (i2v per-frame timesteps), from 3e-3 at the patch embedding and block 0 with no jump (docs/oracle.md). No decoded-clip comparison."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.11405

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

