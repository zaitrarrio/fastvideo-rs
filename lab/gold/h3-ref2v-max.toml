schema = 1

[model]
variant = "h3-ref2v-max"
family = "h3"
profile = "h3/h3_ref2va_base"

[tier]
name = "max"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1344
height = 768
frames = 124
fps = 24
prompt_set = "scripts/gpu/prompts-eval.json with a reference image (no run of this variant yet)"
steps = 49

[latency]

[quality]

