# Gold standard of `h3-lightx2v-turbo-v01` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# MiniMax-H3 + the lightx2v Turbo LoRA v0.1 (tree h3-turbo-loras/lightx2v-v0.1) folded at load; the v1.2 recipe otherwise (4 forwards, dense, MXFP8).

schema = 1

[model]
variant = "h3-lightx2v-turbo-v01"
family = "h3"
profile = "h3/lightx2v_turbo_dense"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1344
height = 768
frames = 124
fps = 24
prompt_set = "scripts/gpu/prompts-eval.json (the five gate prompts)"
steps = 4
note = "The latency numbers are the gold run's (7e580e5, 2026-10-26): one request of the gold cell (lab/cells/gold-h3-lightx2v-turbo-v01.toml: runpod-matrix.sh's default prompt, seed 1024, the served default), not the prompt set above."

[latency]
measures = "serve_job"
p50_s = 37.07
denoise_s = 31.37
decode_s = 4.84
peak_gib = 57.3
note = "One serve-engine job of the gold cell (n = 1, the gold run at 7e580e5, 2026-10-26): p50_s is submit to MP4, the text encode of the uncached prompt (0.41 s) included; decode_s is video_decode + encode."

[quality]

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.02564

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/h3-lightx2v-turbo-v01/summary.json"
date = "2026-10-26"

[[source]]
fields = []
path = "docs/ports/h3-turbo-loras.md"
heading = "7. Speed and quality"
date = "2026-10-23"
note = "The port document of the MiniMax-H3 Turbo LoRAs; not a D2 source, named here so D3 knows where to look."

[[source]]
fields = ["cost.usd_per_hr"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "H3 NVFP4 tier: three speed / quality options (2026-10-14)"
date = "2026-10-14"
note = "RTX PRO 6000 at $2.49/hr in EU-RO-1, the most recent dated price of the class. Older: $2.09/hr in EUR-IS-1 (docs/perf/raw-inference.md 2026-09-30, docs/perf/sol-bench.md 2026-10-06); $2.59/hr for the Workstation Edition in EU-RO-1 (docs/perf/h3-vae-decode-speed.md 2026-10-14). usd_per_clip = usd_per_hr x latency.p50_s / 3600, derived."

[[source]]
fields = ["latency.measures", "latency.p50_s", "latency.denoise_s", "latency.decode_s", "latency.peak_gib", "cost.usd_per_clip"]
path = "artifacts/runpod/gold/7e580e5-1026090916-e804/h3-lightx2v-turbo-v01/gpucheck-out/engine.json"
heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026090916-e804, arm `h3-lightx2v-turbo-v01`, exit 0, 222 s): one serve-engine job of the gold cell (lab/cells/gold-h3-lightx2v-turbo-v01.toml: runpod-matrix.sh's default prompt, seed 1024, 1344x768, 124 frames, 4 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 37.07 (text 0.41, denoise 31.37, video_decode 4.71, encode 0.13), load_s 183.7, peak_memory_mb 58674 (57.3 GiB). Host RAM (summary.json): peak 69035 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). load_s (183.7 s) is not in the fields: it was page-cache warm (fasth3-4step-vsa-nvfp4-taeh3 read h3-base earlier in the pod; no cold load of this variant was measured (the pod's first H3 arm, fasth3-4step-vsa-nvfp4-taeh3, loaded its own tree and h3-base in 88.1 s)). usd_per_clip = cost.usd_per_hr x latency.p50_s / 3600, derived."

