# Gold standard of `fastwan22-ti2v-5b` (wan, turbo): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as wan-turbo (fal-ai/wan): FastWan 2.2 TI2V-5B, 3 DMD steps; a 32 GB card.

schema = 1

[model]
variant = "fastwan22-ti2v-5b"
family = "wan"

[tier]
name = "turbo"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 121
fps = 24
steps = 3
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
note = "fv-gpucheck wan gen --preset fast_wan_2_2_ti2v_5b --steps 3 --flow-shift 5 --fps 24, FASTVIDEO_WAN_VAE=full (the full Wan 2.2 VAE), --mode fast, --dit-offload resident. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5."

[latency]
measures = "gen"
p50_s = 7.11
min_s = 7.1
max_s = 7.12
denoise_s = 1.55
decode_s = 5.54
load_s = 74.4
peak_gib = 38.2
note = "The decoder dominates: the full Wan 2.2 VAE takes 5.5 s of the 7.1 s gen at 480p (docs/perf/raw-inference.md, Notes)."

[quality]
note = "No quality measured in the raw-inference run; the Wan module oracle (docs/oracle.md) covers the base model's VAE and DiT, not this distilled checkpoint."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00492

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

