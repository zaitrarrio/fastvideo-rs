# Gold standard of `wan14b-plug-4step` (wan, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as wan14b-turbo: Wan 2.1 T2V-14B with the LongLive-Plug few-step and CFG adapters merged, 4 steps.

schema = 1

[model]
variant = "wan14b-plug-4step"
family = "wan"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 81
fps = 16
steps = 4
prompt_set = "scripts/gpu/prompts-eval.json"
note = "The latency numbers are the gold run's (7e580e5, 2026-10-26): one request of the gold cell (lab/cells/gold-wan14b-plug-4step.toml: runpod-matrix.sh's default prompt, seed 1024, the served default), not the prompt set above."

[latency]
measures = "serve_job"
p50_s = 22.27
denoise_s = 18.64
decode_s = 3.13
load_s = 155.5
note = "One serve-engine job of the gold cell (n = 1, the gold run at 7e580e5, 2026-10-26): p50_s is submit to MP4, the text encode of the uncached prompt (0.40 s) included; decode_s is video_decode + encode."

[quality]

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.0154

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/wan14b-plug-4step/summary.json"
date = "2026-10-26"

