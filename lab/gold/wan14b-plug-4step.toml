heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026090916-e804, arm `wan14b-plug-4step`, exit 0, 178 s): one serve-engine job of the gold cell (lab/cells/gold-wan14b-plug-4step.toml: runpod-matrix.sh's default prompt, seed 1024, 832x480, 81 frames, 4 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 22.27 (text 0.40, denoise 18.64, video_decode 3.03, encode 0.11), load_s 155.5, no peak_memory_mb (the Wan pipeline reports none). Host RAM (summary.json): peak 156004 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). usd_per_clip = cost.usd_per_hr x latency.p50_s / 3600, derived."

