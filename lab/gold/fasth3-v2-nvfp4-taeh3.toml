# Gold standard of `fasth3-v2-nvfp4-taeh3` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as h3-v2-nvfp4-preview: the fast preview (TAEH3) of h3-v2-nvfp4.

schema = 1

[model]
variant = "fasth3-v2-nvfp4-taeh3"
family = "h3"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "talking-head, one prompt of scripts/gpu/prompts-hd5.json"
seeds = [1024]
steps = 8
note = "GPU smoke of what shipped (2026-10-14): the v2-nvfp4 recipe decoded by TAEH3 (h3 vae=taeh3), one RTX PRO 6000 (pod 2d8zzz9gsqsop3), --warm then one timed generation."

[latency]
measures = "end_to_end"
p50_s = 10.55
denoise_s = 10.09
decode_s = 0.13
peak_gib = 25.5
note = "One timed generation (n = 1). Option 5 (five prompts, same day): 480p denoise 11.92 s, TAEH3 0.14 s, end to end 12.19 s (-12 % vs the official decoder), peak 26.8 GiB; 768p 31.88 / 0.44 / 32.95 / 34.2 (-10 %)."

[quality]
gate = "fail: sharpness floor against the official decoder on every prompt at both canvases (0.894 at 480p, 0.882 at 768p; floor 0.95); the frames are the same picture, softer. The fast preview by design (owner decision 2026-10-14, decision 2), never a default."
cell = "c56aac4 options run (option 5): 832x480x124, scripts/gpu/prompts-hd5.json, medians over the five prompts; TAEH3 against the official 36-block decoder with MXFP8 linears on the same latents (the tier's decoder then; the published NVFP4 VAE since decision 1). Not the ship-smoke cell the latency comes from."
sharpness_ratio = 0.894
jitter_ratio = 0.989
note = "vs the official VAE at 480p: PSNR 24.8 dB, LPIPS 0.170 [0.11-0.20], sharpness 0.894 [0.855-0.905], jitter 0.989; 768p 27.3 dB / 0.149 / 0.882 / 0.965. Against our own decode, not upstream."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.0073

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-v2-nvfp4-taeh3/summary.json"
date = "2026-10-26"

