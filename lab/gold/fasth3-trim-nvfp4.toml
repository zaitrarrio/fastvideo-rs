# Gold standard of `fasth3-trim-nvfp4` (h3, untiered): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as h3-trim-nvfp4: the Trim with the release's NVFP4 DiT, bf16 VSA; opt-in, NVFP4 tensor cores only.

schema = 1

[model]
variant = "fasth3-trim-nvfp4"
family = "h3"

[tier]
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 832
height = 480
frames = 124
fps = 24
prompt_set = "scripts/gpu/prompts-hd5.json (5 prompts, each with its own seed: talking-head 1024, three at 42, h3-demo 0)"
seeds = [1024, 42, 0]
steps = 8
note = "One RTX PRO 6000 pod (EU-RO-1, $2.49/hr), image fastvideo-rs-runtime:sha-b564268 with the branch's fv-gpucheck at c56aac4, one process per arm and canvas, --warm, medians over the five prompts; end to end = total_s minus text time; peak = in-process device maximum. The options run (c56aac4) decoded with the Trim's 26-block VAE in bf16; reproduce with FASTVIDEO_H3_VAE_MXFP8=0 (bf16 video decode, the default before 2026-10-14; the 26-block decoder's MXFP8 default came later the same day, docs/perf/h3-vae-decode-speed.md §6)."

[workload.env]
FASTVIDEO_H3_VAE_MXFP8 = "0"

[latency]
measures = "end_to_end"
p50_s = 13.04
denoise_s = 11.02
decode_s = 1.91
peak_gib = 20.3
note = "Row 'Trim NVFP4 (bf16 VSA, as wired by #105)', 480p: denoise 11.02 s (1.374 s per forward), VAE 1.91 s (bf16 decoder), end to end 13.04 s, peak 20.3 GiB; 768p 32.65 / 4.51 / 37.35 / 27.9. Before the glue fusions and lazy step events that cut the fast variant's denoise from 9.21 to 7.53 s."

[quality]
gate = "fail vs Trim bf16 (the same DiT in bf16): a different sample (PSNR 12.1 dB, LPIPS 0.60 at 480p; 2 of 5 prompts fail at 480p, 5 of 5 at 768p), as docs/ports/h3-trim.md §5.4 found. vs V2-NVFP4: another model (PSNR 10.2 dB, LPIPS 0.66)."
cell = "c56aac4 options run, bf16 26-block decoder: 832x480x124, scripts/gpu/prompts-hd5.json, medians over the five prompts (480p values); Trim NVFP4 against Trim bf16 (FASTVIDEO_H3_QUANT=off), each in its own process."
sharpness_ratio = 1.01
jitter_ratio = 1.08
note = "Gate medians at 480p vs Trim bf16: sharpness 1.01 [0.96-1.43], jitter 1.08 [0.85-1.31]."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.00902

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-trim-nvfp4/summary.json"
date = "2026-10-26"

[[source]]
fields = ["latency.measures", "latency.p50_s", "latency.denoise_s", "latency.decode_s", "latency.peak_gib", "quality.gate", "quality.cell", "quality.sharpness_ratio", "quality.jitter_ratio", "workload"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "Option 7: FastH3 Trim 8-step NVFP4 (`fasth3-trim-8step-nvfp4`)"
date = "2026-10-14"
note = "Speed table row 'Trim NVFP4 (bf16 VSA, as wired by #105)' and quality table row 'Trim bf16 -> Trim NVFP4'."

[[source]]
fields = ["cost.usd_per_hr", "cost.usd_per_clip"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "H3 NVFP4 tier: three speed / quality options (2026-10-14)"
date = "2026-10-14"
note = "RTX PRO 6000 at $2.49/hr in EU-RO-1, the most recent dated price of the class. Older: $2.09/hr in EUR-IS-1 (docs/perf/raw-inference.md 2026-09-30, docs/perf/sol-bench.md 2026-10-06); $2.59/hr for the Workstation Edition in EU-RO-1 (docs/perf/h3-vae-decode-speed.md 2026-10-14). usd_per_clip = usd_per_hr x latency.p50_s / 3600, derived."

[[source]]
fields = []
path = "artifacts/runpod/gold/7e580e5-1026090916-e804/fasth3-trim-nvfp4/gpucheck-out/engine.json"
heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026090916-e804, arm `fasth3-trim-nvfp4`, exit 0, 23 s): one serve-engine job of the gold cell (lab/cells/gold-fasth3-trim-nvfp4.toml: runpod-matrix.sh's default prompt, seed 1024, 832x480, 124 frames, 8 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 11.50 (text 0.48, denoise 9.02, video_decode 1.51, encode 0.11), load_s 11.2, peak_memory_mb 44643 (43.6 GiB). Host RAM (summary.json): peak 32923 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). Its times are not this file's: the file's latency measures a different quantity (latency.measures), and a serve job includes the text encode of an uncached prompt and is one request."

[[gap]]
