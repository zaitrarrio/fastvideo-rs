# Gold standard of `ltx25-distill-sol-nvfp4-taehv` (ltx2, draft): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as ltx-draft: Sol stage 2, NVFP4 video FFN, the wide LTX tiny autoencoder; its own process (NVFP4 is a load-time setting).

schema = 1

[model]
variant = "ltx25-distill-sol-nvfp4-taehv"
family = "ltx2"
profile = "ltx2/ltx25_distill_sol_nvfp4"

[tier]
name = "draft"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1280
height = 768
frames = 121
fps = 24
steps = 11
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
note = "steps = 8 stage-1 + 3 stage-2. The max-speed arm of the LTX turbo cell: ltx2/ltx25_distill_sol_nvfp4 (NVFP4 video FFN, sm_120) + --ltx-tae-weights taeltx2_3_wide, which is this variant's configuration. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5."

[latency]
measures = "gen"
p50_s = 7.38
min_s = 7.25
max_s = 7.5
denoise_s = 6.92
decode_s = 0.4
load_s = 54.8
peak_gib = 55.9
note = "peak_gib is the process peak with Gemma resident before it is dropped; the timed-run peak is 34.9 GiB. The TAE saves 1.1 s of decode against the conv VAE of the turbo tier."

[quality]
note = "No quality was measured in the raw-inference run; the draft tier is defined as the faster configuration that does not pass the quality gate (fastvideo-manifest Tier::Draft)."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.0051

[last_validated]
# empty: never validated by fv-lab (plan D1); commit, run and date land here.

