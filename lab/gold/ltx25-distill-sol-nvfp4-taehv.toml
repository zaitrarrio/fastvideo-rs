# Gold standard of `ltx25-distill-sol-nvfp4-taehv` (ltx2, draft): docs/adr/0009-gold-standard-files.md.
# Every number is copied from the [[source]] that cites it; absent numbers are listed under [[gap]].
# `fv-lab run gold` (plan D1/D3) fills [last_validated] and replaces these with its own run record.
# Served as ltx-draft: Sol stage 2, NVFP4 video FFN, the wide LTX tiny autoencoder; its own process (NVFP4 is a load-time setting).

schema = 1

[model]
variant = "ltx25-distill-sol-nvfp4-taehv"
family = "ltx2"
profile = "ltx2/ltx25_distill_sol_nvfp4"

[tier]
name = "draft"
gpu = "RTX PRO 6000 Blackwell"
sm = 120
vram_gib = 96
offer = "runpod: NVIDIA RTX PRO 6000 Blackwell Server Edition, EU-RO-1 (plan §1: the gold-standard GPU)"

[workload]
width = 1280
height = 768
frames = 121
fps = 24
steps = 11
prompt_set = "raw5: one fox prompt x 5 (artifacts/perf/raw-inference/bench.sh)"
seeds = [7]
note = "steps = 8 stage-1 + 3 stage-2. The max-speed arm of the LTX turbo cell: ltx2/ltx25_distill_sol_nvfp4 (NVFP4 video FFN, sm_120) + --ltx-tae-weights taeltx2_3_wide, which is this variant's configuration. fv-gpucheck straight from the CLI: everything resident, one untimed warm-up, then 5 timed generations of the raw5 set (one fox prompt x 5, seed 7); gen = total_s - text_s (text cached, no MP4; PNG frames outside the timed region). Median (min-max) of the 5."

[latency]
measures = "gen"
p50_s = 7.38
min_s = 7.25
max_s = 7.5
denoise_s = 6.92
decode_s = 0.4
load_s = 54.8
peak_gib = 55.9
note = "peak_gib is the process peak with Gemma resident before it is dropped; the timed-run peak is 34.9 GiB. The TAE saves 1.1 s of decode against the conv VAE of the turbo tier."

[quality]
note = "No quality was measured in the raw-inference run; the draft tier is defined as the faster configuration that does not pass the quality gate (fastvideo-manifest Tier::Draft)."

[cost]
usd_per_hr = 2.49
usd_per_clip = 0.0051

[last_validated]
commit = "7e580e5"
run = "artifacts/runpod/gold/7e580e5-1026091001-7421/ltx25-distill-sol-nvfp4-taehv/summary.json"
date = "2026-10-26"

[[source]]
fields = ["latency.measures", "latency.p50_s", "latency.min_s", "latency.max_s", "latency.denoise_s", "latency.decode_s", "latency.peak_gib", "workload"]
path = "docs/perf/raw-inference.md"
heading = "RTX PRO 6000 (sm_120)"
date = "2026-09-30"
note = "Row 'LTX-2.5 turbo, 1280x768x121, max: NVFP4 FFN + TAE': gen 7.38 (7.25-7.50) s, denoise 6.92 s, decode 0.40 s, peak 55.9 GiB (timed 34.9)."

[[source]]
fields = ["latency.load_s"]
path = "artifacts/perf/raw-inference/rtx-pro-6000-summary.json"
heading = "ltx-max"
date = "2026-09-30"
note = "load_s."

[[source]]
fields = []
path = "docs/perf/sol-bench.md"
heading = "Phase A results (2026-10-06)"
date = "2026-10-06"
note = "The NVFP4 FFN with the conv VAE (FV_SKIP_TAE=1, so not this variant's decoder), one prompt, seed 1024: 1080p 20 s total 93.28 s (denoise 77.19, decode 13.89), stage 2 42.73 s against 66.78 s published on RTX 5090; 4K 5 s 134.62 s (its 49.0 s decode was a writer stall)."

[[source]]
fields = ["cost.usd_per_hr", "cost.usd_per_clip"]
path = "docs/perf/h3-nvfp4-tier-options.md"
heading = "H3 NVFP4 tier: three speed / quality options (2026-10-14)"
date = "2026-10-14"
note = "RTX PRO 6000 at $2.49/hr in EU-RO-1, the most recent dated price of the class. Older: $2.09/hr in EUR-IS-1 (docs/perf/raw-inference.md 2026-09-30, docs/perf/sol-bench.md 2026-10-06); $2.59/hr for the Workstation Edition in EU-RO-1 (docs/perf/h3-vae-decode-speed.md 2026-10-14). usd_per_clip = usd_per_hr x latency.p50_s / 3600, derived."

[[source]]
fields = []
path = "artifacts/runpod/gold/7e580e5-1026091001-7421/ltx25-distill-sol-nvfp4-taehv/gpucheck-out/engine.json"
heading = "checks"
date = "2026-10-26"
note = "The gold run at 7e580e5 (2026-10-26, ADR-0019 §16.7; run artifacts/runpod/gold/7e580e5-1026091001-7421, arm `ltx25-distill-sol-nvfp4-taehv`, exit 0, 80 s): one serve-engine job of the gold cell (lab/cells/gold-ltx25-distill-sol-nvfp4-taehv.toml: runpod-matrix.sh's default prompt, seed 7, 1280x768, 121 frames, 11 steps, the served default) on an RTX PRO 6000 Blackwell Server Edition at $2.49/hr (the run's pod.json). Check `timings`: submit_to_mp4_s 13.85 (text 6.57, denoise 6.36, video_decode 0.49, encode 0.10), load_s 66.0, peak_memory_mb 35884 (35.0 GiB). Host RAM (summary.json): peak 33914 MiB of the pod's 269889 MiB, oom_kills 0. decode_s = video_decode + encode, as docs/perf/tiers.md. load_s is the engine's load in the run's arm order: a tree an earlier arm read, or that the arm's own R2 fetch had just written, can load from the page cache (live.log). None of its numbers is copied into this file: the file's [latency] is one measurement of another kind (latency.measures), load_s and peak_gib are of the process that measured, and a serve job includes the text encode of an uncached prompt and is one request."

