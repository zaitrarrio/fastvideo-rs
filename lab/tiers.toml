# runpod-matrix.sh `oracle` with FV_ORACLE_TARGETS naming its nine tensor-diff
# targets (the clip-metric targets, ltx25-{i2v,kf,ref2v,a2v,a2v-i2v,a2v-guided,
# retake*,extend} and sfwan13, stay in the script, §15.6): one cell per target,
# its reference fetched from FV_ORACLE_URL. cell_timeout_s 5400 as
# scripts/gpu/oracle.sh passes FV_GEN_TIMEOUT_S. `pod up` needs FV_ORACLE_URL
# (--extra-env) and --cells (the targets the upstream pods make).
[[tier]]
name = "oracle"
description = "GPU oracle diff (docs/oracle.md): our H3 and LTX-2.5 runs on the upstream references' injected noise and text, compared tensor by tensor (needs FV_ORACLE_URL)"
provider = "runpod-pod"
gpu = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
gpu_count = 1
cloud = "SECURE"
region = "eu"
image = "runtime"
max_usd_per_hr = 2.5
wall_cap_s = 14400
cell_timeout_s = 5400
container_disk_gb = 120
weights = "volume"
preflight = ["fasth3-8step", "fasth3-4step-vsa", "fasth3-4step-dense", "sol-h3", "sol-h3-spark", "ltx25-two-stage"]
tae = true
cells = ["oracle-fasth3-8step", "oracle-fasth3-8step-vsa0", "oracle-fasth3-4step-vsa", "oracle-fasth3-4step-dense", "oracle-h3-ref2va-4step", "oracle-ltx25-512p", "oracle-ltx25-512p-dense", "oracle-ltx25-4k", "oracle-ltx25-4k-dense"]
