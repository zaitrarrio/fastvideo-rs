# ---- D4 (docs/adr/0023-lab-report-and-ci-bridge.md §3): the gold runs. Not a
# runpod-matrix.sh family: one cell per gold file (lab/gold/<variant>.toml), each
# the served variant through the serve engine at the gold canvas, generated by
# `fv-lab gold cells --write` (tests/gold_tier.rs holds them equal). The arms are
# named by variant id, which is how `fv-lab report tiers` finds them. The rtx6000
# tier's pod: the PRO 6000 every gold file's [tier] names, the same preflight
# cells, caps and TAE fetch. Weights `volume+r2` (docs/adr/0019-fv-lab.md §16):
# the trees on the EU volume are read from it, every other tree (Wan,
# LongLive, the NVFP4, trim, VDN and turbo-LoRA trees) is fetched from the R2
# weights store onto the container disk before the arms that read it, so every
# variant runs; a tree in neither is still recorded as skipped (weights
# incomplete). The container disk: the largest arm's R2 trees (h3-8step,
# 147.86 GB) plus the 120 GB every volume tier has, rounded up to 300 GB.
# The host-RAM floor (min_ram_gb, Runpod minRAMPerGPU; ADR-0019 §16.10): the
# largest host load of a gold arm is wan14b-plug-4step's, SIGKILLed (exit 137,
# nothing printed) 18 s into its load at e9b9435, on a pod with no floor. Its
# loader (wan::plug::load_merged_transformer) copies the whole DiT out of the
# mmapped shards into owned host tensors in the on-disk dtype, f32: about
# 57 GB of the 80.41 GB wan21-t2v-14b tree. It merges the two LoRA trees
# (3.68 GB) into that copy and keeps it while the pipeline loads the f32 text
# encoder (about 23 GB) beside it: about 80 GB of process memory at the peak.
# The page cache comes on top: the 84 GB the arm just fetched and the shards
# the copy reads, charged to the pod's cgroup and reclaimable only once
# written back. 192 GB per GPU is the 80 GB with the arm's 84 GB of trees
# cached and about 28 GB to spare, and the floor the upstream cells use
# (docs/oracle.md "Upstream cells: host RAM"). The runner records the pod's
# RAM limit in box.txt and each arm's peak and OOM kills in its summary.json:
# the evidence to lower it from.
[[tier]]
name = "gold"
description = "The gold runs (fv-lab run gold --all): every gold variant's canonical cell, the served variant through the serve engine at its gold canvas"
provider = "runpod-pod"
gpu = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
gpu_count = 1
cloud = "SECURE"
region = "eu"
image = "runtime"
max_usd_per_hr = 2.5
wall_cap_s = 14400
cell_timeout_s = 3600
container_disk_gb = 300
min_ram_gb = 192
weights = "volume+r2"
preflight = ["fasth3-8step", "fasth3-4step-vsa", "fasth3-4step-dense", "sol-h3", "sol-h3-spark", "ltx25-two-stage"]
tae = true
cells = [
  "gold-fasth3-4step-vsa-480p-taeh3",
  "gold-fasth3-4step-vsa-nvfp4-taeh3",
  "gold-fasth3-4step-vsa-nvfp4",
  "gold-fasth3-4step-vsa-taeh3",
  "gold-fasth3-4step-vsa",
  "gold-fasth3-8step-dense",
  "gold-fasth3-trim-8step",
  "gold-fasth3-trim-nvfp4-fast",
  "gold-fasth3-trim-nvfp4",
  "gold-fasth3-v2-nvfp4-taeh3",
