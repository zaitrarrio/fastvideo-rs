# lab/upstream.toml: the upstream reference stacks `fv-lab oracle` brings up
# (docs/adr/0019-fv-lab.md §19, schema crates/fastvideo-lab/schemas/upstream.v1.json).
# One [[stack]] per upstream image: the Python references (FastVideo,
# sol-engine LTX-2.5) that write the dumps the `oracle` tier's cells read as
# `{ref}`. Its pod is `runpod-http.sh upstream`'s (the image
# ghcr.io/zaitrarrio/fastvideo-rs-upstream-<image>:<tag>, scripts/gpu/upstream/pod.sh
# with UP_STEPS="info:box <the selected targets' steps> oracle:<targets>")
# on fv-deploy's guards (price cap, $8 floor, EU volume, backstop at
# wall_cap_s, ready within 600 s in at most 3 cycles), as `fv-lab pod up`'s.
# Each [[stack.target]] is the `[reference] target` of one oracle cell
# (lab/cells/oracle-<target>.toml) and the weight steps its reference needs
# (`steps`; `r2`: trees fetched from the R2 weights store, with the pod's
# container disk raised to the target's `container_disk_gb`).
# Values from scripts/gpu/oracle.sh (start_up; deleted in ADR-0019 §22.20, read it
# with git show 7e513f6a:scripts/gpu/oracle.sh) and the §15.7 GPU check.
schema = 1

# FastVideo (FastH3 8-step V2, the FastH3 4-step LoRAs, the H3 Ref2VA
# pipeline, SF-Wan 1.3B, the Wan 2.2 TI2V-5B modules through Diffusers):
# oracle.sh's `fastvideo` pod. min_ram_gb 192: the LoRA
# conversion keeps a host copy of the 35B DiT beside the offloaded text
# encoder (docs/oracle.md "Upstream cells: host RAM"; the 2026-10-26 rerun).
[[stack]]
name = "fastvideo"
description = "FastVideo references: FastH3 8-step V2, the FastH3 4-step VSA / dense LoRAs, H3 Ref2VA, SF-Wan 1.3B, Wan2.2 TI2V-5B and FastWan2.2 TI2V-5B modules (Diffusers)"
image = "fastvideo"
gpu = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
gpu_count = 1
cloud = "SECURE"
region = "eu"
max_usd_per_hr = 2.5
wall_cap_s = 14400
container_disk_gb = 150
min_ram_gb = 192
cell_timeout_s = 7200
env = ["FASTVIDEO_DUMP_OPS=0,1,24,47"]

# The 8-step checkpoint's view (its h3-8step tree is not on the EU volume:
# the runtime arms skip on `weights incomplete`) and the Diffusers view, as
# oracle.sh's union for any fasth3-* target.
[[stack.target]]
name = "fasth3-8step"
steps = ["weights:fasth3-8step", "weights:h3-diffusers"]

[[stack.target]]
name = "fasth3-8step-vsa0"
steps = ["weights:fasth3-8step", "weights:h3-diffusers"]

# The LoRA targets read the Diffusers view only (the §15.7 check's UP_STEPS).
[[stack.target]]
name = "fasth3-4step-vsa"
steps = ["weights:h3-diffusers"]

[[stack.target]]
name = "fasth3-4step-dense"
steps = ["weights:h3-diffusers"]

# oracle_ref2va builds the Diffusers view itself when it is missing.
[[stack.target]]
name = "h3-ref2va-4step"
steps = []

# SF-Wan 1.3B (oracle_sfwan; the oracle-r2 tier's cell, ADR-0019 §21): its
# tree is R2-only since 2026-10-13, so the step r2:sfwan21-1.3b fetches it
# (28.93 GB) onto the container disk at $UW/sfwan21-1.3b (pod.sh weights_r2;
# never the volume), with the R2 key as Runpod secret references in the pod's
# env, handed to the plan step alone. 180 GB with it (the stack's 150 and the
# tree); a run without it keeps the stack's 150 and no R2 key.
[[stack.target]]
name = "sfwan13"
steps = []
r2 = ["sfwan21-1.3b"]
container_disk_gb = 180

# The Wan 2.2 TI2V-5B modules through Diffusers (upstream/oracle.sh oracle_wan22
# and oracle_fastwan22, oracle_wan22.py; the `wan` tier's cells
# wan-wan22-ti2v-oracle and wan-fastwan22-ti2v-oracle, ADR-0019 §22, S6): the
# base checkpoint, and FastWan2.2 TI2V-5B FullAttn with the DiT at its DMD
# timestep 757. Both trees are R2-only since 2026-10-13, so each target's step
# r2:<tree> fetches it onto the container disk at $UW/<tree> (pod.sh
# weights_r2), read from there when complete, else from the volume as before
# (oracle.sh's fallback, as oracle_sfwan's, §21.2; it reaches nothing today: the
# EU volume holds H3 and LTX only, so the r2 step is what makes the reference).
# 210 GB each: the stack's 150
# and both trees (34.20 + 24.20 GB), since the `wan` tier's two oracle cells run
# together (§22.18) and the pod gets the largest selected target's disk, not
# the sum.
[[stack.target]]
name = "wan22-ti2v"
steps = []
r2 = ["wan22-ti2v-5b"]
container_disk_gb = 210

[[stack.target]]
name = "fastwan22-ti2v"
steps = []
r2 = ["fastwan22-ti2v-5b"]
container_disk_gb = 210

# sol-engine LTX-2.5 (the distilled two-stage): oracle.sh's `sol-ltx25` pod.
# RECON_ACCEPT_MISMATCH=1: two of the single-file packs rebuilt from the
# Diffusers copy carry the Diffusers numbers (upstream/pod.sh weights_ltx25).
# No host-RAM floor: none measured for these references yet.
# hub_token: weights:ltx25 / weights:ltx25-dev read the gated Hub repository
# Lightricks/LTX-2.5 (reconstruct.py's range reads), so the pod gets HF_TOKEN
# as the Runpod secret reference {{ RUNPOD_SECRET_fv_hf_token }} (the owner's
# secret, docs/ops/runpod-secrets.md; ADR-0019 §20.7 "First attempt").
[[stack]]
name = "sol-ltx25"
description = "sol-engine LTX-2.5 references: the distilled two-stage at 512p and 4k, Sol and dense stage 2; image and keyframe conditioning, IC-LoRA reference-to-video, audio-to-video (guided too), retake and extend"
image = "sol-ltx25"
gpu = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
gpu_count = 1
cloud = "SECURE"
region = "eu"
max_usd_per_hr = 2.5
wall_cap_s = 14400
container_disk_gb = 250
cell_timeout_s = 7200
env = ["FASTVIDEO_DUMP_OPS=0,1,24,47", "RECON_ACCEPT_MISMATCH=1"]
hub_token = true

[[stack.target]]
name = "ltx25-512p"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-512p-dense"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-4k"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-4k-dense"
steps = ["weights:ltx25"]

# The clip-metric targets (ADR-0019 §20; scripts/gpu/upstream/oracle.sh
# run_oracle's order): the distilled DiT's packs (weights:ltx25) for all but
# the guided audio-to-video, which reads the dev DiT and the distilled LoRA
# (weights:ltx25-dev), as oracle.sh's ltxw. ltx25-ref2v's IC-LoRA is read from
# the volume as it is (ltx25-ic-lora-ingredients).
[[stack.target]]
name = "ltx25-i2v"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-kf"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-ref2v"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-a2v"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-a2v-i2v"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-retake"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-retake-v"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-retake-a"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-extend"
steps = ["weights:ltx25"]

[[stack.target]]
name = "ltx25-a2v-guided"
steps = ["weights:ltx25-dev"]
