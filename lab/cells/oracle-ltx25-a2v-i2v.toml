# runpod-matrix.sh `oracle`, clip-metric target ltx25-a2v-i2v (docs/oracle.md; docs/adr/0019-fv-lab.md §15, §20): the upstream
# reference's dump fetched into {ref}, its noise and text (and conditioning) injected into our run, our run dumped the
# same way (blocks 0,1,24,47) and compared tensor by tensor (compare-dumps, its lines echoed into the log).
# Then audio-to-video with a first frame: -ownaud as for ltx25-a2v (it also encodes the image on our own);
# the clips copied and probed, ours against the reference's, then the pinned frame of each against the image
# (cover + centre crop), into oracle-<target>-frames/metrics.txt, echoed after each part ([[metric]], ADR-0019 §20).
# An extra cell of the `oracle` tier: run when --cells names its arms. After the cell the dumps and the reference are
# removed (the clips stay in the report).
schema = 1
name = "oracle-ltx25-a2v-i2v"
description = "Oracle diff of LTX-2.5 audio-to-video with the beach image as the first frame at 512p, against the sol-ltx25 reference; the clips' streams, the clip and the pinned frame"

[workload]
model = "ltx2"
prompt = "A calm beach at golden hour, gentle waves rolling in, while a narrator speaks."
seed = 1024
frames = 121
width = 768
height = 512
note = "LTX_A2V_I2V_PROMPT of scripts/gpu/upstream/oracle.sh (FV_LTX_A2V_I2V_PROMPT's default); --dense-stage2 --audio --image"

[reference]
target = "ltx25-a2v-i2v"

[lists]
gen = [
  "--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}",
  "--dense-stage2", "--audio", "{root}/scripts/gpu/fixtures/speech-flite-44k.flac", "--image",
  "{root}/scripts/gpu/fixtures/ti2v-beach-832x480.jpg", "--prompt", "{prompt}", "--seed", "{seed}",
  "--two-stage", "--text", "streamed", "--clip", "{runs}/{arm}/frames"
]

[[arm]]
name = "oracle-ltx25-a2v-i2v"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-a2v-i2v-dump"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-a2v-i2v-dump"]

[[arm]]
name = "oracle-ltx25-a2v-i2v-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-a2v-i2v-dump"]
requires = ["{ref}", "{runs}/oracle-ltx25-a2v-i2v-dump"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-ltx25-a2v-i2v-ownaud"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-a2v-i2v-dump-ownaud", "FASTVIDEO_INJECT_COND=0",
  "FASTVIDEO_INJECT_PIXELS=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-a2v-i2v-dump-ownaud"]

[[arm]]
name = "oracle-ltx25-a2v-i2v-ownaud-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-a2v-i2v-dump-ownaud"]
requires = ["{ref}", "{runs}/oracle-ltx25-a2v-i2v-dump-ownaud"]
echo = ["compare-dumps"]

# The clips copied and probed (streams, rates, frame counts).
[[metric]]
report = "{runs}/oracle-ltx25-a2v-i2v-frames"
tag = "ltx25-a2v-i2v-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-a2v-i2v/frames/output.mp4" },
  { label = "ownaud", path = "{runs}/oracle-ltx25-a2v-i2v-ownaud/frames/output.mp4" },
  { label = "reference", path = "{ref}/ref.mp4" },
]
missing = true
copy = true
measure = [
  { kind = "probe" },
]

# Ours against the reference's, every frame (both copies present).
[[metric]]
report = "{runs}/oracle-ltx25-a2v-i2v-frames"
tag = "ltx25-a2v-i2v-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-a2v-i2v-frames/ours.mp4" },
]
requires = ["{runs}/oracle-ltx25-a2v-i2v-frames/reference.mp4"]
measure = [
  { kind = "clip-vs-clip", against = { label = "reference", path = "{runs}/oracle-ltx25-a2v-i2v-frames/reference.mp4" } },
]
echo = true

# Then, as ltx25-i2v, the pinned frame of each clip against the image (ownaud stands for ownimg).
[[metric]]
report = "{runs}/oracle-ltx25-a2v-i2v-frames"
tag = "ltx25-a2v-i2v-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-a2v-i2v/frames/output.mp4" },
  { label = "ownaud", path = "{runs}/oracle-ltx25-a2v-i2v-ownaud/frames/output.mp4" },
  { label = "reference", path = "{ref}/ref.mp4" },
]
missing = true
copy = true
measure = [
  { kind = "frame-vs-image", frame = 0, image = "{root}/scripts/gpu/fixtures/ti2v-beach-832x480.jpg", width = 768, height = 512 },
]
echo = true
