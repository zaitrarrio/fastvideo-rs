# runpod-matrix.sh `wan`, its Wan2.2 TI2V-5B recipe block (docs/ports/wan.md; docs/adr/0019-fv-lab.md §22, S6): the
# checkpoint's recommended recipe (FastVideo WAN_2_2_TI2V_5B preset / the Diffusers model card): 704x1280, 121 frames
# at 24 fps, 50 UniPC steps, CFG 5, flow shift 5, FastVideo's Chinese negative prompt, warm, the full Wan 2.2 VAE;
# then TAEHV (taew2_2, opt-in for the base checkpoint: FASTVIDEO_WAN_VAE=taehv, read from FASTVIDEO_TAE_DIR, an
# error when missing) on the same recipe, compared; image-to-video at 480x832 (FastVideo resizes a TI2V image to that
# area) on scripts/gpu/fixtures/ti2v-beach-832x480.jpg with its own prompt; EasyCache, compared. The script's
# FV_PROMPTS prompt set is not a tier setting (fv-lab ignores it, §9.4). FASTVIDEO_TAE_DIR={tae} is each arm's env
# entry, as the script's since S6 (ADR-0019 §22.4, Addition 16). wan22-ti2v-5b (34.20 GB) is R2-only since
# 2026-10-13 (`weights = "volume+r2"`). Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "wan-wan22-ti2v-5b"
description = "Wan2.2 TI2V-5B at its recommended recipe (704x1280x121 at 24 fps, 50 UniPC steps, CFG 5, the full VAE): against TAEHV taew2_2 and EasyCache, and image-to-video at 480x832"

[workload]
model = "wan"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
note = "runpod-matrix.sh's default PROMPT and SEED; wan5b-i2v's prompt (the beach fixture's) and the negative prompt are literals of its argv, as the script's ti2v_prompt and wan_neg_cn"

[lists]
ti2v = ["--weights", "{weights}/wan22-ti2v-5b", "--preset", "wan_2_2_ti2v_5b", "--unipc", "--steps", "50", "--guidance",
  "5.0", "--flow-shift", "5.0", "--fps", "24", "--negative",
  "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走",
  "--seed", "{seed}", "--warm"]

[[arm]]
name = "wan5b"
gate = "wan22-ti2v-5b"
trees = ["wan22-ti2v-5b"]
env = ["FASTVIDEO_TAE_DIR={tae}"]
argv = ["--mode", "fast", "wan", "gen", "{@ti2v}", "--height", "704", "--width", "1280", "--num-frames", "121", "--prompt",
  "{prompt}", "--clip-dir", "{runs}/{arm}/frames"]

# TAEHV (taew2_2, opt-in for the base checkpoint) on the same recipe.
[[arm]]
name = "wan5b-taehv"
gate = "wan22-ti2v-5b"
trees = ["wan22-ti2v-5b"]
env = ["FASTVIDEO_TAE_DIR={tae}", "FASTVIDEO_WAN_VAE=taehv"]
argv = ["--mode", "fast", "wan", "gen", "{@ti2v}", "--height", "704", "--width", "1280", "--num-frames", "121", "--prompt",
  "{prompt}", "--clip-dir", "{runs}/{arm}/frames"]

# Image-to-video: the 832x480 fixture pinned to latent frame 0 (its tokens at timestep 0); one prompt.
[[arm]]
name = "wan5b-i2v"
gate = "wan22-ti2v-5b"
trees = ["wan22-ti2v-5b"]
env = ["FASTVIDEO_TAE_DIR={tae}"]
argv = ["--mode", "fast", "wan", "gen", "{@ti2v}", "--height", "480", "--width", "832", "--num-frames", "121", "--image",
  "{root}/scripts/gpu/fixtures/ti2v-beach-832x480.jpg", "--prompt",
  "Aerial drone shot of a tropical beach: turquoise sea waves roll in and break into white foam on the sand, the camera glides slowly forward along the shoreline, bright sunny day.",
  "--clip-dir", "{runs}/{arm}/frames"]

[[arm]]
name = "wan5b-easycache"
gate = "wan22-ti2v-5b"
trees = ["wan22-ti2v-5b"]
env = ["FASTVIDEO_TAE_DIR={tae}", "FASTVIDEO_WAN_SOL_CACHE=easycache"]
argv = ["--mode", "fast", "wan", "gen", "{@ti2v}", "--height", "704", "--width", "1280", "--num-frames", "121", "--prompt",
  "{prompt}", "--clip-dir", "{runs}/{arm}/frames"]

[[compare]]
baseline = "wan5b"
candidate = "wan5b-taehv"
after = "wan5b-taehv"

[[compare]]
baseline = "wan5b"
candidate = "wan5b-easycache"
