# runpod-matrix.sh `serve-engine`, its h3 group (docs/serve/design.md "GPU check"; docs/adr/0019-fv-lab.md §22, S3):
# the serve engine's CUDA backend (WP-11) against the CLI. First the CLI generation of the served `h3-turbo` recipe
# (FastH3 4-step VSA, `h3 gen`), then the same recipe, canvas, prompt and seed through EngineService + CudaBackend
# (`fv-gpucheck engine --model h3-turbo`): an MP4 out, its frames byte-compared with the CLI's (`--reference`), then a
# second job cancelled after step 2 (`--cancel-after-step`). The engine reads its tiny autoencoders from its default,
# `<weights root>/auxiliary/tae` (fv-gpucheck engine's `--tae-dir`, unset; the gold engine cells pass none): the
# script's `--tae-dir "$TAE"` was dropped from its engine arms in the same commit as this tier (§22, S3), an argv-only
# change where the volume's TAE copy is complete (bz0ofkfx45; on an R2 run the merged root's link to it). The script's
# removal of the PNG frames after the family (disk only: each arm's frames.sha256.json is written right after it) is
# not copied. Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "serve-engine-h3-turbo"
description = "h3-turbo (FastH3 4-step VSA) at 832x480, 124 frames: the CLI generation, then the same request through the serve engine (frames byte-compared with the CLI's, a second job cancelled after step 2)"

[workload]
model = "h3 engine"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
frames = 124
width = 832
height = 480
note = "runpod-matrix.sh's default PROMPT and SEED; the engine arm reads the CLI arm's frames as its reference, so it runs after it (FV_CELLS / --cells naming it alone compares with whatever frames are there, as the script's). Both arms share one AdaLN cache file ({runs}/h3-adaln.cache), as the script's: inert for this adapter recipe (ADR-0019 §22.2), kept for equality"

[lists]
geo = ["--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--prompt", "{prompt}", "--seed", "{seed}",
  "--adaln-cache", "{runs}/h3-adaln.cache"]

[[arm]]
name = "cli-h3-turbo"
gate = "fasth3-4step-vsa"
trees = ["h3-base", "FastH3-4-step-Preview-v1-LoRA"]
steps = 4
argv = ["--mode", "fast", "--techniques", "h3/fasth3_4step_vsa", "h3", "gen", "--weights", "{weights}/h3-base",
  "--h3-recipe", "4step-vsa", "{@geo}", "--text-encoder", "streamed", "--text-weights", "{weights}/h3-base",
  "--no-text-cache", "--no-mp4", "--clip-dir", "{runs}/{arm}/frames"]

[[arm]]
name = "engine-h3-turbo"
gate = "fasth3-4step-vsa"
trees = ["h3-base", "FastH3-4-step-Preview-v1-LoRA"]
steps = 4
argv = ["--keep-going", "--mode", "fast", "--techniques", "h3/fasth3_4step_vsa", "engine", "--model", "h3-turbo",
  "--weights-root", "{weights}", "{@geo}", "--text-encoder", "streamed", "--reference", "{runs}/cli-h3-turbo/frames",
  "--cancel-after-step", "2", "--clip-out", "{runs}/{arm}/out"]
