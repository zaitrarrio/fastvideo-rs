# sol-bench set b4 (was scripts/gpu/sol-bench-pod.sh FV_SOL_SET=b4, deleted after the GPU check of docs/adr/0019-fv-lab.md §23.7; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B: LingBot-Video MoE baseline on one prompt (all eight refiner steps).
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were lingbot-baseline 2400;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-b4"
description = "Phase B: LingBot-Video MoE baseline on one prompt (all eight refiner steps)"

[workload]
model = "lingbot"
note = "Set b4 of sol-bench-pod.sh. Does not fit one pod's deadline (about 3.6k s); d1 / f1 run it with --refiner-steps 1."

[[arm]]
name = "lingbot-baseline"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-gen",
  "--weights",
  "{weights}/lingbot-video-moe-30b-a3b",
  "--prompts",
  "{root}/scripts/gpu/sol/lingbot-t2v-val3.txt",
  "--num-prompts",
  "1",
  "--arm",
  "baseline",
  "--residency",
  "swap",
  "--seed",
  "42",
  "--clip",
  "{runs}/{arm}/clips",
]
