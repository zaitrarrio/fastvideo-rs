# runpod-matrix.sh `determinism` (docs/perf/determinism.md; docs/adr/0019-fv-lab.md §15): LTX-2.5 1080p 6 s text-to-video (the first run a conditioning-cache
# miss, the second a hit),
# run twice in one process (prompt set t2v-ab.json: run1, run2), once in a second process (t2v-c.json:
# run3) and once more with FASTVIDEO_SDPA_AUTO=timed (the old per-process timed pick, on t2v-ab.json: the
# speed baseline, reported, not judged), all with FASTVIDEO_DIGEST=1 (stage digests in stderr, into
# <arm>/digests.txt). After each arm its runs' frames and audio are hashed (det_hash, `[repeats]` hash =
# "run") and pruned to three keyframes; <runs>/determinism.txt reports every run against ltx-t2v-ab/run1.
# The prompt sets are written as the script's det_set writes them (`[[prompt_file]]`).
schema = 1
name = "determinism-ltx-t2v"
description = "LTX-2.5 1088x1920x145 T2V: two runs in one process, one in another, and the timed-pick control: byte identity"

[workload]
model = "ltx2"
prompt = "A red fox trots through fresh snow at dawn in a pine forest, its breath visible in the cold air, soft golden light, the camera tracks alongside at ground level, cinematic, shallow depth of field"
seed = 7
frames = 145
width = 1920
height = 1088
note = "the distilled two-stage default (Sol stage 2); FV_DET_T2V_PROMPT's default"

[[prompt_file]]
file = "t2v-ab.json"
names = ["run1", "run2"]

[[prompt_file]]
file = "t2v-c.json"
names = ["run3"]

[lists]
before = [
  "--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}",
  "--frame-rate", "24", "--two-stage", "--text", "streamed", "--prompt", "{prompt}", "--seed", "{seed}"
]
after = ["--clip", "{runs}/{arm}/frames"]

[[arm]]
name = "ltx-t2v-ab"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = ["FASTVIDEO_DIGEST=1"]
argv = ["{@before}", "--prompts", "{runs}/t2v-ab.json", "{@after}"]

[[arm]]
name = "ltx-t2v-c"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = ["FASTVIDEO_DIGEST=1"]
argv = ["{@before}", "--prompts", "{runs}/t2v-c.json", "{@after}"]

[[arm]]
name = "ltx-t2v-timed"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = ["FASTVIDEO_DIGEST=1", "FASTVIDEO_SDPA_AUTO=timed"]
argv = ["{@before}", "--prompts", "{runs}/t2v-ab.json", "{@after}"]

[repeats]
hash = "run"
reference = "ltx-t2v-ab/run1"
judged = ["ltx-t2v-ab", "ltx-t2v-c"]
controls = ["ltx-t2v-timed"]
keep = ["frame-000.png", "frame-072.png", "frame-120.png"]
