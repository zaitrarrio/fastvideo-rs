# runpod-matrix.sh `oracle`, clip-metric target ltx25-extend (docs/oracle.md; docs/adr/0019-fv-lab.md §15, §20): the upstream
# reference's dump fetched into {ref}, its noise and text (and conditioning) injected into our run, our run dumped the
# same way (blocks 0,1,24,47) and compared tensor by tensor (compare-dumps, its lines echoed into the log).
# Then retake / extend: -ownenc decodes and encodes the source (video and audio) on our own; then the clips
# (ours, ownenc, the reference's) copied and probed, their kept frames (outside the regenerated window) against the
# source, and ours against the reference's, into oracle-<target>-frames/metrics.txt ([[metric]], ADR-0019 §20).
# An extra cell of the `oracle` tier: run when --cells names its arms. After the cell the dumps and the reference are
# removed (the clips stay in the report).
schema = 1
name = "oracle-ltx25-extend"
description = "Oracle diff of LTX-2.5 extension of the beach push-in by 48 frames, against the sol-ltx25 reference; the clips' streams, the kept frames against the source, the clip against the reference's"

[workload]
model = "ltx2"
prompt = "The camera keeps pushing in slowly over the rocky beach at golden hour, waves rolling onto the sand, a narrator speaks calmly."
seed = 1024
frames = 121
width = 768
height = 512
note = "one distilled stage at the source size; LTX_EXTEND_PROMPT of scripts/gpu/upstream/oracle.sh (FV_LTX_EXTEND_PROMPT's default)"

[reference]
target = "ltx25-extend"

[lists]
gen = [
  "--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--edit",
  "extend:{root}/scripts/gpu/fixtures/beach-push-768x512-24fps.mp4:48:end", "--prompt", "{prompt}", "--seed",
  "{seed}", "--text", "streamed", "--clip", "{runs}/{arm}/frames"
]

[[arm]]
name = "oracle-ltx25-extend"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-extend-dump"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-extend-dump"]

[[arm]]
name = "oracle-ltx25-extend-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-extend-dump"]
requires = ["{ref}", "{runs}/oracle-ltx25-extend-dump"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-ltx25-extend-ownenc"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-extend-dump-ownenc", "FASTVIDEO_INJECT_COND=0",
  "FASTVIDEO_INJECT_PIXELS=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-extend-dump-ownenc"]

[[arm]]
name = "oracle-ltx25-extend-ownenc-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-extend-dump-ownenc"]
requires = ["{ref}", "{runs}/oracle-ltx25-extend-dump-ownenc"]
echo = ["compare-dumps"]

# The clips copied and probed, and the frames kept from the source (outside the regenerated window) against it.
[[metric]]
report = "{runs}/oracle-ltx25-extend-frames"
tag = "ltx25-extend-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-extend/frames/output.mp4" },
  { label = "ownenc", path = "{runs}/oracle-ltx25-extend-ownenc/frames/output.mp4" },
  { label = "reference", path = "{ref}/ref.mp4" },
]
missing = true
copy = true
measure = [
  { kind = "probe" },
  { kind = "kept-frames-vs-source", source = "{root}/scripts/gpu/fixtures/beach-push-768x512-24fps.mp4", select = 'lt(n\,105)', fps = 24 },
]

# Ours against the reference's, every frame (both copies present).
[[metric]]
report = "{runs}/oracle-ltx25-extend-frames"
tag = "ltx25-extend-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-extend-frames/ours.mp4" },
]
requires = ["{runs}/oracle-ltx25-extend-frames/reference.mp4"]
measure = [
  { kind = "clip-vs-clip", against = { label = "reference", path = "{runs}/oracle-ltx25-extend-frames/reference.mp4" } },
]
echo = true
