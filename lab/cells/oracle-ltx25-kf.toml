# runpod-matrix.sh `oracle`, clip-metric target ltx25-kf (docs/oracle.md; docs/adr/0019-fv-lab.md §15, §20): the upstream
# reference's dump fetched into {ref}, its noise and text (and conditioning) injected into our run, our run dumped the
# same way (blocks 0,1,24,47) and compared tensor by tensor (compare-dumps, its lines echoed into the log).
# Then the image-conditioning target: -ownenc encodes the reference's preprocessed pixels with our encoder
# (FASTVIDEO_INJECT_COND=0), -ownimg preprocesses and encodes on our own (and FASTVIDEO_INJECT_PIXELS=0); then the
# pinned output frames against the conditioning images (cover + centre crop to the canvas, ffmpeg SSIM / PSNR), ours,
# ownimg's and the reference's, into oracle-<target>-frames/metrics.txt ([[metric]], ADR-0019 §20).
# An extra cell of the `oracle` tier: run when --cells names its arms. After the cell the dumps and the reference are
# removed (the clips stay in the report).
schema = 1
name = "oracle-ltx25-kf"
description = "Oracle diff of LTX-2.5 keyframes (the beach image at frame 0, its zoom at frame 120) at 512p, dense stage 2, against the sol-ltx25 reference; the pinned frames against the images"

[workload]
model = "ltx2"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
frames = 121
width = 768
height = 512
note = "runpod-matrix.sh's default PROMPT and SEED; --dense-stage2, the beach image at frame 0 and its 1.35x zoom at pixel frame 120"

[reference]
target = "ltx25-kf"

[lists]
gen = [
  "--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}",
  "--dense-stage2", "--image", "{root}/scripts/gpu/fixtures/ti2v-beach-832x480.jpg", "--cond-image",
  "{root}/scripts/gpu/fixtures/ti2v-beach-zoom-832x480.jpg@120@1.0", "--prompt", "{prompt}", "--seed",
  "{seed}", "--two-stage", "--text", "streamed", "--clip", "{runs}/{arm}/frames"
]

[[arm]]
name = "oracle-ltx25-kf"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-kf-dump"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-kf-dump"]

[[arm]]
name = "oracle-ltx25-kf-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-kf-dump"]
requires = ["{ref}", "{runs}/oracle-ltx25-kf-dump"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-ltx25-kf-ownenc"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-kf-dump-ownenc", "FASTVIDEO_INJECT_COND=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-kf-dump-ownenc"]

[[arm]]
name = "oracle-ltx25-kf-ownenc-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-kf-dump-ownenc"]
requires = ["{ref}", "{runs}/oracle-ltx25-kf-dump-ownenc"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-ltx25-kf-ownimg"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-kf-dump-ownimg", "FASTVIDEO_INJECT_COND=0",
  "FASTVIDEO_INJECT_PIXELS=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-kf-dump-ownimg"]

[[arm]]
name = "oracle-ltx25-kf-ownimg-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-kf-dump-ownimg"]
requires = ["{ref}", "{runs}/oracle-ltx25-kf-dump-ownimg"]
echo = ["compare-dumps"]

# The pinned frames of each clip against the conditioning images (cover + centre crop to 768x512).
[[metric]]
report = "{runs}/oracle-ltx25-kf-frames"
tag = "ltx25-kf-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-kf/frames/output.mp4" },
  { label = "ownimg", path = "{runs}/oracle-ltx25-kf-ownimg/frames/output.mp4" },
  { label = "reference", path = "{ref}/ref.mp4" },
]
missing = true
copy = true
measure = [
  { kind = "frame-vs-image", frame = 0, image = "{root}/scripts/gpu/fixtures/ti2v-beach-832x480.jpg", width = 768, height = 512 },
  { kind = "frame-vs-image", frame = 120, image = "{root}/scripts/gpu/fixtures/ti2v-beach-zoom-832x480.jpg", width = 768, height = 512 },
]
echo = true
