# runpod-matrix.sh `det-short` (docs/perf/determinism.md "Results"; docs/adr/0019-fv-lab.md §15):
# the ltx-sage arm group, run three times (r1, r2, r3) in a fresh process each with its own caches (FASTVIDEO_CACHE and
# XDG_CACHE_HOME under the arm), (no timed control: Sage takes the long shapes, so the timed pick only
# moves cross-attention); every arm's frames hashed after it (sh_hash, `[repeats]`
# hash = "arm"), the report in <runs>/determinism.txt. Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "det-short-ltx-sage"
description = "LTX-2.5 as det-short-ltx with SageAttention2 (what ltx-pro serves on sm_120), three fresh processes"

[workload]
model = "ltx2"
prompt = "A red fox trots through fresh snow at dawn in a pine forest, its breath visible in the cold air, soft golden light, the camera tracks alongside at ground level, cinematic, shallow depth of field"
seed = 7
frames = 97
width = 1920
height = 1088
note = "FASTVIDEO_ATTN_SAGE=2; no timed control (Sage takes the long shapes)"

[lists]
det = [
  "--mode", "fast", "--techniques", "ltx2/ltx25_distill_dense", "ltx2", "gen", "--model-version", "2.5",
  "--weights", "{weights}/ltx25", "--dit", "{weights}/ltx25", "--two-stage", "--dense-stage2", "--height",
  "{height}", "--width", "{width}", "--num-frames", "{frames}", "--frame-rate", "24", "--text", "streamed",
  "--no-text-cache", "--prompt", "{prompt}", "--seed", "{seed}", "--clip", "{runs}/{arm}/frames"
]

[[arm]]
name = "ltx-sage-r1"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_CACHE={runs}/{arm}/cache", "XDG_CACHE_HOME={runs}/{arm}/cache", "FASTVIDEO_ATTN_SAGE=2"
]
argv = ["{@det}"]

[[arm]]
name = "ltx-sage-r2"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_CACHE={runs}/{arm}/cache", "XDG_CACHE_HOME={runs}/{arm}/cache", "FASTVIDEO_ATTN_SAGE=2"
]
argv = ["{@det}"]

[[arm]]
name = "ltx-sage-r3"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_CACHE={runs}/{arm}/cache", "XDG_CACHE_HOME={runs}/{arm}/cache", "FASTVIDEO_ATTN_SAGE=2"
]
argv = ["{@det}"]

[repeats]
hash = "arm"
reference = "ltx-sage-r1"
judged = ["ltx-sage-r1", "ltx-sage-r2", "ltx-sage-r3"]
keep = ["frame-000.png"]
