# sol-bench set b1 (was scripts/gpu/sol-bench-pod.sh FV_SOL_SET=b1, deleted after the GPU check of docs/adr/0019-fv-lab.md §23.7; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B: SANA-Video 2B baseline and full; Wan2.1 T2V-1.3B pinned base and fullstack over five prompts.
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were sana-baseline 900, sana-full 720, wan13-sol-base 720, wan13-sol-fullstack 480;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-b1"
description = "Phase B: SANA-Video 2B baseline and full; Wan2.1 T2V-1.3B pinned base and fullstack over five prompts"

[workload]
model = "sana-video wan"
note = "Set b1 of sol-bench-pod.sh. The Wan arms pin Diffusers UniPC sigmas, bf16 GEMMs and the full Wan VAE."

[[arm]]
name = "sana-baseline"
gate = "sana-video-2b-480p"
trees = ["sana-video-2b-480p"]
argv = [
  "--mode",
  "fast",
  "sana-video",
  "gen",
  "--weights",
  "{weights}/sana-video-2b-480p",
  "--prompt",
  "a corgi running on the beach",
  "--arm",
  "baseline",
  "--seed",
  "42",
  "--warm",
  "--clip",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "sana-full"
gate = "sana-video-2b-480p"
trees = ["sana-video-2b-480p"]
argv = [
  "--mode",
  "fast",
  "sana-video",
  "gen",
  "--weights",
  "{weights}/sana-video-2b-480p",
  "--prompt",
  "a corgi running on the beach",
  "--arm",
  "full",
  "--seed",
  "42",
  "--warm",
  "--clip",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "wan13-sol-base"
gate = "wan21-t2v-1.3b"
trees = ["wan21-t2v-1.3b"]
env = ["FASTVIDEO_WAN_UNIPC_SIGMAS=diffusers", "FASTVIDEO_WAN_QUANT=off", "FASTVIDEO_WAN_VAE=full"]
argv = [
  "--mode",
  "fast",
  "wan",
  "gen",
  "--weights",
  "{weights}/wan21-t2v-1.3b",
  "--preset",
  "wan_t2v_1_3b",
  "--unipc",
  "--steps",
  "50",
  "--guidance",
  "6.0",
  "--flow-shift",
  "3.0",
  "--fps",
  "16",
  "--height",
  "480",
  "--width",
  "832",
  "--num-frames",
  "81",
  "--seed",
  "1024",
  "--negative",
  "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走",
  "--warm",
  "--prompts",
  "{root}/scripts/gpu/prompts-sol-wan-t2v5.json",
  "--clip-dir",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "wan13-sol-fullstack"
gate = "wan21-t2v-1.3b"
trees = ["wan21-t2v-1.3b"]
env = ["FASTVIDEO_WAN_UNIPC_SIGMAS=diffusers", "FASTVIDEO_WAN_QUANT=off", "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_WAN_SOL_ATTN=fullstack", "FASTVIDEO_WAN_SOL_CACHE=easycache", "FASTVIDEO_WAN_EASYCACHE_PROFILE=fullstack"]
argv = [
  "--mode",
  "fast",
  "wan",
  "gen",
  "--weights",
  "{weights}/wan21-t2v-1.3b",
  "--preset",
  "wan_t2v_1_3b",
  "--unipc",
  "--steps",
  "50",
  "--guidance",
  "6.0",
  "--flow-shift",
  "3.0",
  "--fps",
  "16",
  "--height",
  "480",
  "--width",
  "832",
  "--num-frames",
  "81",
  "--seed",
  "1024",
  "--negative",
  "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走",
  "--warm",
  "--prompts",
  "{root}/scripts/gpu/prompts-sol-wan-t2v5.json",
  "--clip-dir",
  "{runs}/{arm}/frames",
]
