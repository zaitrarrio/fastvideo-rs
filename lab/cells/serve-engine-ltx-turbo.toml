# Was runpod-matrix.sh `serve-engine`, its ltx group (retired after its GPU check, docs/adr/0019-fv-lab.md §22.19;
# docs/serve/design.md "GPU check"; §22, S3):
# the CLI generation of the served `ltx-turbo` recipe (LTX-2.5 distilled two-stage with its Sol technique profile,
# `ltx2 gen --two-stage`), then the same request through EngineService + CudaBackend (`fv-gpucheck engine --model
# ltx-turbo`): its frames byte-compared with the CLI's, then a second job cancelled after step 3. No `--tae-dir`
# (dropped from the script's engine arms in the same commit as this tier, §22, S3): ltx-turbo, `ltx25-distill-sol`,
# names no tiny decoder, so the frames do not change (serve-engine-h3-turbo.toml, §22.11). The script's removal of
# the PNG frames after the family is disk only and not copied. Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "serve-engine-ltx-turbo"
description = "ltx-turbo (LTX-2.5 distilled two-stage, Sol profile) at 1280x704, 121 frames: the CLI generation, then the same request through the serve engine (frames byte-compared with the CLI's, a second job cancelled after step 3)"

[workload]
model = "ltx2 engine"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
frames = 121
width = 1280
height = 704
note = "runpod-matrix.sh's default PROMPT and SEED, streamed Gemma on both paths; the engine arm reads the CLI arm's frames as its reference, so it runs after it"

[lists]
geo = ["--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--prompt", "{prompt}", "--seed", "{seed}"]

[[arm]]
name = "cli-ltx-turbo"
gate = "ltx25-two-stage"
trees = ["ltx25"]
argv = ["--mode", "fast", "--techniques", "ltx2/ltx25_distill_sol", "ltx2", "gen", "--model-version", "2.5", "--weights",
  "{weights}/ltx25", "--dit", "{weights}/ltx25", "{@geo}", "--two-stage", "--text", "streamed", "--no-text-cache",
  "--no-mp4", "--clip", "{runs}/{arm}/frames"]

[[arm]]
name = "engine-ltx-turbo"
gate = "ltx25-two-stage"
trees = ["ltx25"]
argv = ["--keep-going", "--mode", "fast", "--techniques", "ltx2/ltx25_distill_sol", "engine", "--model", "ltx-turbo",
  "--weights-root", "{weights}", "{@geo}", "--ltx-text", "streamed", "--reference", "{runs}/cli-ltx-turbo/frames",
  "--cancel-after-step", "3", "--clip-out", "{runs}/{arm}/out"]
