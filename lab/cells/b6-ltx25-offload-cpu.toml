# The b6 family's b6-ltx25-offload-cpu pair (runpod-matrix.sh `b6`, plan B6,
# docs/adr/0017-loader-stages.md): the baseline binary (FV_BASELINE_SHA's
# runtime image, fetch-baseline.sh) and this build with the same command line
# and environment, every arm encoding its prompt (--no-text-cache), then
# compare-clips --off-identity. `env = []` keeps the script's bare `env`
# before the binary. Schema: crates/fastvideo-lab/schemas/cell.v1.json;
# docs/adr/0019-fv-lab.md (D1b).
schema = 1
name = "b6-ltx25-offload-cpu"
description = "LTX-2.5 two-stage with --offload cpu at 768x512x121 (DiT and Gemma streamed, decoders on the device around their calls); byte identity"

[workload]
model = "ltx2"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
frames = 121
width = 768
height = 512
note = "runpod-matrix.sh's default PROMPT and SEED; 768x512x121"

[lists]
ltx_b6 = ["--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--seed",
  "{seed}", "--two-stage", "--text", "streamed", "--no-text-cache"]

[[arm]]
name = "b6-ltx25-offload-cpu-base"
gate = "ltx25-two-stage"
trees = ["ltx25"]
bin = "baseline"
env = []
argv = ["{@ltx_b6}", "--dit", "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames",
  "{frames}", "--offload", "cpu", "--prompt", "{prompt}", "--clip", "{runs}/{arm}/frames"]

[[arm]]
name = "b6-ltx25-offload-cpu-pr"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = []
argv = ["{@ltx_b6}", "--dit", "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames",
  "{frames}", "--offload", "cpu", "--prompt", "{prompt}", "--clip", "{runs}/{arm}/frames"]

[[compare]]
baseline = "b6-ltx25-offload-cpu-base"
candidate = "b6-ltx25-offload-cpu-pr"
args = ["--off-identity"]
