# runpod-matrix.sh `oracle`, clip-metric target ltx25-a2v (docs/oracle.md; docs/adr/0019-fv-lab.md §15, §20): the upstream
# reference's dump fetched into {ref}, its noise and text (and conditioning) injected into our run, our run dumped the
# same way (blocks 0,1,24,47) and compared tensor by tensor (compare-dumps, its lines echoed into the log).
# Then audio-to-video: -ownaud decodes and encodes the driving audio on our own (FASTVIDEO_INJECT_COND=0,
# FASTVIDEO_INJECT_PIXELS=0); then the clips (ours, ownaud, the reference's) copied and probed (ffprobe stream lines)
# and ours against the reference's (SSIM / PSNR), into oracle-<target>-frames/metrics.txt ([[metric]], ADR-0019 §20).
# An extra cell of the `oracle` tier: run when --cells names its arms. After the cell the dumps and the reference are
# removed (the clips stay in the report).
schema = 1
name = "oracle-ltx25-a2v"
description = "Oracle diff of LTX-2.5 audio-to-video (the speech clip pinned as clean audio latents) at 512p, against the sol-ltx25 reference; the clips' streams and the clip against the reference's"

[workload]
model = "ltx2"
prompt = "A close-up of a woman with short dark hair talking directly to the camera in a bright living room, natural light, she speaks clearly and calmly, her lips moving with every word."
seed = 1024
frames = 121
width = 768
height = 512
note = "the talking-head prompt of scripts/gpu/upstream/oracle.sh LTX_A2V_PROMPT (FV_LTX_A2V_PROMPT's default); --dense-stage2 --audio"

[reference]
target = "ltx25-a2v"

[lists]
gen = [
  "--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}",
  "--dense-stage2", "--audio", "{root}/scripts/gpu/fixtures/speech-flite-44k.flac", "--prompt", "{prompt}",
  "--seed", "{seed}", "--two-stage", "--text", "streamed", "--clip", "{runs}/{arm}/frames"
]

[[arm]]
name = "oracle-ltx25-a2v"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-a2v-dump"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-a2v-dump"]

[[arm]]
name = "oracle-ltx25-a2v-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-a2v-dump"]
requires = ["{ref}", "{runs}/oracle-ltx25-a2v-dump"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-ltx25-a2v-ownaud"
gate = "ltx25-two-stage"
trees = ["ltx25"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_DUMP_DIR={runs}/oracle-ltx25-a2v-dump-ownaud", "FASTVIDEO_INJECT_COND=0",
  "FASTVIDEO_INJECT_PIXELS=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-ltx25-a2v-dump-ownaud"]

[[arm]]
name = "oracle-ltx25-a2v-ownaud-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-ltx25-a2v-dump-ownaud"]
requires = ["{ref}", "{runs}/oracle-ltx25-a2v-dump-ownaud"]
echo = ["compare-dumps"]

# The clips copied and probed (streams, rates, frame counts).
[[metric]]
report = "{runs}/oracle-ltx25-a2v-frames"
tag = "ltx25-a2v-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-a2v/frames/output.mp4" },
  { label = "ownaud", path = "{runs}/oracle-ltx25-a2v-ownaud/frames/output.mp4" },
  { label = "reference", path = "{ref}/ref.mp4" },
]
missing = true
copy = true
measure = [
  { kind = "probe" },
]

# Ours against the reference's, every frame (both copies present).
[[metric]]
report = "{runs}/oracle-ltx25-a2v-frames"
tag = "ltx25-a2v-frames"
clips = [
  { label = "ours", path = "{runs}/oracle-ltx25-a2v-frames/ours.mp4" },
]
requires = ["{runs}/oracle-ltx25-a2v-frames/reference.mp4"]
measure = [
  { kind = "clip-vs-clip", against = { label = "reference", path = "{runs}/oracle-ltx25-a2v-frames/reference.mp4" } },
]
echo = true
