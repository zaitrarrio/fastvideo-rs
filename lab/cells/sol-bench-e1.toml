# sol-bench set e1 (was scripts/gpu/sol-bench-pod.sh FV_SOL_SET=e1, deleted after the GPU check of docs/adr/0019-fv-lab.md §23.7; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B3: the device PISA parity check, LTX-2.3 HQ fullopt (PISA stage 2) and A14B fullopt (EasyCache + PISA).
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were pisa-parity 240, ltx23-hq-fullopt 900, a14b-sol-fullopt 1500;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-e1"
description = "Phase B3: the device PISA parity check, LTX-2.3 HQ fullopt (PISA stage 2) and A14B fullopt (EasyCache + PISA)"

[workload]
model = "kernels ltx2 wan"
note = "Set e1 of sol-bench-pod.sh. E1's first-order term was unscaled; g1 / g2 rerun with it scaled."

[[arm]]
name = "pisa-parity"
gate = "wan22-ti2v-5b"
trees = ["wan22-ti2v-5b"]
argv = [
  "--mode",
  "fast",
  "kernels",
  "--groups",
  "pisa",
]

[[arm]]
name = "ltx23-hq-fullopt"
gate = "ltx23-hq"
trees = ["ltx23", "ltx23-dev"]
env = ["FASTVIDEO_LTX2_UPSAMPLER={weights}/ltx23-dev/ltx-2.3-spatial-upscaler-x2-1.1.safetensors", "FASTVIDEO_LTX2_STAGE1_CACHE=1", "FASTVIDEO_LTX2_MIDPOINT_PRUNE=1", "FASTVIDEO_NVFP4=1"]
argv = [
  "--mode",
  "fast",
  "ltx2",
  "gen",
  "--model-version",
  "2.3",
  "--hq",
  "--weights",
  "{weights}/ltx23",
  "--dit",
  "{weights}/ltx23-dev/ltx-2.3-22b-dev.safetensors",
  "--prompt",
  "A cinematic 10 second aerial shot of an antique brass clockwork train crossing a snowy mountain bridge at sunrise, steam drifting through golden light, smooth camera movement, high detail",
  "--seed",
  "42",
  "--text",
  "streamed",
  "--dit-offload",
  "resident",
  "--warm",
  "--pisa-stage2",
  "--clip",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "a14b-sol-fullopt"
gate = "wan22-t2v-a14b"
trees = ["wan22-t2v-a14b"]
env = ["FASTVIDEO_WAN_UNIPC_SIGMAS=diffusers", "FASTVIDEO_WAN_QUANT=off", "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_WAN_MOE=auto", "FASTVIDEO_WAN_SOL_CACHE=easycache", "FASTVIDEO_WAN_PISA=1"]
argv = [
  "--mode",
  "fast",
  "wan",
  "gen",
  "--weights",
  "{weights}/wan22-t2v-a14b",
  "--preset",
  "wan_2_2_t2v_a14b",
  "--unipc",
  "--steps",
  "40",
  "--guidance",
  "4.0",
  "--guidance-2",
  "3.0",
  "--flow-shift",
  "12.0",
  "--fps",
  "16",
  "--height",
  "720",
  "--width",
  "1280",
  "--num-frames",
  "81",
  "--seed",
  "1024",
  "--negative",
  "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走",
  "--prompt",
  "Will Smith casually eats noodles, his relaxed demeanor contrasting with the energetic background of a bustling street food market. The scene captures a mix of humor and authenticity. Mid-shot framing, vibrant lighting.",
  "--clip-dir",
  "{runs}/{arm}/frames",
]
