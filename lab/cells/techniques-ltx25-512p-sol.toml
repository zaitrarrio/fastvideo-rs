# The techniques family's ltx25-512p-sol cell (runpod-matrix.sh `techniques`):
# the rtx5090 family's 512p Sol cell from the baseline binary, this build,
# this build from the ltx2/ltx25_distill_sol profile (-prof), and this build
# with the text cache on (-cache: its warm-up writes, its timed pass hits).
# Every other arm encodes its prompt (--no-text-cache): a cache hit is not the
# same clip as a fresh encode. base vs env and base vs prof must be
# byte-identical. Schema: crates/fastvideo-lab/schemas/cell.v1.json;
# docs/adr/0019-fv-lab.md (D1b).
schema = 1
name = "techniques-ltx25-512p-sol"
description = "LTX-2.5 distilled two-stage, Sol stage 2, 768x512x121: baseline binary, this build, the profile, and the text cache; byte identity"

[workload]
model = "ltx2"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
frames = 121
width = 768
height = 512
note = "runpod-matrix.sh's default PROMPT and SEED; 768x512x121 (two-stage needs multiples of 64) as the rtx5090 family's 512p cells"

[[arm]]
name = "ltx25-512p-sol-base"
gate = "ltx25-two-stage"
trees = ["ltx25"]
bin = "baseline"
argv = ["--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--prompt",
  "{prompt}", "--seed", "{seed}", "--two-stage", "--text", "streamed", "--warm", "--no-text-cache", "--clip",
  "{runs}/{arm}/frames"]

[[arm]]
name = "ltx25-512p-sol-env"
gate = "ltx25-two-stage"
trees = ["ltx25"]
argv = ["--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--prompt",
  "{prompt}", "--seed", "{seed}", "--two-stage", "--text", "streamed", "--warm", "--no-text-cache", "--clip",
  "{runs}/{arm}/frames"]

[[arm]]
name = "ltx25-512p-sol-prof"
gate = "ltx25-two-stage"
trees = ["ltx25"]
note = "Sol stage 2 from the profile"
argv = ["--techniques", "ltx2/ltx25_distill_sol", "--mode", "fast", "ltx2", "gen", "--model-version", "2.5",
  "--weights", "{weights}/ltx25", "--dit", "{weights}/ltx25", "--height", "{height}", "--width", "{width}",
  "--num-frames", "{frames}", "--prompt", "{prompt}", "--seed", "{seed}", "--two-stage", "--text", "streamed",
  "--warm", "--no-text-cache", "--clip", "{runs}/{arm}/frames"]

[[arm]]
name = "ltx25-512p-sol-cache"
gate = "ltx25-two-stage"
trees = ["ltx25"]
note = "the conditioning cache on; compared with -env (not byte identity)"
argv = ["--mode", "fast", "ltx2", "gen", "--model-version", "2.5", "--weights", "{weights}/ltx25", "--dit",
  "{weights}/ltx25", "--height", "{height}", "--width", "{width}", "--num-frames", "{frames}", "--prompt",
  "{prompt}", "--seed", "{seed}", "--two-stage", "--text", "streamed", "--warm", "--text-cache",
  "{scratch}/ltx2-text-cache-cache", "--clip", "{runs}/{arm}/frames"]

[[compare]]
baseline = "ltx25-512p-sol-base"
candidate = "ltx25-512p-sol-env"
args = ["--off-identity"]

[[compare]]
baseline = "ltx25-512p-sol-base"
candidate = "ltx25-512p-sol-prof"
args = ["--off-identity"]

[[compare]]
baseline = "ltx25-512p-sol-env"
candidate = "ltx25-512p-sol-cache"
