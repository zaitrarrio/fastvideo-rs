# sol-bench set d1 (scripts/gpu/sol-bench-pod.sh FV_SOL_SET=d1; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B3: the LingBot router check, then LingBot baseline with --refiner-steps 1 (3 of 8 refiner sigmas).
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were lingbot-router 60, lingbot-baseline-rs3 2700;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-d1"
description = "Phase B3: the LingBot router check, then LingBot baseline with --refiner-steps 1 (3 of 8 refiner sigmas)"

[workload]
model = "lingbot"
note = "Set d1 of sol-bench-pod.sh. Report table scales the refiner denoise by 8/3."

[[arm]]
name = "lingbot-router"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-router",
]

[[arm]]
name = "lingbot-baseline-rs3"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-gen",
  "--weights",
  "{weights}/lingbot-video-moe-30b-a3b",
  "--prompts",
  "{root}/scripts/gpu/sol/lingbot-t2v-val3.txt",
  "--num-prompts",
  "1",
  "--arm",
  "baseline",
  "--residency",
  "swap",
  "--seed",
  "42",
  "--clip",
  "{runs}/{arm}/clips",
  "--refiner-steps",
  "1",
]
