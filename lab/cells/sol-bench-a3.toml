# sol-bench set a3 (was scripts/gpu/sol-bench-pod.sh FV_SOL_SET=a3, deleted after the GPU check of docs/adr/0019-fv-lab.md §23.7; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase A, instance 1 follow-up: MiniMax-H3 768p fullopt and dense with BF16 linears and the prompt encoded in every request.
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were h3-768p-fullopt-bf16 480, h3-768p-dense-bf16 760;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-a3"
description = "Phase A, instance 1 follow-up: MiniMax-H3 768p fullopt and dense with BF16 linears and the prompt encoded in every request"

[workload]
model = "h3"
note = "Set a3 of sol-bench-pod.sh. Sol-engine's rtx5090_dense.toml and rtx5090_fullopt.toml run BF16 linears; --no-text-cache so E2E includes text encoding."

[[arm]]
name = "h3-768p-fullopt-bf16"
gate = "h3-base"
trees = ["h3-base"]
env = ["FASTVIDEO_H3_QUANT=off", "FASTVIDEO_H3_SOL_CACHE=teacache"]
argv = [
  "--mode",
  "fast",
  "h3",
  "gen",
  "--weights",
  "{weights}/h3-base",
  "--h3-recipe",
  "sol-h3-rtx",
  "--adaln-cache",
  "{runs}/h3-768p-adaln.cache",
  "--clip-dir",
  "{runs}/{arm}/frames",
  "--prompt",
  "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>",
  "--seconds",
  "5",
  "--seed",
  "1024",
  "--text-encoder",
  "auto",
  "--text-cache",
  "{scratch}/h3-text-cache",
  "--text-weights",
  "{weights}/h3-base",
  "--warm",
  "--no-text-cache",
]

[[arm]]
name = "h3-768p-dense-bf16"
gate = "h3-base"
trees = ["h3-base"]
env = ["FASTVIDEO_H3_QUANT=off", "FASTVIDEO_H3_SOL_ATTN=off"]
argv = [
  "--mode",
  "fast",
  "h3",
  "gen",
  "--weights",
  "{weights}/h3-base",
  "--h3-recipe",
  "sol-h3-rtx",
  "--adaln-cache",
  "{runs}/h3-768p-adaln.cache",
  "--clip-dir",
  "{runs}/{arm}/frames",
  "--prompt",
  "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>",
  "--seconds",
  "5",
  "--seed",
  "1024",
  "--text-encoder",
  "auto",
  "--text-cache",
  "{scratch}/h3-text-cache",
  "--text-weights",
  "{weights}/h3-base",
  "--no-text-cache",
]
