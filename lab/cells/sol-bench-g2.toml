# sol-bench set g2 (was scripts/gpu/sol-bench-pod.sh FV_SOL_SET=g2, deleted after the GPU check of docs/adr/0019-fv-lab.md §23.7; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B3: Wan2.2 T2V-A14B fullopt and LingBot fullopt with the scaled first-order term.
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were a14b-sol-fullopt 1300, lingbot-fullopt 1800;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-g2"
description = "Phase B3: Wan2.2 T2V-A14B fullopt and LingBot fullopt with the scaled first-order term"

[workload]
model = "wan lingbot"
note = "Set g2 of sol-bench-pod.sh. The open items of docs/perf/sol-bench.md (not run on 2026-10-07: budget)."

[[arm]]
name = "a14b-sol-fullopt"
gate = "wan22-t2v-a14b"
trees = ["wan22-t2v-a14b"]
env = ["FASTVIDEO_WAN_UNIPC_SIGMAS=diffusers", "FASTVIDEO_WAN_QUANT=off", "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_WAN_MOE=auto", "FASTVIDEO_WAN_SOL_CACHE=easycache", "FASTVIDEO_WAN_PISA=1"]
argv = [
  "--mode",
  "fast",
  "wan",
  "gen",
  "--weights",
  "{weights}/wan22-t2v-a14b",
  "--preset",
  "wan_2_2_t2v_a14b",
  "--unipc",
  "--steps",
  "40",
  "--guidance",
  "4.0",
  "--guidance-2",
  "3.0",
  "--flow-shift",
  "12.0",
  "--fps",
  "16",
  "--height",
  "720",
  "--width",
  "1280",
  "--num-frames",
  "81",
  "--seed",
  "1024",
  "--negative",
  "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走",
  "--prompt",
  "Will Smith casually eats noodles, his relaxed demeanor contrasting with the energetic background of a bustling street food market. The scene captures a mix of humor and authenticity. Mid-shot framing, vibrant lighting.",
  "--clip-dir",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "lingbot-fullopt"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-gen",
  "--weights",
  "{weights}/lingbot-video-moe-30b-a3b",
  "--prompts",
  "{root}/scripts/gpu/sol/lingbot-t2v-val3.txt",
  "--num-prompts",
  "1",
  "--arm",
  "fullopt",
  "--residency",
  "swap",
  "--seed",
  "42",
  "--clip",
  "{runs}/{arm}/clips",
]
