# sol-bench set c4 (scripts/gpu/sol-bench-pod.sh FV_SOL_SET=c4; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B2: LTX-2.3 HQ base again, then Cosmos3-Super BF16 baseline and TeaCache.
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were ltx23-hq-base 660, cosmos3-baseline 2400, cosmos3-teacache 1500;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-c4"
description = "Phase B2: LTX-2.3 HQ base again, then Cosmos3-Super BF16 baseline and TeaCache"

[workload]
model = "ltx2 cosmos3"
note = "Set c4 of sol-bench-pod.sh."

[[arm]]
name = "ltx23-hq-base"
gate = "ltx23-hq"
trees = ["ltx23", "ltx23-dev"]
env = ["FASTVIDEO_LTX2_UPSAMPLER={weights}/ltx23-dev/ltx-2.3-spatial-upscaler-x2-1.1.safetensors"]
argv = [
  "--mode",
  "fast",
  "ltx2",
  "gen",
  "--model-version",
  "2.3",
  "--hq",
  "--weights",
  "{weights}/ltx23",
  "--dit",
  "{weights}/ltx23-dev/ltx-2.3-22b-dev.safetensors",
  "--prompt",
  "A cinematic 10 second aerial shot of an antique brass clockwork train crossing a snowy mountain bridge at sunrise, steam drifting through golden light, smooth camera movement, high detail",
  "--seed",
  "42",
  "--text",
  "streamed",
  "--dit-offload",
  "resident",
  "--warm",
  "--dense-stage2",
  "--clip",
  "{runs}/{arm}/frames",
]

[[arm]]
name = "cosmos3-baseline"
gate = "cosmos3-super"
trees = ["cosmos3-super"]
env = []
argv = [
  "--mode",
  "fast",
  "sol",
  "cosmos3-gen",
  "--weights",
  "{weights}/cosmos3-super",
  "--prompt",
  "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail",
  "--negative-prompt",
  "blurry, distorted, low quality, flickering, overexposed, underexposed, low contrast, text artifacts, unstable motion",
  "--seed",
  "42",
  "--warm",
  "--arm",
  "baseline",
  "--clip",
  "{runs}/{arm}/clip",
]

[[arm]]
name = "cosmos3-teacache"
gate = "cosmos3-super"
trees = ["cosmos3-super"]
env = []
argv = [
  "--mode",
  "fast",
  "sol",
  "cosmos3-gen",
  "--weights",
  "{weights}/cosmos3-super",
  "--prompt",
  "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail",
  "--negative-prompt",
  "blurry, distorted, low quality, flickering, overexposed, underexposed, low contrast, text artifacts, unstable motion",
  "--seed",
  "42",
  "--warm",
  "--arm",
  "teacache",
  "--clip",
  "{runs}/{arm}/clip",
]
