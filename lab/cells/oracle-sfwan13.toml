# runpod-matrix.sh `oracle`, target sfwan13 (docs/oracle.md; docs/adr/0019-fv-lab.md §20.5, §21): the upstream
# reference's dump (FastVideo's SF-Wan 1.3B, scripts/gpu/upstream/oracle.sh oracle_sfwan on the `fastvideo` upstream
# pod, its tree fetched from R2 there: lab/upstream.toml `r2`) fetched into {ref}, its noise and text injected into
# our run, our run dumped the same way (blocks 0,1,24,47) and compared tensor by tensor (compare-dumps, its lines
# echoed into the log). FASTVIDEO_WAN_VAE=full: the reference decodes with the full Wan VAE. The bf16 noise floor
# (FV_ORACLE_F32's default for sfwan*): ours with f32 activations against the reference, and our bf16 run against
# our f32 run. Then the frames: the reference's mp4 and ours decoded into PNG frames ([[metric]] `decode`), the
# reference's frames against our PNG frames and our PNG frames against our decoded mp4 (the codec floor of that
# comparison) with compare-clips ([[compare]] of two directories); then the path this port ran before the fix
# (-legacy: the whole clip at once under the per-frame mask) against the reference, tensors and frames; then the
# composed reference path of the KV-window attention (-composed) against the reference and against ours. Every
# step in the script's order (`after`). After the cell the dumps and the reference (its decoded frames with it)
# are removed. The tier is `oracle-r2` (weights = "volume+r2": sfwan21-1.3b is R2-only since 2026-10-13).
schema = 1
name = "oracle-sfwan13"
description = "Oracle diff of SF-Wan 1.3B (causal DMD, 4 steps) against the FastVideo reference: tensors per step and block, the bf16 noise floor, the frames against the reference's clip, the pre-fix path and the composed KV-window attention"

[workload]
model = "wan"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
note = "runpod-matrix.sh's default PROMPT and SEED; the sf_wan_t2v_1_3b preset at 4 steps, flow shift 5 (480x832x81)"

[reference]
target = "sfwan13"

[lists]
gen = [
  "--mode", "fast", "wan", "gen", "--weights", "{weights}/sfwan21-1.3b", "--preset", "sf_wan_t2v_1_3b",
  "--steps", "4", "--flow-shift", "5", "--prompt", "{prompt}", "--seed", "{seed}", "--clip-dir",
  "{runs}/{arm}/frames"
]

[[arm]]
name = "oracle-sfwan13"
gate = "sfwan21-1.3b"
trees = ["sfwan21-1.3b"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_DUMP_DIR={runs}/oracle-sfwan13-dump"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-sfwan13-dump"]

[[arm]]
name = "oracle-sfwan13-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-sfwan13-dump"]
requires = ["{ref}", "{runs}/oracle-sfwan13-dump"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-sfwan13-f32"
gate = "sfwan21-1.3b"
trees = ["sfwan21-1.3b"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_DUMP_DIR={runs}/oracle-sfwan13-dump-f32", "FASTVIDEO_BF16_ACT=0",
  "FASTVIDEO_H3_QUANT=off"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-sfwan13-dump-f32"]

[[arm]]
name = "oracle-sfwan13-f32-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-sfwan13-dump-f32"]
requires = ["{ref}", "{runs}/oracle-sfwan13-dump-f32"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-sfwan13-bf16-vs-f32"
argv = [
  "compare-dumps", "--baseline", "{runs}/oracle-sfwan13-dump-f32", "--candidate",
  "{runs}/oracle-sfwan13-dump"
]
requires = ["{runs}/oracle-sfwan13-dump-f32", "{runs}/oracle-sfwan13-dump"]
echo = ["compare-dumps"]

# Before the fix: the whole clip at once under the per-frame mask (the path this port ran before), the same
# injected inputs.
[[arm]]
name = "oracle-sfwan13-legacy"
gate = "sfwan21-1.3b"
trees = ["sfwan21-1.3b"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_DUMP_DIR={runs}/oracle-sfwan13-dump-legacy",
  "FASTVIDEO_WAN_CAUSAL_AR=0", "FASTVIDEO_WAN_CAUSAL_FPB=1"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-sfwan13-dump-legacy"]

[[arm]]
name = "oracle-sfwan13-legacy-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-sfwan13-dump-legacy"]
requires = ["{ref}", "{runs}/oracle-sfwan13-dump-legacy"]
echo = ["compare-dumps"]

# The composed reference path of the KV-window attention.
[[arm]]
name = "oracle-sfwan13-composed"
gate = "sfwan21-1.3b"
trees = ["sfwan21-1.3b"]
env = [
  "FASTVIDEO_INJECT_DIR={ref}", "FASTVIDEO_DUMP_OPS=0,1,24,47", "FASTVIDEO_H3_QUANT=off",
  "FASTVIDEO_WAN_VAE=full", "FASTVIDEO_DUMP_DIR={runs}/oracle-sfwan13-dump-composed",
  "FASTVIDEO_WAN_CAUSAL_FLASH=0"
]
argv = ["{@gen}"]
fresh = ["{runs}/oracle-sfwan13-dump-composed"]

[[arm]]
name = "oracle-sfwan13-composed-diff"
argv = ["compare-dumps", "--baseline", "{ref}", "--candidate", "{runs}/oracle-sfwan13-dump-composed"]
requires = ["{ref}", "{runs}/oracle-sfwan13-dump-composed"]
echo = ["compare-dumps"]

[[arm]]
name = "oracle-sfwan13-flash-vs-composed"
argv = [
  "compare-dumps", "--baseline", "{runs}/oracle-sfwan13-dump-composed", "--candidate",
  "{runs}/oracle-sfwan13-dump"
]
requires = ["{runs}/oracle-sfwan13-dump-composed", "{runs}/oracle-sfwan13-dump"]
echo = ["compare-dumps"]

# The frames, after the noise floor: the reference's mp4 (its full VAE, bf16 decode, then its encoder) decoded
# beside the reference ({ref_dir}/frames, removed with it), and our own mp4 (`wan gen --clip-dir` writes
# output.mp4) into mp4frames, the codec floor's other side. Nothing is written for a clip that is not there.
[[metric]]
tag = "sfwan13-frames"
after = "oracle-sfwan13-bf16-vs-f32"
clips = [{ label = "reference", path = "{ref}/ref.mp4" }]
measure = [{ kind = "decode", dir = "{ref_dir}/frames" }]

[[metric]]
tag = "sfwan13-frames"
after = "oracle-sfwan13-bf16-vs-f32"
clips = [{ label = "ours", path = "{runs}/oracle-sfwan13/frames/output.mp4" }]
measure = [{ kind = "decode", dir = "{runs}/oracle-sfwan13/mp4frames" }]

# The reference's frames against our PNG frames; our PNG frames against our own decoded mp4 (the codec floor).
[[compare]]
tag = "oracle-sfwan13-frames-vs-ref"
baseline = "{ref_dir}/frames"
candidate = "{runs}/oracle-sfwan13/frames"
after = "oracle-sfwan13-bf16-vs-f32"

[[compare]]
tag = "oracle-sfwan13-codec-floor"
baseline = "{runs}/oracle-sfwan13/frames"
candidate = "{runs}/oracle-sfwan13/mp4frames"
after = "oracle-sfwan13-bf16-vs-f32"

# The pre-fix path's frames against the reference's.
[[compare]]
tag = "oracle-sfwan13-legacy-frames-vs-ref"
baseline = "{ref_dir}/frames"
candidate = "{runs}/oracle-sfwan13-legacy/frames"
after = "oracle-sfwan13-legacy-diff"
