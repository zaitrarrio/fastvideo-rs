# The techniques family's h3-480p-fullopt cell (runpod-matrix.sh `techniques`,
# tech_h3): the baseline binary (FV_BASELINE_SHA's runtime image,
# fetch-baseline.sh) with the legacy flags, this build with the same command
# line, and this build from the matching --techniques profile; base vs env and
# base vs prof must be byte-identical (compare-clips --off-identity). Each arm
# has its own text cache and AdaLN cache ({arm} in both paths): its warm-up
# computes them with its own binary, so the identity covers the candidate's H3
# text-encoder and AdaLN paths (ADR-0019 §9.4; before 2026-10-24 the arms
# shared both). `env = []` keeps the script's bare `env` before the binary.
# Schema: crates/fastvideo-lab/schemas/cell.v1.json; docs/adr/0019-fv-lab.md
# (D1b).
schema = 1
name = "techniques-h3-480p-fullopt"
description = "The rtx5090 family's 480p fullopt route (sol-h3-rtx + TeaCache): baseline binary, this build, this build from profiles/h3/rtx5090_fullopt; byte identity"

[workload]
model = "h3"
prompt = "A man in his thirties talking to the camera in a bright living room, medium close-up, natural expressions and hand gestures, soft window light. He says: <d>Hello, this was generated entirely in Rust.</d>"
seed = 1024
seconds = 5
width = 832
height = 480
note = "runpod-matrix.sh's default PROMPT and SEED; 832x480 as the rtx5090 family's 480p cells"

[lists]
h3_common = ["--prompt", "{prompt}", "--seconds", "{seconds}", "--seed", "{seed}", "--text-encoder", "auto",
  "--text-cache", "{scratch}/h3-text-cache-{arm}", "--text-weights", "{weights}/h3-base", "--warm"]

[[arm]]
name = "h3-480p-fullopt-base"
gate = "h3-base"
trees = ["h3-base"]
bin = "baseline"
env = ["FASTVIDEO_H3_SOL_CACHE=teacache"]
argv = ["--mode", "fast", "h3", "gen", "--weights", "{weights}/h3-base", "--h3-recipe", "sol-h3-rtx",
  "--height", "{height}", "--width", "{width}", "--adaln-cache", "{runs}/{arm}-adaln.cache", "--clip-dir",
  "{runs}/{arm}/frames", "{@h3_common}"]

[[arm]]
name = "h3-480p-fullopt-env"
gate = "h3-base"
trees = ["h3-base"]
env = ["FASTVIDEO_H3_SOL_CACHE=teacache"]
argv = ["--mode", "fast", "h3", "gen", "--weights", "{weights}/h3-base", "--h3-recipe", "sol-h3-rtx",
  "--height", "{height}", "--width", "{width}", "--adaln-cache", "{runs}/{arm}-adaln.cache", "--clip-dir",
  "{runs}/{arm}/frames", "{@h3_common}"]

[[arm]]
name = "h3-480p-fullopt-prof"
gate = "h3-base"
trees = ["h3-base"]
note = "the profile mirrors sol-engine's BF16 config, so this arm keeps the matrix cell's precision with FASTVIDEO_H3_QUANT=mxfp8 (env flags override a profile)"
env = ["FASTVIDEO_H3_QUANT=mxfp8"]
argv = ["--mode", "fast", "h3", "gen", "--weights", "{weights}/h3-base", "--techniques", "h3/rtx5090_fullopt",
  "--height", "{height}", "--width", "{width}", "--adaln-cache", "{runs}/{arm}-adaln.cache", "--clip-dir",
  "{runs}/{arm}/frames", "{@h3_common}"]

[[compare]]
baseline = "h3-480p-fullopt-base"
candidate = "h3-480p-fullopt-env"
args = ["--off-identity"]

[[compare]]
baseline = "h3-480p-fullopt-base"
candidate = "h3-480p-fullopt-prof"
args = ["--off-identity"]
