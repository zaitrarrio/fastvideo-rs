# sol-bench set b5 (scripts/gpu/sol-bench-pod.sh FV_SOL_SET=b5; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B: Cosmos3-Super baseline (BF16).
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were cosmos3-baseline 2400;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-b5"
description = "Phase B: Cosmos3-Super baseline (BF16)"

[workload]
model = "cosmos3"
note = "Set b5 of sol-bench-pod.sh."

[[arm]]
name = "cosmos3-baseline"
gate = "cosmos3-super"
trees = ["cosmos3-super"]
env = []
argv = [
  "--mode",
  "fast",
  "sol",
  "cosmos3-gen",
  "--weights",
  "{weights}/cosmos3-super",
  "--prompt",
  "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail",
  "--negative-prompt",
  "blurry, distorted, low quality, flickering, overexposed, underexposed, low contrast, text artifacts, unstable motion",
  "--seed",
  "42",
  "--warm",
  "--arm",
  "baseline",
  "--clip",
  "{runs}/{arm}/clip",
]
