# sol-bench set c3 (scripts/gpu/sol-bench-pod.sh FV_SOL_SET=c3; docs/perf/sol-bench.md; docs/adr/0019-fv-lab.md §23):
# Phase B2: the LingBot router check, LingBot baseline, then LingBot fullopt.
# The commands are the pod script's, word for word (tests/experiment_tiers.rs against
# fixtures/experiments/sol-bench-script.txt, which scripts/gpu/tests/fv-lab-experiment-goldens.sh cuts from the
# script); the arms are its cells, in its order, named as its run directories so `fv-lab report table --kind
# sol-bench` reads them. The script's per-cell estimates (seconds) were lingbot-router 60, lingbot-baseline 2400, lingbot-fullopt 1200;
# the runner's deadline replaces them (§23, intended difference 3).
# Schema: crates/fastvideo-lab/schemas/cell.v1.json.
schema = 1
name = "sol-bench-c3"
description = "Phase B2: the LingBot router check, LingBot baseline, then LingBot fullopt"

[workload]
model = "lingbot"
note = "Set c3 of sol-bench-pod.sh. The baseline does not fit one pod's deadline, as b4."

[[arm]]
name = "lingbot-router"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-router",
]

[[arm]]
name = "lingbot-baseline"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-gen",
  "--weights",
  "{weights}/lingbot-video-moe-30b-a3b",
  "--prompts",
  "{root}/scripts/gpu/sol/lingbot-t2v-val3.txt",
  "--num-prompts",
  "1",
  "--arm",
  "baseline",
  "--residency",
  "swap",
  "--seed",
  "42",
  "--clip",
  "{runs}/{arm}/clips",
]

[[arm]]
name = "lingbot-fullopt"
gate = "lingbot-moe"
trees = ["lingbot-video-moe-30b-a3b"]
argv = [
  "--mode",
  "fast",
  "sol",
  "lingbot-gen",
  "--weights",
  "{weights}/lingbot-video-moe-30b-a3b",
  "--prompts",
  "{root}/scripts/gpu/sol/lingbot-t2v-val3.txt",
  "--num-prompts",
  "1",
  "--arm",
  "fullopt",
  "--residency",
  "swap",
  "--seed",
  "42",
  "--clip",
  "{runs}/{arm}/clips",
]
