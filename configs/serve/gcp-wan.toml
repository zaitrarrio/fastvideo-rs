# fv-serve on a Google Cloud GPU VM: wan (FastWan2.1 1.3B DMD 3-step, VSA).
# Layout, roles, secrets and ports as in gcp-h3-turbo.toml; [[models]] and
# [protocols] as in runpod-wan.toml. Family Durable Object: wan. Small
# enough for an L4 (G2): FV_GCP_MACHINE_WAN=g2-standard-16.
#
# Not the `wan-turbo` tier: since the 5B FastWan2.2 became wan-turbo
# (runpod-wan5b.toml), this model is named by its catalog id.

[server]
bind = "0.0.0.0:8000"
state_dir = "/fvstate"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

[[models]]
id = "fastwan21-1.3b"
family = "wan"
recipe = "fastwan21-1.3b"
weights = "${FV_WEIGHTS}/fastwan21-1.3b"
resident = true

[protocols]
fal_apps = ["fastvideo/fastwan21-1.3b"]
openai_videos = true
fastwan = true
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true

[director]
chunk_seconds = 5.0

[webrtc]
udp_port = 40010
tcp_port = 40000

[limits]
queue_max = 32
body_max_mb = 64
