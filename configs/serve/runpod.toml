# fv-serve on Runpod (pod, or serverless load balancer with PORT set).
#
# Secrets come from the environment only (design §6.3). The Runpod template
# maps the account secrets (lower-case names) to the upper-case variables
# fv-serve reads:
#
#   FV_CF_ACCOUNT_ID        = {{ RUNPOD_SECRET_fv_cf_account_id }}
#   FV_CF_API_TOKEN         = {{ RUNPOD_SECRET_fv_cf_api_token }}
#   FV_D1_DATABASE_ID       = {{ RUNPOD_SECRET_fv_d1_database_id }}
#   FV_R2_BUCKET            = {{ RUNPOD_SECRET_fv_r2_bucket }}
#   FV_R2_ENDPOINT          = {{ RUNPOD_SECRET_fv_r2_endpoint }}
#   FV_R2_ACCESS_KEY_ID     = {{ RUNPOD_SECRET_fv_r2_access_key_id }}
#   FV_R2_SECRET_ACCESS_KEY = {{ RUNPOD_SECRET_fv_r2_secret_access_key }}
#   FV_API_KEYS, FV_URL_SIGNING_KEY, FV_WEBHOOK_ED25519_KEY (same pattern)
#
# With those set, `auto` selects the D1 job store and R2 artifacts.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# One GPU (RTX PRO 6000, 96 GB): the resident models load before /ping
# answers 200. Each entry resolves against the CUDA catalog
# (crates/fastvideo-engine-service/src/cuda/caps.rs): `recipe` is a tier alias
# (h3-turbo, h3-max, ltx-turbo, wan-turbo, ...), a catalog id or an H3 recipe
# name; `weights` replaces the catalog's weight directory. One H3 DiT is
# ~41 GB, so h3-turbo and h3-max do not co-reside: serve them from separate
# processes (runpod-h3-max.toml), or mark one `resident = false` with
# `[engine] swap = true` (a switch reloads from the volume).
[[models]]
id = "fasth3"
family = "h3"
recipe = "h3-turbo"
weights = "${FV_WEIGHTS}/h3-base"
resident = true
served_names = ["fasth3"]
continuity = "anchor-last-frame"
# Image-to-video text: keep the Qwen-VL vision tower resident beside the
# resident text encoder (`auto`: when it fits; `stream` reads it from the
# volume per request, same bytes). `warmup` runs one I2V + one T2V job
# before readiness so the first request pays no setup.
i2v_encoder = "auto"
warmup = true

[aliases]
"MiniMax-H3" = "fasth3"
"MiniMax-H3-Turbo" = "fasth3"

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true

[limits]
queue_max = 32
body_max_mb = 64
