# fv-serve on Runpod: h3-max (Sol-H3 tau ladder). Secrets as in runpod.toml.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# h3-max: Sol-H3 4-step on the tau-ladder engine route (one GPU).
[[models]]
id = "sol-h3"
family = "h3"
recipe = "h3-max"
weights = "${FV_WEIGHTS}/h3-base"
resident = true
# Image-to-video text: keep the Qwen-VL vision tower resident beside the
# resident text encoder (`auto`: when it fits; `stream` reads it from the
# volume per request, same bytes). `warmup` runs one I2V + one T2V job
# before readiness so the first request pays no setup.
i2v_encoder = "auto"
warmup = true
# The native 1080P tier is on (80 GB-class GPUs and up): see runpod.toml.
# h3_1080p = false

[aliases]
"MiniMax-H3-Max" = "sol-h3"

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true

[limits]
queue_max = 32
body_max_mb = 64

# Behind the gateway (docs/serve/gateway.md): set FV_SERVE_ROLE=worker and
# FV_INTERNAL_TOKEN (the gateway's value) on the template. The worker then
# requires the internal token on every API route, trusts the gateway's
# authentication, and takes jobs from `/fv/v1/internal/jobs` (queue: the
# gateway's `kind: http` envelope). Standalone deployments ignore this.
[gateway]
pool = "h3-max"
