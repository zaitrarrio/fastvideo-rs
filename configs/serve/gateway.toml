# fv-serve as the gateway (docs/serve/gateway.md): one URL and one API key
# for every API and model, in front of one worker pool per model family.
# CPU only: no GPU and no `cuda` feature needed (`http-client` is).
#
# Environment (secrets never in this file):
#
#   FV_INTERNAL_TOKEN                     gateway ↔ worker secret (the workers get the same value)
#   FV_API_KEYS / minted keys (D1)        the users' keys: only the gateway holds them
#   FV_CF_ACCOUNT_ID, FV_CF_API_TOKEN, FV_D1_DATABASE_ID   the shared job store (required)
#   FV_R2_BUCKET, FV_R2_ENDPOINT, FV_R2_ACCESS_KEY_ID, FV_R2_SECRET_ACCESS_KEY  shared media
#   FV_URL_SIGNING_KEY, FV_WEBHOOK_ED25519_KEY   same values as the workers
#   FV_RUNPOD_API_KEY (or RUNPOD_API_KEY)  serverless pools (/run, /status, /cancel, /health)
#   FV_POOL_<ID>_ENDPOINT                  each serverless pool's endpoint id, e.g.
#                                          FV_POOL_H3_TURBO_ENDPOINT, FV_POOL_WAN_ENDPOINT
#   FV_POOL_<ID>_URLS                      pod pools' worker URLs (comma list); pods that
#                                          register themselves (gateway.pool) join as well
#   FV_PUBLIC_BASE_URL                     the gateway's public URL (workers use it too)
#   FV_ADMIN_TOKEN (optional)              else the gateway makes one on its first start and
#                                          keeps it in <state_dir>/admin_token (mode 600)
#   FV_ADMIN_TOKEN_RECIPIENT (optional)    X25519 public key: the token sealed to it at
#                                          /fv/v1/admin/token/sealed (docs/serve/gateway.md §9)
#
# Pool ids and their workers' configs (each worker: FV_SERVE_ROLE=worker,
# FV_INTERNAL_TOKEN, FV_PUBLIC_BASE_URL = this gateway's URL):
#
#   h3-turbo    runpod-serverless   configs/serve/runpod.toml        (fasth3)
#   h3-max      runpod-serverless   configs/serve/runpod-h3-max.toml (sol-h3)
#   ltx         runpod-serverless   configs/serve/runpod-ltx.toml    (ltx25-distill-sol)
#   wan         runpod-serverless   configs/serve/runpod-wan.toml    (fastwan21-1.3b)
#   sfwan-live  pod                 configs/serve/runpod-sfwan.toml  (sfwan21-1.3b; WebRTC peer
#                                   sessions and WHIP streams need pods)
#   wan14b      pod                 configs/serve/runpod-wan14b.toml (wan14b-plug-4step, the
#                                   `wan14b-turbo` tier; empty until a worker registers)
#
# Each pool's `[[pools.models]]` repeat the worker's `[[models]]` (id, family,
# recipe): the static caps advertised while the pool is scaled to zero.
# Live caps from the workers replace them once a worker answers.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-gw-state"
shutdown_grace_s = 10
sync_timeout_s = 600

[auth]
mode = "keys"                      # the default; API keys: FV_API_KEYS or minted (/console/admin)

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "remote"

[gateway]
caps_refresh_s = 60
tick_s = 5
metrics_window_s = 600
watch_poll_ms = 1000
runpod_api_base = "https://api.runpod.ai/v2"
reactor_model = "sfwan21-1.3b"
inline_inputs_max_bytes = 8388608  # inputs up to 8 MiB per job ride in the dispatch (no R2 hop; serverless: ≤ 6 MiB)
input_passthrough = true           # large video/audio given as a public URL: the worker fetches it
stage_inputs_for_retry = true      # copy inputs to R2 after the dispatch, for a re-dispatch

[aliases]
"MiniMax-H3" = "fasth3"
"MiniMax-H3-Turbo" = "fasth3"
"MiniMax-H3-Max" = "sol-h3"

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = true
reactor = true
native = true
# Every worker config's fal apps (the union; the workers mount the same ids;
# runpod.toml and the H3 configs mount the default H3 apps). An app whose
# model no pool serves answers 404 ("model ... is not served by any pool");
# the gateway starts and serves the rest (tests/gateway_bases.rs).
fal_apps = ["minimax/h3-max", "minimax/h3-turbo", "minimax/h3-draft", "minimax/h3-max-turbo", "minimax/h3", "fastvideo/ltx-turbo", "lightricks/ltx-2.5", "fal-ai/ltx-2.3", "fal-ai/ltx-2.3-quality", "fal-ai/wan", "fastvideo/fastwan21-1.3b", "fastvideo/wan14b-turbo"]

[limits]
queue_max = 256
body_max_mb = 64

[[pools]]
id = "h3-turbo"
kind = "runpod-serverless"
max_queued = 32
job_timeout_s = 1800
stale_after_s = 120
retries = 1
[[pools.models]]
id = "fasth3"
family = "h3"
recipe = "h3-turbo"

[[pools]]
id = "h3-max"
kind = "runpod-serverless"
max_queued = 16
job_timeout_s = 3600
stale_after_s = 180
retries = 1
[[pools.models]]
id = "sol-h3"
family = "h3"
recipe = "h3-max"

[[pools]]
id = "ltx"
kind = "runpod-serverless"
max_queued = 32
job_timeout_s = 1800
stale_after_s = 120
retries = 1
[[pools.models]]
id = "ltx25-distill-sol"
family = "ltx2"
recipe = "ltx-turbo"

[[pools]]
id = "wan"
kind = "runpod-serverless"
max_queued = 64
job_timeout_s = 900
stale_after_s = 90
retries = 1
[[pools.models]]
id = "fastwan21-1.3b"
family = "wan"
# The 1.3B recipe by id: the `wan-turbo` tier is the 5B FastWan model now
# (runpod-wan5b.toml, docs/serve/fal-parity.md §3).
recipe = "fastwan21-1.3b"

[[pools]]
id = "sfwan-live"
kind = "pod"
# FV_POOL_SFWAN_LIVE_URLS, plus pods that register with gateway.pool = "sfwan-live".
urls = []
max_queued = 8
max_streams = 0
stale_after_s = 60
retries = 0
[[pools.models]]
id = "sfwan21-1.3b"
family = "wan"
recipe = "sfwan21-1.3b"

[[pools]]
id = "wan14b"
kind = "pod"
# The Wan 2.1 T2V-14B fast tier (LongLive-Plug 4-step): FV_POOL_WAN14B_URLS,
# plus pods that register with gateway.pool = "wan14b" (runpod-wan14b.toml).
urls = []
max_queued = 16
job_timeout_s = 1800
stale_after_s = 120
retries = 1
[[pools.models]]
id = "wan14b-plug-4step"
family = "wan"
recipe = "wan14b-turbo"

# ---- BEGIN [autoscale] (crates/fastvideo-autoscale; docs/serve/gateway.md §8) ----
# Off here. The full example (per-pool SLOs, budgets, prices, schedules, the
# pod pool) is configs/serve/autoscale.toml: replace this block with its
# tables to turn the autoscaler on (dry run first).
[autoscale]
enabled = false
# ---- END [autoscale] ----
