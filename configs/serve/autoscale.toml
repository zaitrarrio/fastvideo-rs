# Gateway autoscaler (crates/fastvideo-autoscale; docs/serve/gateway.md §8).
#
# Include: append this file's tables to configs/serve/gateway.toml, or point
# the standalone controller at it (`fv-autoscale --config <this file>`).
# Pool names are the gateway's `[[pools]] id`s (configs/serve/gateway.toml);
# a serverless pool without `serverless.endpoint_id` takes the gateway
# pool's `endpoint_id` (FV_POOL_<ID>_ENDPOINT). The standalone binary needs
# it set here. Only `[autoscale]` tables are read by `fv-autoscale`.
#
# Secrets come from the environment only: RUNPOD_API_KEY (FV_RUNPOD_API_KEY),
# FV_ADMIN_TOKEN (the admin route), the D1 set for the lease row
# (FV_CF_ACCOUNT_ID, FV_CF_API_TOKEN, FV_D1_DATABASE_ID) and FV_INTERNAL_TOKEN
# (drain requests to pod workers).

# ---- BEGIN [autoscale] (owned by crates/fastvideo-autoscale) -------------

[autoscale]
enabled = true
dry_run = true                 # decide and log only; POST /fv/v1/admin/autoscale {"dry_run": false} to act
interval_s = 15
budget_usd_per_hr = 25.0       # all pools together (busy workers are always kept)
balance_floor_usd = 8.0        # below: hard stop (no new workers; serverless min 0, max = busy)
balance_interval_s = 300
history = 200

[autoscale.lease]
backend = "d1"                 # one controller acts across gateway replicas
name = "fv-autoscale"
ttl_s = 60

# $/hr per worker. Pods: Runpod secure price; `serverless:` = flex price.
[autoscale.prices]
"NVIDIA H200" = 4.59
"NVIDIA H100 80GB HBM3" = 3.49
"NVIDIA H100 NVL" = 3.19
"NVIDIA RTX PRO 6000 Blackwell Server Edition" = 2.09
"serverless:NVIDIA H100 80GB HBM3" = 4.18
"serverless:NVIDIA H200" = 5.58

# h3-turbo: 24 s warm jobs (+45 s on a worker's first job), cold start
# ~80 s worker start + 52 s load (docs/serve/e2e/serverless.md).
[[autoscale.pools]]
name = "h3-turbo"
family = "h3"
kind = "serverless"
min_workers = 0
max_workers = 4
warm_min = 0
slo_queue_wait_s = 120         # p95 queue-wait goal
cold_start_s = 132
default_job_s = 25
scale_up_step = 2
scale_up_cooldown_s = 30
idle_timeout_s = 300           # demand below capacity this long before the first step down
scale_down_cooldown_s = 120
hysteresis = 0.2
budget_usd_per_hr = 16.72      # 4 × $4.18
priority = 1
# Keep one H3 worker warm on weekday business hours (US Pacific).
schedule_utc_offset_min = -420
schedule = [{ days = [0, 1, 2, 3, 4], start_hour = 9, end_hour = 18, min_workers = 1 }]
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 60, idle_timeout_s = 60 }

# wan-turbo (FastWan 1.3B): 6.4 s jobs, cold start ~49 s + 70 s load.
[[autoscale.pools]]
name = "wan"
family = "wan"
max_workers = 3
slo_queue_wait_s = 60
cold_start_s = 120
default_job_s = 7
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 30, idle_timeout_s = 60 }

# ltx-turbo: ~40 s 1080p jobs, cold start ~79 s + 33 s load.
[[autoscale.pools]]
name = "ltx"
family = "ltx"
max_workers = 3
slo_queue_wait_s = 120
cold_start_s = 112
default_job_s = 40
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 60, idle_timeout_s = 60 }

# sfwan-live: WebRTC peer sessions need pods (one live stream per GPU).
# Pods come from a template (image, fv-serve worker config, secrets as
# {{ RUNPOD_SECRET_* }}) and register themselves with the gateway pool.
[[autoscale.pools]]
name = "sfwan-live"
family = "wan"
kind = "pod"
max_workers = 2
warm_min = 0
streams_per_worker = 1
slo_queue_wait_s = 90
cold_start_s = 180
default_job_s = 600            # a session
idle_timeout_s = 600
budget_usd_per_hr = 9.5

[autoscale.pools.pod]
template_id = "REPLACE_SFWAN_POD_TEMPLATE"
gpu_types = ["NVIDIA RTX PRO 6000 Blackwell Server Edition", "NVIDIA H100 80GB HBM3", "NVIDIA H200"]
# EU only since 2026-10-06: the US weights volume (s2k01690bi, US-CA-2) was
# deleted (docs/ops/runpod-volumes.md). Add a US placement back, first, with
# the rebuilt volume's id when the owner rebuilds it.
placements = [
  { data_center = "EUR-IS-1", volume_id = "jg48s6o1w0" },
]
cloud_type = "SECURE"
max_lifetime_s = 43200         # drained and replaced after 12 h
boot_timeout_s = 1200          # an uncached image pull alone took 458 s
url_template = "https://{id}-8000.proxy.runpod.net"
ready_path = "/ping"

# ---- END [autoscale] ------------------------------------------------------
