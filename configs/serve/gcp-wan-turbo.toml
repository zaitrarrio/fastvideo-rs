# fv-serve on a Google Cloud GPU VM: wan-turbo (FastWan2.1 1.3B DMD 3-step,
# VSA). Layout, secrets and ports as in gcp-h3-turbo.toml. The fal app id's
# last segment names the served model. Small enough for an L4 (G2).

[server]
bind = "0.0.0.0:8000"
state_dir = "/fvstate"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

[[models]]
id = "fastwan21-1.3b"
family = "wan"
recipe = "wan-turbo"
weights = "${FV_WEIGHTS}/fastwan21-1.3b"
resident = true

[aliases]
"fastwan-1.3b" = "fastwan21-1.3b"

[protocols]
openai_videos = true
fastwan = true
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true
fal_apps = ["fastvideo/fastwan21-1.3b"]

[webrtc]
udp_port = 40010
tcp_port = 40000

[limits]
queue_max = 32
body_max_mb = 64
