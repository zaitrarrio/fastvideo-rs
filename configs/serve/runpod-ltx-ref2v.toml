# fv-serve on Runpod: LTX-2.5 reference-to-video (the Ingredients IC-LoRA,
# docs/ports/ltx-ref2v.md). Secrets as in runpod.toml.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# The Ref2V companion of ltx-pro alone: the dense two-stage with the
# Ingredients IC-LoRA fused at stage 1 (weights/ltx25-ic-lora-ingredients on
# both volumes). It serves reference-to-video only; `ltx-pro` resolves to it
# on this pod. The DiT keeps an unfused copy of the weights the LoRA touches
# (~26 GB): an 80-96 GB card.
[[models]]
id = "ltx25-ref2v"
family = "ltx2"
recipe = "ltx25-ref2v"
weights = "${FV_WEIGHTS}/ltx25"
resident = true
# The IC-LoRA is ${FV_WEIGHTS}/ltx25-ic-lora-ingredients/<file> (the catalog's
# layout); `ic_lora = "/abs/path.safetensors"` overrides it.

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = true
reactor = true
native = true
# fal apps: fal's `fal-ai/ltx-2.3-quality/ingredient` (reference sheet) runs
# on ltx-pro, i.e. this model.
fal_apps = ["fal-ai/ltx-2.3-quality"]

[limits]
queue_max = 32
body_max_mb = 64

# As an fv-control cluster worker (docs/serve/edge-control-plane.md):
# FV_SERVE_ROLE=worker, FV_INTERNAL_TOKEN (the edge's) and FV_DISPATCH_FRONT=1
# make it an API front behind the edge Worker; it registers in `gw_workers`
# under `gateway.pool`. Standalone deployments ignore this.
[gateway]
pool = "ltx-ref2v"
