# fv-serve on Runpod: the Wan 2.2 5B tiers behind fal's `fal-ai/wan` app
# (docs/serve/fal-parity.md §3). Secrets as in runpod.toml.
#
#   fal-ai/wan/v2.2-5b/text-to-video            wan-max   (Wan2.2 TI2V-5B, UniPC)
#   fal-ai/wan/v2.2-5b/image-to-video           wan-max
#   fal-ai/wan/v2.2-5b/text-to-video/fast-wan   wan-turbo (FastWan2.2 TI2V-5B, DMD 3-step)
#
# Both run without VSA, so one process serves them. The turbo tier stays
# resident; the max tier loads on demand (`swap`): two resident 5B models
# with their f32 UMT5 encoders plus a 704x1280 full-VAE decode do not fit
# 96 GB together.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"
swap = true

[[models]]
id = "fastwan22-ti2v-5b"
family = "wan"
recipe = "wan-turbo"
weights = "${FV_WEIGHTS}/fastwan22-ti2v-5b"
resident = true

[[models]]
id = "wan22-ti2v-5b"
family = "wan"
recipe = "wan-max"
weights = "${FV_WEIGHTS}/wan22-ti2v-5b"
resident = false

[protocols]
fal_apps = ["fal-ai/wan"]
openai_videos = true
fastwan = false
minimax = false
fal = true
fal_director = false
ltx = false
reactor = false
native = true

[limits]
queue_max = 32
body_max_mb = 64
