# fv-serve on a Runpod pod: SF-Wan causal streaming (the `sfwan` pool
# preset of fv-control, docs/control/README.md). Secrets as in
# runpod.toml. Peer WebRTC sessions (Reactor, native streams) need inbound
# ICE-TCP/UDP, so this pool runs on pods, not serverless workers.
#
# As an fv-control cluster worker (docs/serve/edge-control-plane.md):
# FV_SERVE_ROLE=worker, FV_INTERNAL_TOKEN (the edge's) and FV_DISPATCH_FRONT=1
# make it an API front behind the edge Worker; it registers in `gw_workers`
# under `gateway.pool`. Standalone deployments ignore this.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900
heartbeat_s = 10

[engine]
backend = "cuda"
post_encoder = "auto"

# SF-Wan 1.3B causal rollout (StreamCaps::Causal), one session per GPU.
[[models]]
id = "sfwan21-1.3b"
family = "wan"
recipe = "sfwan21-1.3b"
weights = "${FV_WEIGHTS}/sfwan21-1.3b"
resident = true

[protocols]
openai_videos = false
fastwan = false
minimax = false
fal = false
fal_director = false
ltx = false
reactor = true
native = true

[reactor]
model = "sfwan21-1.3b"

# Live causal session length in video seconds (design §5.2, the R12 study):
# requests may ask for up to the hard ceiling; a reset restarts the clock.
[streams]
causal_default_max_s = 120
causal_hard_max_s = 300

[limits]
queue_max = 8
body_max_mb = 64

[gateway]
pool = "sfwan-live"
