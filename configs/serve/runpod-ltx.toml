# fv-serve on Runpod: LTX-2.5 (ltx-turbo). Secrets as in runpod.toml.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# ltx-turbo: LTX-2.5 distilled two-stage, Sol stage 2 (one GPU).
[[models]]
id = "ltx25-distill-sol"
family = "ltx2"
recipe = "ltx-turbo"
weights = "${FV_WEIGHTS}/ltx25"
resident = true

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = true
reactor = true
native = true
# fal apps: the default minimax/h3-* apps have no model on this pod. fal's
# own `lightricks/ltx-2.5` app serves `{text,image,audio}-to-video/fast` here
# (ltx-turbo); its `/pro` endpoints need ltx-pro (404 on this pod).
fal_apps = ["fastvideo/ltx-turbo", "lightricks/ltx-2.5"]

[limits]
queue_max = 32
body_max_mb = 64

# Behind the gateway (docs/serve/gateway.md): set FV_SERVE_ROLE=worker and
# FV_INTERNAL_TOKEN (the gateway's value) on the template. The worker then
# requires the internal token on every API route, trusts the gateway's
# authentication, and takes jobs from `/fv/v1/internal/jobs` (queue: the
# gateway's `kind: http` envelope). Standalone deployments ignore this.
[gateway]
pool = "ltx"
