# fv-serve on Runpod: LTX-2.5 (ltx-turbo). Secrets as in runpod.toml.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# ltx-turbo: LTX-2.5 distilled two-stage, Sol stage 2 (one GPU).
[[models]]
id = "ltx25-distill-sol"
family = "ltx2"
recipe = "ltx-turbo"
weights = "${FV_WEIGHTS}/ltx25"
resident = true

[protocols]
openai_videos = true
fastwan = false
minimax = true
fal = true
fal_director = true
ltx = true
reactor = true
native = true
# fal apps: the default minimax/h3-* apps have no model on this pod. fal's
# own `lightricks/ltx-2.5` app serves `{text,image,audio}-to-video/fast` here
# (ltx-turbo); its `/pro` endpoints need ltx-pro (404 on this pod), as do
# `fal-ai/ltx-2.3`'s `retake-video` and `extend-video` (FV_LTX_RECIPE=ltx-pro).
fal_apps = ["fastvideo/ltx-turbo", "lightricks/ltx-2.5", "fal-ai/ltx-2.3"]

[limits]
queue_max = 32
body_max_mb = 64

# As an fv-control cluster worker (docs/serve/edge-control-plane.md):
# FV_SERVE_ROLE=worker, FV_INTERNAL_TOKEN (the edge's) and FV_DISPATCH_FRONT=1
# make it an API front behind the edge Worker; it registers in `gw_workers`
# under `gateway.pool`. Standalone deployments ignore this.
[gateway]
pool = "ltx"
