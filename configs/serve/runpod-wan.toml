# fv-serve on Runpod: FastWan2.1 1.3B. Secrets as in runpod.toml. (The Wan
# tiers are the 5B models: runpod-wan5b.toml.)

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# FastWan2.1 1.3B DMD 3-step, VSA (one GPU; small, add more FASTVIDEO_VSA=1
# Wan models here). Untiered since the 5B FastWan2.2 became wan-turbo.
[[models]]
id = "fastwan21-1.3b"
family = "wan"
recipe = "fastwan21-1.3b"
weights = "${FV_WEIGHTS}/fastwan21-1.3b"
resident = true

[protocols]
# fal queue app for this model (the default apps are the H3 tiers); tested
# in the GPU E2E (docs/serve/e2e/wan.md).
fal_apps = ["fastvideo/fastwan21-1.3b"]
openai_videos = true
fastwan = true
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true

[limits]
queue_max = 32
body_max_mb = 64
