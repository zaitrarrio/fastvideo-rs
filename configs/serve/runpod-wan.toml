# fv-serve on Runpod: FastWan (wan-turbo). Secrets as in runpod.toml.

[server]
bind = "0.0.0.0:8000"
state_dir = "/workspace/fv-state"
shutdown_grace_s = 25

[auth]
mode = "keys"

[artifacts]
backend = "auto"
url_ttl_s = 86400

[jobs]
backend = "auto"
progress_interval_ms = 1000
stale_after_s = 900

[engine]
backend = "cuda"
post_encoder = "auto"

# wan-turbo: FastWan2.1 1.3B DMD 3-step, VSA (one GPU; small, add more
# FASTVIDEO_VSA=1 Wan models here).
[[models]]
id = "fastwan21-1.3b"
family = "wan"
recipe = "wan-turbo"
weights = "${FV_WEIGHTS}/fastwan21-1.3b"
resident = true

[protocols]
openai_videos = true
fastwan = true
minimax = true
fal = true
fal_director = true
ltx = false
reactor = true
native = true

[limits]
queue_max = 32
body_max_mb = 64
