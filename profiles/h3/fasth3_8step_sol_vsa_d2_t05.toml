# FastH3 8-step, Sol-Attn tau 0.5 except VSA on steps 0-1 and blocks 0-1 / 48-49, MXFP8.
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms").

[id]
name = "fasth3_8step_sol_vsa_d2_t05"
family = "minimax_h3"
description = "FastH3 8-step, Sol-Attn tau 0.5 except VSA on steps 0-1 and blocks 0-1 / 48-49, MXFP8."

[pipeline]
model = "h3"
recipe = "8step"

[techniques.sol_attn]
preset = "rtx"
tau = 0.5                 # lower tau: more exact blocks (milder)
thresh_type = "diag"
dense_steps = 2
dense_layers = "0-1,48-49"
dense_backend = "vsa"
sink = "text"

[techniques.mxfp8]

[techniques.bf16_activations]
