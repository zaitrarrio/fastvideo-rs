# Numbers: lab/gold/fasth3-4step-vsa.toml (served as h3-turbo); the decoder's in
# docs/perf/h3-vae-decode-speed.md and docs/perf/h3-vae-tile-batching.md. The video
# decoder's block linears run MXFP8 by default since 2026-10-14 (owner decision;
# FASTVIDEO_H3_VAE_MXFP8=0 restores the bf16 decode byte for byte, and the MXFP8
# decode passes the gate against it); FASTVIDEO_H3_VAE_VEC is the default (frames
# byte-identical); the tile-batch default is kept (batching every tile of a chunk
# changes no frame and buys too little).
# FastH3 Preview v1 4-step VSA: base MiniMax-H3 + the Preview VSA LoRA,
# VSA-H3, MXFP8 linears, bf16 activations.

[id]
name = "fasth3_4step_vsa"
family = "minimax_h3"
description = "FastH3 Preview 4-step, VSA, MXFP8."

[pipeline]
model = "h3"
recipe = "4step-vsa"

[techniques.vsa]

[techniques.mxfp8]

[techniques.bf16_activations]
