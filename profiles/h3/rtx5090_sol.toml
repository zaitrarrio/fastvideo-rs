# sol-engine config/minimax_h3/rtx5090_sol.toml: BF16 MiniMax-H3 plus SM120
# Sol-Attn with an exact text KV sink and dense text-query rows
# (H3_RTX5090_PROFILE=sol).

[id]
name = "h3_rtx5090_sol"
family = "minimax_h3"
description = "MiniMax-H3 sol-h3-rtx cell with Sol-Attn."
upstream = "sol-engine config/minimax_h3/rtx5090_sol.toml"

[pipeline]
model = "h3"
recipe = "sol-h3-rtx"

# models/minimax_h3/RTX5090/adapter.py `_dense_policy` (:452-461) and
# `_sol_varlen` (:476-477): dense while step < 10 or layer < 2, else Sol-Attn.
[techniques.sol_attn]
preset = "rtx"
tau = 1.0                 # SOL_ATTN_TAU
thresh_type = "diag"      # SOL_ATTN_THRESH_TYPE
dense_steps = 10          # SOL_ATTN_FIRST_DENSE_STEPS: forwards 0-9 dense
dense_layers = 2          # SOL_ATTN_FIRST_DENSE_LAYERS: blocks 0-1 dense
sink = "text"             # exact text KV sink, dense text query rows
# SOL_ATTN_CORRECTNESS_GATE = "1" upstream: its sampled dense-vs-Sol check
# is not implemented here, so it is left off.

[techniques.bf16_linears]   # official_config.transformer_dtype = "bf16"
