# Measured (RTX PRO 6000, b299214, 5 prompts, medians): 480p denoise 24.59 s (1.02x), LPIPS 0.213, PSNR 20.3 dB, sharpness 0.98 (min 0.947); gate FAIL (sharpness 1 of 5; speedup) vs h3/rtx5090_fullopt at 480p, MXFP8 (denoise 25.09 s).
# sol-h3-rtx fullopt at tau 1.25 (published: 1.0).
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms"):
# h3/rtx5090_fullopt with one change (sol-engine's knobs: SOL_ATTN_TAU,
# SOL_ATTN_FIRST_DENSE_STEPS / _LAYERS). The published profile stays the default.

[id]
name = "rtx5090_fullopt_t125"
family = "minimax_h3"
description = "sol-h3-rtx fullopt at tau 1.25 (published: 1.0)."

[pipeline]
model = "h3"
recipe = "sol-h3-rtx"

[techniques.sol_attn]
preset = "rtx"
tau = 1.25
thresh_type = "diag"
dense_steps = 10
dense_layers = 2
sink = "text"

[techniques.teacache]
threshold = 0.10
retain_steps = 5
cooldown_steps = 1
num_forwards = 49
coefficients = [1.0, 0.0]

[techniques.bf16_linears]
