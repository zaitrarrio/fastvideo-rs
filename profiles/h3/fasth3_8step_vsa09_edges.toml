# FastH3 8-step, VSA 0.9 with step 0 and blocks 0-1 / 48-49 at 0.8, MXFP8.
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms").

[id]
name = "fasth3_8step_vsa09_edges"
family = "minimax_h3"
description = "FastH3 8-step, VSA 0.9 with step 0 and blocks 0-1 / 48-49 at 0.8, MXFP8."

[pipeline]
model = "h3"
recipe = "8step"

[techniques.vsa]
sparsity = { default = 0.9, 0 = 0.8 }   # step 0 at the recipe sparsity
dense_layers = "0-1,48-49"               # first / last two blocks ...
dense_sparsity = 0.8                     # ... at the recipe sparsity

[techniques.mxfp8]

[techniques.bf16_activations]
