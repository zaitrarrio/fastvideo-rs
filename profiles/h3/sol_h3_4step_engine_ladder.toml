# Measured in the h3attn matrix family: numbers in docs/techniques.md "H3 attention arms" (h3attn, RTX PRO 6000, 2026-09-27); the served variant's are in lab/gold/sol-h3.toml. Verdict: gate PASS vs Sol-H3 4-step dense 768p, the fastest passing Sol-H3 route; it is h3-max's profile.
# Sol-H3 4-step, the engine route with tau 1.0 / 1.25 / 1.5 on forwards 1-3.
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms").

[id]
name = "sol_h3_4step_engine_ladder"
family = "minimax_h3"
description = "Sol-H3 4-step, the engine route with tau 1.0 / 1.25 / 1.5 on forwards 1-3."

[pipeline]
model = "h3"
recipe = "sol-h3"

[techniques.sol_attn]
preset = "engine"
tau = { 1 = 1.0, 2 = 1.25, 3 = 1.5 }
dense_steps = 1
dense_layers = 2
sink = "prefix"

[techniques.mxfp8]

[techniques.bf16_activations]
