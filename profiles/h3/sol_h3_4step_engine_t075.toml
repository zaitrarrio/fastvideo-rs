# Measured (RTX PRO 6000, b299214, 5 prompts, medians): 768p denoise 23.58 s (1.42x), LPIPS 0.348, PSNR 15.6 dB, sharpness 1.02, jitter 1.04; gate PASS vs Sol-H3 4-step dense 768p (denoise 33.45 s).
# Sol-H3 4-step, the engine route at tau 0.75 (milder).
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms").

[id]
name = "sol_h3_4step_engine_t075"
family = "minimax_h3"
description = "Sol-H3 4-step, the engine route at tau 0.75 (milder)."

[pipeline]
model = "h3"
recipe = "sol-h3"

[techniques.sol_attn]
preset = "engine"
tau = 0.75
dense_steps = 1
dense_layers = 2
sink = "prefix"

[techniques.mxfp8]

[techniques.bf16_activations]
