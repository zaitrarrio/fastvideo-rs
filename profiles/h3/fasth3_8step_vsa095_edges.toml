# Measured (RTX PRO 6000, b299214, 5 prompts, medians): 768p denoise 38.44 s (1.19x), LPIPS 0.545, PSNR 11.8 dB, sharpness 1.00; gate FAIL (sharpness, 1 of 5) vs FastH3 8-step 768p (denoise 45.76 s).
# FastH3 8-step, VSA 0.95 with step 0 and blocks 0-1 / 48-49 at 0.8, MXFP8.
# An arm of the h3attn matrix family (docs/techniques.md, "H3 attention arms").

[id]
name = "fasth3_8step_vsa095_edges"
family = "minimax_h3"
description = "FastH3 8-step, VSA 0.95 with step 0 and blocks 0-1 / 48-49 at 0.8, MXFP8."

[pipeline]
model = "h3"
recipe = "8step"

[techniques.vsa]
sparsity = { default = 0.95, 0 = 0.8 }
dense_layers = "0-1,48-49"
dense_sparsity = 0.8

[techniques.mxfp8]

[techniques.bf16_activations]
