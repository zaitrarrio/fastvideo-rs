# Family manifest (layer 2, docs/adr/0008-family-manifest-layer-2.md): LTX-2 / LTX-2.3 / LTX-2.5.
# The source the engine catalog, the serve configs and the deployment tooling are
# projected from (plan A3): hand-edited, validated by `cargo test -p fastvideo-manifest
# -p fastvideo-engine-service` (families/README.md). Paths: `${weights}/<tree>/...` and
# `${tae}/<file>` are substituted with the engine's weight layout at load.

schema = 1

[family]
id = "ltx2"
display = "LTX-2 / LTX-2.3 / LTX-2.5"
licence = "LTX-2 Community License"
port_doc = "docs/ports/ltx2.md"

[[variants]]
id = "ltx25-distill-dense"
tier = "max"
resident_default = true
recipe_name = "ltx25-distill-two-stage-dense"
trees = ["ltx25"]

[variants.gpu]
min_vram_gib = 80
min_sm = 80

[variants.caps.frames]
step = 8
offset = 1
min = 9
max = 481

[variants.caps.canvas]
multiple = 64
max_area = 8355840
aspect = [0.25, 4.0]
short_edges = [1080, 480, 720, 768, 1440, 2160]

[variants.caps.fps]
allowed = [24, 25, 48, 50]
default = 24

[variants.caps.refs]
images = 0
videos = 0
audios = 0
total = 0

[variants.caps.knobs]
seed = true
negative = false
steps = false
guidance = false
guidance_2 = false
flow_shift = false

[variants.serving]
tasks = ["t2v", "i2v", "keyframes", "extend", "retake"]
frames_default = 121
pad_and_crop = true

[variants.serving.audio]
native_rate = 48000
channels = 2

[variants.engine]
a2v = "off"
canvas = [1920, 1080]
dit = "${weights}/ltx25"
family = "ltx2"
profile = "ltx2/ltx25_distill_dense"
refine_steps = 3
sage_attention = true
stage1_steps = 8
stage2 = "dense"
text = "streamed"
two_stage = true
version = "2.5"
weights = "${weights}/ltx25"

