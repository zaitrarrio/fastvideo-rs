# Family manifest (layer 2, docs/adr/0008-family-manifest-layer-2.md): MiniMax-H3 / FastH3.
# The source the engine catalog, the serve configs and the deployment tooling are
# projected from (plan A3): hand-edited, validated by `cargo test -p fastvideo-manifest
# -p fastvideo-engine-service` (families/README.md). Paths: `${weights}/<tree>/...` and
# `${tae}/<file>` are substituted with the engine's weight layout at load.

schema = 1

[family]
id = "h3"
display = "MiniMax-H3 / FastH3"
licence = "MiniMax-H3 Community License"
port_doc = "docs/ports/h3.md"

[[variants]]
id = "sol-h3"
tier = "max"
public_names = ["MiniMax-H3-Max"]
resident_default = true
recipe_name = "sol-h3-4step-engine-ladder"
trees = ["FastH3-4-step-Preview-v1-LoRA", "h3-base"]

[variants.gpu]
min_vram_gib = 80
min_sm = 89
needs = ["fp8"]

[variants.caps.frames]
step = 17
offset = 5
min = 107
max = 362

[variants.caps.canvas]
multiple = 32
max_area = 1032192
aspect = [0.25, 4.0]
short_edges = [768, 480, 1080]

[variants.caps.fps]
allowed = [24]
default = 24

[variants.caps.refs]
images = 9
videos = 3
audios = 3
total = 12

[variants.caps.knobs]
seed = true
negative = false
steps = false
guidance = false
guidance_2 = false
flow_shift = false

[variants.serving]
tasks = ["t2v", "i2v", "keyframes"]
frames_default = 124

[variants.serving.audio]
native_rate = 32000
channels = 2

[variants.serving.hd]
short_edge = 1080
max_area = 2088960
max_frames = 124
experimental_max_frames = 243

[variants.engine]
dense = false
family = "h3"
hd_1080p = true
i2v_encoder = "auto"
profile = "h3/sol_h3_4step_engine_ladder"
recipe = "sol-h3"
ref2va = false
short_edge = 768
steps = 4
text_encoder = "auto"
text_weights = "${weights}/h3-base"
warmup = false
warmup_blocking = false
weights = "${weights}/h3-base"

