# ---- family presets (owner decision 2026-10-18: "for the presets means all of the weights for a model family and
# it's variants are installed onto 1 [pod]"): ONE pool, one GPU, one fv-serve process whose worker config lists
# every variant of the family (configs/serve/runpod-family-*.toml; the first resident, the rest `resident = false`
# with `[engine] swap = true`). `members` are the model presets whose models it serves, in the presets' order;
# fv-control's tests check them against the family rule (control/src/presets.ts H3_FAMILY_MEMBERS, …). Its weights
# are the union of the members' trees; its queue, timeouts and disk the members' largest. `{members}` in the title
# and description is replaced by the members, comma separated. `min_vram_gb` is hand-chosen, not the members'
# largest gpu.min_vram_gib: the NVFP4 members need sm_100, which only 96 GB cards offer here (RTX PRO 6000, B200),
# and two resident SF-Wan pipelines want an 80 GB-class card (fv-control filters GPUs by memory only).
[[family_presets]]
id = "h3-family"
title = "H3 family: every H3 variant on one pod"
description = "Every H3 variant a preset serves on ONE GPU, one fv-serve process ({members}, and the 480p draft tier): turbo resident, the others loaded on their first request (one DiT at a time: a switch unloads the resident one and loads the next from the pod's disk, about a minute). RTX PRO 6000 (96 GB, sm_120) or B200: the NVFP4 releases need NVFP4 tensor cores and VDN-H3 a 96 GB card. Weights from R2 by default (the EU volume lacks the NVFP4, Trim, LoRA and VDN trees): about 396 GB, a 485 GB container disk."
image = "h3-max"
config = "runpod-family-h3.toml"
min_vram_gb = 96
members = ["h3-turbo", "h3-max", "h3-ref2v", "fasth3-trim", "fasth3-trim-nvfp4", "fasth3-v2-nvfp4", "fasth3-4step-nvfp4", "fasth3-v2-nvfp4-preview", "fasth3-4step-nvfp4-preview", "h3-turbo-preview", "fasth3-trim-nvfp4-fast", "h3-larry-turbo", "h3-lightx2v-turbo", "vdn-h3", "vdn-h3-8step", "h3-lightx2v-turbo-v01"]

[[family_presets.left_out]]
what = "fasth3-8step-dense (catalog, no preset)"
why = "its 148 GB h3-8step tree would take the union past Runpod's 500 GB container disk"

[[family_presets.left_out]]
what = "the MXFP8 pre-quantized trees (77 GB)"
why = "they would take the union (about 396 GB, 485 GB of disk) to 573 GB of disk, past Runpod's 500 GB: turbo and max quantize at load instead"

[[family_presets]]
id = "fasth3-family"
title = "FastH3 family: every FastH3 release on one pod"
description = "Every FastH3 release a preset serves on ONE GPU, one fv-serve process ({members}, and the 480p draft tier): turbo resident, the previews, Trim and the NVFP4 tier loaded on their first request (one DiT at a time). RTX PRO 6000 (96 GB, sm_120) or B200 (NVFP4 tensor cores). Weights from R2 by default: about 371 GB with turbo's pre-quantized trees, a 457 GB container disk."
image = "h3-max"
config = "runpod-family-fasth3.toml"
min_vram_gb = 96
members = ["h3-turbo", "fasth3-trim", "fasth3-trim-nvfp4", "fasth3-v2-nvfp4", "fasth3-4step-nvfp4", "fasth3-v2-nvfp4-preview", "fasth3-4step-nvfp4-preview", "h3-turbo-preview", "fasth3-trim-nvfp4-fast"]
prequant = ["h3-base/text_encoder_fp8", "h3-base/transformer_prequant_4step-vsa_mxfp8"]

[[family_presets.left_out]]
