# Deployment data (plan C1, docs/adr/0011-deploy-section.md): how the variants of families/*.toml are deployed.
# The deployment unit is a preset (one pool: a set of variants served together by one fv-serve process, on one
# image variant, with one worker config, queue and timeouts), not a variant. Validated by
# crates/fastvideo-manifest (module `deploy`, schema schemas/deploy.v1.json) against the family manifests;
# control/gen-configs.mjs generates from it: control/src/deploy-gen.ts (fv-control's presets and image
# variants), the regions of control/src/enums.ts, scripts/serve/variants.sh, docker/gpucheck.Dockerfile,
# configs/autoscale.toml and docs/serve/images.md, and scripts/gcp/families.tsv. Edit here, then run
# `node control/gen-configs.mjs` (CI: `--check`, .github/workflows/control.yml).
#
# What is not here: the worker configs themselves (configs/serve/*.toml: the variants a process serves and
# their residency), the weights each variant reads (families/*.toml `trees`), the weights source (derived per
# preset: the EU volume when it holds every tree, else R2; control/src/providers.ts weightsSource).
schema = 1

# The edge / dispatch family of each model family (docs/serve/dispatch-do-family.md §4; the edge's family
# Durable Objects and fv-serve's tests/e2e.rs do_family): a GCP row's dispatch_family, an autoscale pool's family.
[dispatch]
h3 = "h3"
ltx2 = "ltx"
wan = "wan"

# ---- image variants: the serve images CI builds (docker/gpucheck.Dockerfile `serve-<id>` stages,
# .github/workflows/serve-image.yml, docs/serve/images.md). `config` is baked as FV_CONFIG; `also` are further
# worker configs the image carries; every CUDA image also carries runpod-fake.toml for the CI smoke check.
# `compute = "cpu"`: fv-serve without CUDA (the fake engine), its own build stage. `legacy`: an old tag set
# documented in the tables, not built as a variant.
[[images]]
id = "h3-turbo"
config = "runpod.toml"

[[images]]
id = "h3-max"
config = "runpod-h3-max.toml"

[[images]]
id = "ltx"
config = "runpod-ltx.toml"

[[images]]
id = "wan"
config = "runpod-wan.toml"

[[images]]
id = "wan5b"
config = "runpod-wan5b.toml"
# runpod-wan14b.toml: the Wan 14B fast tier on the same binary (FV_CONFIG=/etc/fv/runpod-wan14b.toml selects it).
also = ["runpod-wan14b.toml"]

[[images]]
id = "sfwan"
config = "runpod-sfwan.toml"

[[images]]
id = "cpu"
config = "runpod-fake.toml"
compute = "cpu"
note = "CPU only, fake engine; `gateway` until 2026-10-06"

[[images]]
id = "debug"
config = "runpod.toml"
legacy = true
note = "the old all-in-one tags; since 2026-10-06 the `runtime` image + fv-serve, on the shared layers"

# ---- model presets: one model (or one tier and its companions) per pool. Their weights and GPU memory
# (min_vram_gb) derive from the family manifests through their models' variants (control/src/presets.ts
# fromManifest). The presets reuse the image variants CI builds (`image`); a config the image does not carry
# rides inline (FV_WORKER_TOML_B64, generated from configs/serve by control/gen-configs.mjs). `standard`: one
# of the default cluster's pools (fv-control STANDARD_POOLS).
[[presets]]
id = "h3-turbo"
title = "H3 turbo (fasth3)"
description = "MiniMax H3 turbo tier; also the Reactor's clip model."
standard = true
image = "h3-turbo"
config = "runpod.toml"
prequant = ["h3-base/text_encoder_fp8", "h3-base/transformer_prequant_4step-vsa_mxfp8"]
models = [{ variant = "fasth3-4step-vsa", id = "fasth3", recipe = "h3-turbo" }]
max_queued = 32
job_timeout_s = 1800
stale_after_s = 120

