min_vram_gb = 80
members = ["ltx", "ltx-pro", "ltx-a2v", "ltx-ref2v"]

[[family_presets.left_out]]
what = "ltx25-distill-sol-nvfp4-taehv (catalog ltx-draft, no preset)"
why = "its NVFP4 linears are a process-wide load setting the other LTX recipes do not share (the engine's ProcessPlan): its own process"

[[family_presets]]
id = "streaming-family"
title = "Streaming: every causal streaming model on one pod ({members}; LongLive weights NON-COMMERCIAL)"
description = "Every causal streaming model on ONE GPU, one fv-serve process ({members}): SF-Wan resident (the Reactor's model), LongLive loaded on its first request; an SF-Wan pipeline stays resident once loaded, so both end up resident (26-33 GB peak each): an 80 GB-class card. Weights from R2 by default (about 36 GB)."
image = "sfwan"
config = "runpod-family-streaming.toml"
min_vram_gb = 80
members = ["sfwan", "longlive"]

# ---- Google Cloud VMs (docs/serve/deploy-gcp.md): one row of scripts/gcp/families.tsv each. A row with a
# `runpod_twin` takes its weight trees and served model ids from that config's [[models]]; a row without one
# (the fake engine) names its served ids. `verify_cells` are scripts/gpu/verify-weights.sh cells.
[[gcp]]
name = "h3-turbo"
config = "gcp-h3-turbo.toml"
runpod_twin = "runpod.toml"
dispatch_family = "h3"
verify_cells = ["fasth3-4step-vsa", "aux"]
machine = "g4-standard-48"
fal_app = "minimax/h3-turbo"
minimax_model = "MiniMax-H3"
reactor_mode = "av"

[[gcp]]
name = "h3-max"
config = "gcp-h3-max.toml"
runpod_twin = "runpod-h3-max.toml"
dispatch_family = "h3"
verify_cells = ["sol-h3", "aux"]
machine = "g4-standard-48"
fal_app = "minimax/h3-max"
minimax_model = "MiniMax-H3-Max"
reactor_mode = "av"

[[gcp]]
name = "ltx"
config = "gcp-ltx.toml"
runpod_twin = "runpod-ltx.toml"
dispatch_family = "ltx"
verify_cells = ["ltx25-two-stage", "aux"]
machine = "g4-standard-48"
fal_app = "fastvideo/ltx-turbo"
minimax_model = "ltx25-distill-sol"
reactor_mode = "av"

[[gcp]]
name = "wan"
config = "gcp-wan.toml"
runpod_twin = "runpod-wan.toml"
dispatch_family = "wan"
verify_cells = ["fastwan21-1.3b", "aux"]
machine = "g4-standard-48"
fal_app = "fastvideo/fastwan21-1.3b"
minimax_model = "fastwan21-1.3b"
reactor_mode = "video"

[[gcp]]
name = "fake"
config = "runpod-fake.toml"
machine = "g2-standard-8"
fal_app = "minimax/h3-turbo"
minimax_model = "MiniMax-H3"
served = ["fake-h3-turbo"]
reactor_mode = "av"

# ---- autoscale pools: copied verbatim (comments included) into the `[[autoscale.pools]]` of
# configs/autoscale.toml. fv-autoscale (crates/fastvideo-autoscale, AutoscaleConfig) owns their format and checks
# it; the prices and the controller's own settings stay in configs/autoscale.toml. This is the last section of
# the file: everything below this comment is the copy. A placement that mounts a volume must be the EU weights
# volume (CLAUDE.md: EU only).

# h3-turbo: 24 s warm jobs (+45 s on a worker's first job), cold start
# ~80 s worker start + 52 s load (docs/serve/e2e/serverless.md).
[[autoscale.pools]]
name = "h3-turbo"
family = "h3"
kind = "serverless"
min_workers = 0
max_workers = 4
warm_min = 0
slo_queue_wait_s = 120         # p95 queue-wait goal
cold_start_s = 132
default_job_s = 25
scale_up_step = 2
scale_up_cooldown_s = 30
idle_timeout_s = 300           # demand below capacity this long before the first step down
scale_down_cooldown_s = 120
hysteresis = 0.2
budget_usd_per_hr = 16.72      # 4 × $4.18
priority = 1
# Keep one H3 worker warm on weekday business hours (US Pacific).
schedule_utc_offset_min = -420
schedule = [{ days = [0, 1, 2, 3, 4], start_hour = 9, end_hour = 18, min_workers = 1 }]
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 60, idle_timeout_s = 60 }

# wan-turbo (FastWan 1.3B): 6.4 s jobs, cold start ~49 s + 70 s load.
[[autoscale.pools]]
name = "wan"
family = "wan"
max_workers = 3
slo_queue_wait_s = 60
cold_start_s = 120
default_job_s = 7
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 30, idle_timeout_s = 60 }

# ltx-turbo: ~40 s 1080p jobs, cold start ~79 s + 33 s load.
[[autoscale.pools]]
name = "ltx"
family = "ltx"
max_workers = 3
slo_queue_wait_s = 120
cold_start_s = 112
default_job_s = 40
serverless = { gpu_type = "NVIDIA H100 80GB HBM3", scaler_type = "QUEUE_DELAY", scaler_value = 60, idle_timeout_s = 60 }

# sfwan-live: WebRTC peer sessions need pods (one live stream per GPU).
# Pods come from a template (image, fv-serve worker config, secrets as
# {{ RUNPOD_SECRET_* }}) and register themselves with the gateway pool.
[[autoscale.pools]]
name = "sfwan-live"
family = "wan"
kind = "pod"
max_workers = 2
warm_min = 0
streams_per_worker = 1
slo_queue_wait_s = 90
cold_start_s = 180
default_job_s = 600            # a session
idle_timeout_s = 600
budget_usd_per_hr = 9.5

[autoscale.pools.pod]
template_id = "REPLACE_SFWAN_POD_TEMPLATE"
gpu_types = ["NVIDIA RTX PRO 6000 Blackwell Server Edition", "NVIDIA H100 80GB HBM3", "NVIDIA H200"]
# The EU weights volume (fv-weights-h3-ltx-500, EU-RO-1, since 2026-10-13) holds
# the H3 + LTX trees only: sfwan21-1.3b is NOT on it, so this pod template must
# fetch it from R2 before the pool leaves dry_run (docs/ops/runpod-volumes.md).
# The US weights volume (s2k01690bi, US-CA-2) was deleted; add a US placement
# back, first, with the rebuilt volume's id when the owner rebuilds it.
placements = [
  { data_center = "EU-RO-1", volume_id = "bz0ofkfx45" },
]
cloud_type = "SECURE"
max_lifetime_s = 43200         # drained and replaced after 12 h
boot_timeout_s = 1200          # an uncached image pull alone took 458 s
url_template = "https://{id}-8000.proxy.runpod.net"
ready_path = "/ping"
