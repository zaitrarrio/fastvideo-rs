# One GitHub-hosted fallback job of tools-release.yml (docs/dev/tools-releases.md
# "GitHub-hosted fallback"): build the group's dependency image
# (docker/tools-deps.Dockerfile, buildx, GHCR registry layer cache), then run a
# command in a container of it with the checkout at /src and $FV_WORK at /work
# (scripts/ci/in-build-base.sh; rustc via sccache on the Actions cache). The
# calling step's env (FV_*, CARGO_PROFILE_*) reaches the container.
name: tools-deps-run
description: Dependency image for a tools-release group, then a command in it
inputs:
  group:
    description: "tools-deps.sh group"
    required: true
  oxide-stage:
    description: "deps-oxide or deps-nooxide"
    default: deps-nooxide
  run:
    description: "command for bash -c in the container"
    required: true
  token:
    description: "GITHUB_TOKEN (packages: write for the layer cache)"
    required: true
runs:
  using: composite
  steps:
    - name: Work dir and submodule
      shell: bash
      run: |
        sudo mkdir -p "$FV_WORK" && sudo chown "$(id -u):$(id -g)" "$FV_WORK"
        git submodule update --init third_party/cutile-rs
    # sccache's GitHub Actions cache store needs these in the step env.
    - name: Actions cache credentials for sccache
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Dependency image (cargo chef, registry layer cache)
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        OXIDE_STAGE: ${{ inputs.oxide-stage }}
      run: |
        repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-tools-deps"
        docker buildx build -f docker/tools-deps.Dockerfile --target deps \
          --build-arg BASE_IMAGE="$(bash scripts/dev/build-base-tag.sh --image)" \
          --build-arg GROUP="$GROUP" --build-arg OXIDE_STAGE="$OXIDE_STAGE" \
          --cache-from "type=registry,ref=$repo:cache-$GROUP" --cache-from "type=registry,ref=$repo:cache-oxide" \
          --cache-to "type=registry,ref=$repo:cache-$GROUP,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
          --load -t "fv-tools-deps:$GROUP" .
    - name: Run in it
      shell: bash
      env:
        FV_BUILD_BASE_IMAGE: fv-tools-deps:${{ inputs.group }}
        FV_IMAGE_DIRS: "1"
        RUN: ${{ inputs.run }}
      run: bash scripts/ci/in-build-base.sh bash -c "$RUN"
