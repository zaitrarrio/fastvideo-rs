# Client-compat CI (docs/serve/design.md §7.5, WP-17): the real client
# libraries (openai, fal-client, @fal-ai/client, reactor_sdk, requests,
# aiohttp, Playwright Chromium) against `fv-serve --features fake`.
#
# One job builds fv-serve once; a matrix runs each suite of
# tests/compat/run.sh against that binary. Client versions are pinned in
# tests/compat/requirements.txt and tests/compat/package-lock.json.
name: serve-compat

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "tests/compat/**"
      - "tests/console/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/ci/prebuilt.sh"
      - "scripts/ci/tools-release.sh"
      - "scripts/ci/check-build-base.sh"
      - "docker/build-base.Dockerfile"
      - ".github/workflows/serve-compat.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/fastvideo-serve/**"
      - "crates/fastvideo-serve-kit/**"
      - "crates/fastvideo-engine-service/**"
      - "crates/fastvideo-protocol/**"
      - "crates/fastvideo-media/**"
      - "crates/fastvideo-webrtc/**"
      - "crates/fastvideo-openai-videos/**"
      - "crates/fastvideo-minimax/**"
      - "crates/fastvideo-ltxapi/**"
      - "crates/fastvideo-fal/**"
      - "crates/fastvideo-reactor/**"
      - "tests/compat/**"
      - "tests/console/**"
      - "Cargo.lock"
      - ".github/workflows/serve-compat.yml"

permissions:
  contents: read

# Pull requests cancel superseded runs; main runs every pushed sha to the end
# (agents push to main often, and a cancelled matrix says nothing).
concurrency:
  group: serve-compat-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    name: build fv-serve (fake)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The same debug fake build from the tools release built from exactly
      # this checkout's tools inputs (docs/dev/tools-releases.md); a pull
      # request that changes them has none, so cargo runs here.
      - name: Prebuilt fv-serve (fake, tools release)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          FV_PREBUILT_DISABLE: ${{ vars.FV_PREBUILT_DISABLE || '0' }}
        run: bash scripts/ci/prebuilt.sh fetch serve-fake
      - name: Use the prebuilt fv-serve
        if: steps.pre.outputs.ok == 'true'
        run: |
          mkdir -p target/debug
          install -m 755 "${{ steps.pre.outputs.dir }}/serve-fake/fv-serve" target/debug/fv-serve
          target/debug/fv-serve --version
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pre.outputs.ok != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.pre.outputs.ok != 'true'
        with:
          shared-key: serve-compat
      - name: Build fv-serve --features fake,full
        if: steps.pre.outputs.ok != 'true'
        run: |
          cargo build -p fastvideo-serve --features fake,full --bin fv-serve \
            --config 'profile.dev.package.openh264-sys2.opt-level=3' \
            --config 'profile.dev.package.openh264.opt-level=3' \
            --config 'profile.dev.package.audiopus_sys.opt-level=3' \
            --config 'profile.dev.package.libwebp-sys.opt-level=3'
      - uses: actions/upload-artifact@v4
        with:
          name: fv-serve-fake
          path: target/debug/fv-serve
          retention-days: 3

  suite:
    name: compat ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The build base image (docker/build-base.Dockerfile): ffmpeg with libvpx,
    # python3, Node and Playwright's Chromium (PLAYWRIGHT_BROWSERS_PATH=
    # /opt/pw-browsers) are in it, so nothing is apt-installed here. The tag is
    # pinned by scripts/dev/build-base-tag.sh (same as build-pod.sh).
    container:
      image: ghcr.io/zaitrarrio/fastvideo-rs-build-base:bb-d872f7724765429b
      # Chromium needs more than Docker's 64 MB /dev/shm.
      options: --shm-size=2g
    strategy:
      fail-fast: false
      matrix:
        suite: [openai, fastwan, minimax, ltx, fal-py, fal-js, fal-webhook, fal-director, reactor, console]
    env:
      FV_SERVE_BIN: ${{ github.workspace }}/bin/fv-serve
      FV_COMPAT_DIR: ${{ github.workspace }}/compat-clients
      FV_COMPAT_KEEP_LOGS: "1"
      FV_COMPAT_LOGS: ${{ github.workspace }}/compat-logs
    steps:
      - uses: actions/checkout@v4
      - name: Image has the tools (no installs at run time)
        run: bash scripts/ci/check-build-base.sh ${{ (matrix.suite == 'fal-director' || matrix.suite == 'console') && 'browser' || 'compat' }}
      - uses: actions/download-artifact@v4
        with:
          name: fv-serve-fake
          path: bin
      - run: chmod +x bin/fv-serve
      # The pinned pip/npm clients (tests/compat/requirements.txt,
      # package-lock.json), cached per image and pins.
      - name: Client cache
        uses: actions/cache@v4
        with:
          path: compat-clients
          key: compat-clients-fastvideo-rs-build-base:bb-d872f7724765429b-${{ hashFiles('tests/compat/requirements.txt', 'tests/compat/package.json', 'tests/compat/package-lock.json') }}
      - name: Pinned clients
        run: bash tests/compat/run.sh --setup
      - name: Run ${{ matrix.suite }}
        run: bash tests/compat/run.sh ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compat-logs-${{ matrix.suite }}
          path: compat-logs/
          retention-days: 7
