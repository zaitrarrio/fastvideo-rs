# The CI bridge of the gold files (plan D4, docs/adr/0023-lab-report-and-ci-bridge.md):
# every lab/gold/<variant>.toml parses and resolves against families/*.toml
# (variant, family, tier, profile, registry name and @rev), every
# [last_validated].commit is a commit of this repository, and the validation
# age of every variant goes to the job summary. Warn-only on age and on
# missing validation (no gold file is validated yet); a parse or resolution
# failure, or a validated commit that does not exist, fails. Then
# docs/perf/tiers.md must be what `fv-lab report tiers` renders from the run
# set it names. CPU only, no secrets, nothing spent. Third-party actions are
# pinned by commit (read from their tags with `git ls-remote`, 2026-10-24).
name: gold-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lab/**"
      - "families/**"
      - "crates/fastvideo-lab/**"
      - "docs/perf/tiers.md"
      - "artifacts/runpod/gold/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/gold-check.yml"
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "families/**"
      - "crates/fastvideo-lab/**"
      - "docs/perf/tiers.md"
      - "artifacts/runpod/gold/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/gold-check.yml"

permissions:
  contents: read

concurrency:
  group: gold-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gold-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # actions/checkout v4 (refs/tags/v4), pinned by commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The whole history: `git cat-file -e` and the commits since each
          # last_validated.commit need it.
          fetch-depth: 0
      # dtolnay/rust-toolchain, branch `stable` at the time of pinning
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      # Swatinem/rust-cache v2 (refs/tags/v2, v2.9.3)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: build fv-lab
        run: cargo build --locked -p fastvideo-lab --features cli --bin fv-lab
      - name: fv-lab gold check (validation age to the job summary)
        run: |
          set -o pipefail
          ./target/debug/fv-lab gold check --root . | tee -a "$GITHUB_STEP_SUMMARY"
      - name: fv-lab gold cells --check (the gold tier's cells equal their gold files)
        run: ./target/debug/fv-lab gold cells --check --root .
      - name: fv-lab report tiers --check (docs/perf/tiers.md is current)
        run: ./target/debug/fv-lab report tiers --check --root .
