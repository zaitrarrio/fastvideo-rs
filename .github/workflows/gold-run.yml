# The gold runs (plan D3/D4, docs/adr/0023-lab-report-and-ci-bridge.md §4):
# `fv-lab run gold --all` on one RTX PRO 6000 pod, made by `fv-lab pod up` on
# fv-deploy's money guards (the tier's $2.50/hr price cap on the quote and on
# the billed price, the $8 balance floor projected over the 4 h wall cap, the
# detached backstop at the cap, ready within 600 s in at most 3 cycles), then
# fetched into artifacts/runpod/gold/<tag>/, the pod deleted, and
# docs/perf/tiers.md rendered from that run set as an artifact and the job
# summary. Nothing is committed: the owner commits the run set and the table.
#
# It SPENDS MONEY (about $2.49/hr; the EU-volume arms take roughly an hour) and
# needs the repository secret RUNPOD_API_KEY, which this repository does not
# set: adding it is the owner's decision. Without it the job refuses to start.
# workflow_dispatch only, never on push or pull request, one run at a time.
name: gold-run

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "7-hex commit whose runtime image (fastvideo-rs-runtime:sha-<7>) the pod boots; it must carry fv-lab and the gold tier"
        required: true
      cells:
        description: "Only these arms (variant ids, space separated); empty: every gold variant (--all)"
        required: false
        default: ""
      confirm:
        description: "Type `spend` to create the pod (it costs money)"
        required: true

permissions:
  contents: read

concurrency:
  group: gold-run
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gold-run:
    runs-on: ubuntu-22.04
    # Over the gold tier's 4 h wall cap (the pod's backstop deletes it then),
    # plus the build, readiness and the fetch.
    timeout-minutes: 300
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      SHA: ${{ inputs.sha }}
      CELLS: ${{ inputs.cells }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: refuse without the secret, the confirmation or a commit
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "::error::RUNPOD_API_KEY is not set for this repository: the gold runs spend money and need the owner to add the secret (docs/adr/0023-lab-report-and-ci-bridge.md §4). Nothing was created."
            exit 1
          fi
          if [ "${CONFIRM}" != "spend" ]; then
            echo "::error::confirm must be \`spend\` (this run creates a paid GPU pod). Nothing was created."
            exit 1
          fi
          if ! [[ "${SHA}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::sha must be 7 lowercase hex digits. Nothing was created."
            exit 1
          fi
          if ! [[ "${CELLS}" =~ ^[a-z0-9.\ _-]*$ ]]; then
            echo "::error::cells: variant ids separated by spaces. Nothing was created."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build fv-lab
        run: cargo build --release --locked -p fastvideo-lab --features cli --bin fv-lab
      - name: the plan (no key used, nothing created)
        run: ./target/release/fv-lab pod up --sha "$SHA" --family gold --root .
      - name: fv-lab pod up --family gold --yes --wait (runs `fv-lab run gold --all`, fetches, deletes)
        run: |
          set -- --sha "$SHA" --family gold --root . --yes --wait
          if [ -n "$CELLS" ]; then
            # shellcheck disable=SC2086  # the arm names are split on purpose
            set -- "$@" --cells $CELLS
          fi
          ./target/release/fv-lab pod up "$@"
      - name: delete every pod this job created (also on failure or cancel)
        if: always()
        run: |
          shopt -s nullglob
          for rec in artifacts/fv-lab/pods/*.json; do
            id="$(basename "$rec" .json)"
            ./target/release/fv-lab pod down "$id" --root . || echo "pod $id: already gone or not deletable (see the ledger)"
          done
      - name: docs/perf/tiers.md from the run set
        if: always()
        run: |
          shopt -s nullglob
          runs=(artifacts/runpod/gold/*/)
          if [ "${#runs[@]}" -eq 1 ]; then
            ./target/release/fv-lab report tiers --root . --runs "${runs[0]%/}"
            cat docs/perf/tiers.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "no single run set under artifacts/runpod/gold/ (${#runs[@]}): no table" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the run set, the table and the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-run-${{ inputs.sha }}
          path: |
            artifacts/runpod/gold/
            artifacts/fv-lab/
            docs/perf/tiers.md
          if-no-files-found: warn
