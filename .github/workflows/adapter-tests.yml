# Adapter tests with coverage (plan E4): `cargo test --locked` of the fv-serve
# adapter crates (openai-videos, minimax, ltxapi, fal, reactor), the serve
# crate that mounts them and the CPU crates they build on (protocol, trace,
# engine-service, serve-kit, upsampler), fastvideo-lab (the gold files of
# lab/gold and the profile-comment lint) and fastvideo-manifest (the family
# manifests and deploy/deploy.toml: validation, schema drift), instrumented by
# cargo-llvm-cov. The parameter certification matrix (plan E3,
# crates/fastvideo-serve/tests/cert_matrix.rs) runs here as a serve test and
# checks docs/serve/certification.tsv. The
# crate set lives in scripts/serve/coverage.sh, which also writes the reports:
# lcov.info and an HTML report as the `adapter-coverage` artifact, and the
# line / region / function totals in the job summary.
#
# This is the only workflow that runs these crates' Rust tests on pull
# requests: serve-compat runs the client libraries against the fv-serve
# binary, and tools-release runs scripts/serve/check.sh only on pushes to
# main whose tools inputs changed. No GPU, no CUDA.
name: adapter-tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/fastvideo-protocol/**"
      - "crates/fastvideo-trace/**"
      - "crates/fastvideo-engine-service/**"
      - "crates/fastvideo-serve-kit/**"
      - "crates/fastvideo-upsampler/**"
      - "crates/fastvideo-openai-videos/**"
      - "crates/fastvideo-minimax/**"
      - "crates/fastvideo-ltxapi/**"
      - "crates/fastvideo-fal/**"
      - "crates/fastvideo-reactor/**"
      - "crates/fastvideo-serve/**"
      - "crates/fastvideo-media/**"
      - "crates/fastvideo-webrtc/**"
      - "crates/fastvideo-lab/**"
      - "crates/fastvideo-manifest/**"
      - "crates/fastvideo-deploy/**"
      - "deploy/deploy.toml"
      - "lab/**"
      # fastvideo-lab's tests/lab_files.rs reads these (trees, gates, the EU volume,
      # the TAE files the start command fetches).
      - "scripts/gpu/weights-manifest.tsv"
      - "scripts/gpu/verify-weights.sh"
      - "scripts/gpu/volumes.sh"
      - "scripts/gpu/fetch-tae.sh"
      - "profiles/**"
      - "families/**"
      # The shipped serve configs and the certification matrix's TSV (plan
      # E3): param_spec_golden and cert_matrix read them.
      - "configs/serve/**"
      - "tests/compat/serve.toml"
      - "docs/serve/certification.tsv"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/serve/coverage.sh"
      - ".github/workflows/adapter-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "crates/fastvideo-protocol/**"
      - "crates/fastvideo-trace/**"
      - "crates/fastvideo-engine-service/**"
      - "crates/fastvideo-serve-kit/**"
      - "crates/fastvideo-upsampler/**"
      - "crates/fastvideo-openai-videos/**"
      - "crates/fastvideo-minimax/**"
      - "crates/fastvideo-ltxapi/**"
      - "crates/fastvideo-fal/**"
      - "crates/fastvideo-reactor/**"
      - "crates/fastvideo-serve/**"
      - "crates/fastvideo-media/**"
      - "crates/fastvideo-webrtc/**"
      - "crates/fastvideo-lab/**"
      - "crates/fastvideo-manifest/**"
      - "crates/fastvideo-deploy/**"
      - "deploy/deploy.toml"
      - "lab/**"
      # fastvideo-lab's tests/lab_files.rs reads these (trees, gates, the EU volume,
      # the TAE files the start command fetches).
      - "scripts/gpu/weights-manifest.tsv"
      - "scripts/gpu/verify-weights.sh"
      - "scripts/gpu/volumes.sh"
      - "scripts/gpu/fetch-tae.sh"
      - "profiles/**"
      - "families/**"
      - "configs/serve/**"
      - "tests/compat/serve.toml"
      - "docs/serve/certification.tsv"
      - "Cargo.lock"
      - "scripts/serve/coverage.sh"
      - ".github/workflows/adapter-tests.yml"

permissions:
  contents: read

# Pull requests cancel superseded runs; main runs every pushed sha to the end
# (the same rule as serve-compat).
concurrency:
  group: adapter-tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  coverage:
    name: cargo test + llvm-cov (adapter crates)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # The build base image (docker/build-base.Dockerfile): the build pod's
    # Rust toolchain (RUSTUP_TOOLCHAIN pins it, the same rustc the pod and
    # the fmt gates use) and ffmpeg with libvpx / libx264, so the media
    # paths of the fal and Reactor tests run instead of skipping. The tag is
    # pinned by scripts/dev/build-base-tag.sh (same as build-pod.sh).
    container:
      image: ghcr.io/zaitrarrio/fastvideo-rs-build-base:bb-d124c1066ca42695
    env:
      # The image routes rustc through sccache for the build pod; not here.
      RUSTC_WRAPPER: ""
      FV_COV_OUT: ${{ github.workspace }}/coverage
    steps:
      - uses: actions/checkout@v4
      - name: Image has the tools (no installs at run time)
        run: bash scripts/ci/check-build-base.sh compat
      # cargo-llvm-cov and llvm-tools-preview are not in the image yet (the
      # Dockerfile change re-pins the image; proposed in the E4 PR). Pinned
      # version; the action verifies the release binary's checksum.
      - name: rustup component add llvm-tools-preview
        run: |
          rustup component add llvm-tools-preview
          rustc -vV
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: adapter-tests
      - name: cargo test --locked under cargo-llvm-cov
        run: bash scripts/serve/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-coverage
          path: |
            coverage/lcov.info
            coverage/html/
            coverage/summary.json
            coverage/summary.md
          if-no-files-found: warn
          retention-days: 14
