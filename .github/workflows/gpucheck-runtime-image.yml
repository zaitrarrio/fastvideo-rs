# Builds the GPU validation runtime image (fv-gpucheck + CUDA runtime libraries)
# and pushes it to GHCR, so rented GPU boxes pull a small prebuilt image instead
# of a ~9GB PyTorch image plus an upload. See scripts/gpu/README.md.
#
# Packages (never shared):
#   main  → ghcr.io/<owner>/fastvideo-rs-runtime
#   else  → ghcr.io/<owner>/fastvideo-rs-runtime-<sanitized-ref>
# Each run pushes :build-<id>, :sha-<short>, and :latest on THAT package only.
# Non-main refs never push any tag to fastvideo-rs-runtime.
name: gpucheck-runtime-image

on:
  workflow_dispatch:
  push:
    # All branches, including names with slashes (e.g. cursor/…). Tags do not
    # match `branches`, so a tag push does not publish an image.
    branches: ["**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/gpucheck.Dockerfile"
      - ".dockerignore"
      - "scripts/gpu/**"
      - ".github/workflows/gpucheck-runtime-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: gpucheck-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build id and image name
        id: meta
        run: |
          # Same hash / package name scripts/gpu/validate.sh uses.
          image="$(bash scripts/gpu/docker.sh runtime-image-repo "$GITHUB_REF_NAME")"
          build_id="$(bash scripts/gpu/docker.sh build-id)"
          short_sha="${GITHUB_SHA::7}"
          main_pkg="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-runtime"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            [[ "$image" == "$main_pkg" ]] || {
              echo "main must publish to $main_pkg, got $image" >&2
              exit 1
            }
          else
            [[ "$image" != "$main_pkg" ]] || {
              echo "refusing to push to main's package from $GITHUB_REF ($image)" >&2
              exit 1
            }
          fi
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:build-${build_id}"
            echo "${image}:sha-${short_sha}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=GPU runtime package::$image"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpucheck.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_ID=${{ steps.meta.outputs.build_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.fastvideo.build-id=${{ steps.meta.outputs.build_id }}
          cache-from: type=gha,scope=gpucheck-runtime
          cache-to: type=gha,mode=max,scope=gpucheck-runtime

      - name: Smoke-check the pushed image (no GPU)
        run: |
          img="${{ steps.meta.outputs.image }}:build-${{ steps.meta.outputs.build_id }}"
          docker pull "$img"
          docker run --rm "$img" bash -euo pipefail -c '
            test "$(cat target/release/fv-gpucheck.build-id)" = "${{ steps.meta.outputs.build_id }}"
            python3 -c "import ctypes; [ctypes.CDLL(l) for l in (\"libnvrtc.so.12\", \"libcublasLt.so.12\", \"libcublas.so.12\", \"libcudnn.so.9\")]"
            ./target/release/fv-gpucheck --out /tmp/out nvrtc'
          docker image inspect "$img" --format 'size={{.Size}}'
          echo "::notice title=GPU runtime image::$img"
