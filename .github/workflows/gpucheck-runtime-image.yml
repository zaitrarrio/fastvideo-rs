# Builds the GPU validation runtime image (fv-gpucheck + CUDA runtime libraries)
# and pushes it to GHCR, so rented GPU boxes pull a small prebuilt image instead
# of a ~9GB PyTorch image plus an upload. See scripts/gpu/README.md.
name: gpucheck-runtime-image

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/gpucheck.Dockerfile"
      - ".dockerignore"
      - "scripts/gpu/**"
      - ".github/workflows/gpucheck-runtime-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: gpucheck-runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build id and image name
        id: meta
        run: |
          # Same hash scripts/gpu/validate.sh uses to match a box's binary to local sources.
          echo "build_id=$(bash scripts/gpu/docker.sh build-id)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-runtime" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpucheck.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_ID=${{ steps.meta.outputs.build_id }}
          # Every branch publishes its build-id tag, which is what validate.sh
          # looks up, so a feature branch's boxes boot with the binary baked in
          # instead of uploading it. Only main moves :latest.
          tags: |
            ${{ steps.meta.outputs.image }}:build-${{ steps.meta.outputs.build_id }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.fastvideo.build-id=${{ steps.meta.outputs.build_id }}
          cache-from: type=gha,scope=gpucheck-runtime
          cache-to: type=gha,mode=max,scope=gpucheck-runtime

      - name: Smoke-check the pushed image (no GPU)
        run: |
          img="${{ steps.meta.outputs.image }}:build-${{ steps.meta.outputs.build_id }}"
          docker pull "$img"
          docker run --rm "$img" bash -euo pipefail -c '
            test "$(cat target/release/fv-gpucheck.build-id)" = "${{ steps.meta.outputs.build_id }}"
            for lib in libnvrtc.so.13 libcublasLt.so.13 libcublas.so.13 libcudnn.so.9; do
              ldconfig -p | grep -F "$lib" >/dev/null
            done
            ./target/release/fv-gpucheck --out /tmp/out nvrtc
            grep -q aot_sms /tmp/out/nvrtc.json && echo "embedded cubins present"'
          docker image inspect "$img" --format 'size={{.Size}}'
          echo "::notice title=GPU runtime image::$img"
          # The binary alone, for a box (or a laptop) that wants it without the image.
          mkdir -p dist && cid=$(docker create "$img") \
            && docker cp "$cid:/opt/fastvideo-rs/target/release/fv-gpucheck" dist/ \
            && docker cp "$cid:/opt/fastvideo-rs/target/release/fv-gpucheck.build-id" dist/ \
            && docker rm "$cid" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: fv-gpucheck-${{ steps.meta.outputs.build_id }}
          path: dist/
