# Builds the optional Vast pytorch image (FROM vastai/pytorch) for tiers that
# need Python+torch. Default rentals still use the slim gpucheck-runtime image.
# The oracle flavor (transformers/diffusers) is not published; build it locally
# with `scripts/gpu/docker.sh vast-oracle` if a parity tier needs it.
# See scripts/gpu/README.md and docker/vast-pytorch.Dockerfile.
#
# Binaries (owner decision 2026-10-06): always the NEWEST tools release
# (highest SemVer `tools-v*`, docs/dev/tools-releases.md): fv-gpucheck as
# this Dockerfile builds it (set gpucheck-vast) and hf-fm, sha256-checked,
# or the version pinned by the dispatch input / repository variable
# FV_TOOLS_VERSION. Nothing compiles here: without a release the job fails.
# Runs on a Dockerfile change, by hand, and for every new tools release:
# `tools-release.sh publish --dispatch` dispatches it (releases created with a
# GITHUB_TOKEN fire no `release` event for other workflows), and the
# `release` trigger covers releases published with a PAT or from a runner.
# Tags: :build-<release build id>, :tools-v<X.Y.Z>, :sha-<commit>, and
# :latest from main or a release.
name: vast-pytorch-image

on:
  workflow_dispatch:
    inputs:
      tools_version:
        description: "tools release to use (e.g. 0.1.3); empty: the newest (or vars.FV_TOOLS_VERSION)"
        required: false
        default: ""
  release:
    types: [published]
  push:
    branches: ["**"]
    # Only when the image's own Dockerfile changes: the slowest image (10-30 min)
    # used to rebuild on every crates/ change although nothing on Runpod uses it.
    # Its fv-gpucheck can go stale between Dockerfile changes; rebuild on demand
    # with workflow_dispatch when a Vast/oracle tier needs current binaries.
    paths:
      - "docker/vast-pytorch.Dockerfile"

permissions:
  contents: read
  packages: write

# Release-triggered runs share main's group (both move :latest).
concurrency:
  group: vast-pytorch-image-${{ github.event_name == 'release' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Only tools releases (tags tools-v*), never other releases.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'tools-v')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: vast
            flavor: pytorch
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # fv-gpucheck as this Dockerfile builds it (no nvcc there: NVRTC at run
      # time) and hf-fm from the newest tools release, or the pinned one;
      # no release: the job fails (never an in-image compile).
      - name: Tools release (newest, sha256-checked)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          FV_TOOLS_VERSION: ${{ github.event.inputs.tools_version || vars.FV_TOOLS_VERSION }}
          FV_PREBUILT_SELECT: newest
          FV_PREBUILT_REQUIRE: "1"
        run: bash scripts/ci/prebuilt.sh fetch gpucheck-vast hf-fm

      # The binary's build id is the release's (it names the binary inside,
      # which validate.sh matches against sources).
      - name: Binary build id
        id: bin
        run: echo "build_id=${{ steps.pre.outputs.build_id }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vast-pytorch.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-contexts: ${{ steps.pre.outputs.contexts }}
          build-args: |
            BUILD_ID=${{ steps.bin.outputs.build_id }}
            VAST_PYTORCH_IMAGE=vastai/pytorch:cuda-13.0.3-auto
          tags: |
            ${{ steps.meta.outputs.image }}:build-${{ steps.bin.outputs.build_id }}
            ${{ steps.meta.outputs.image }}:${{ steps.pre.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.fastvideo.build-id=${{ steps.bin.outputs.build_id }}
            dev.fastvideo.tools=${{ steps.pre.outputs.tag }}
            dev.fastvideo.tools-commit=${{ steps.pre.outputs.source_commit }}
            dev.fastvideo.flavor=${{ matrix.flavor }}
          cache-from: type=gha,scope=vast-pytorch-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=vast-pytorch-${{ matrix.target }}

      - name: Smoke-check (no GPU)
        run: |
          img="${{ steps.meta.outputs.image }}:build-${{ steps.bin.outputs.build_id }}"
          docker pull "$img"
          docker run --rm --entrypoint bash "$img" -euo pipefail -c '
            test "$(cat /opt/fastvideo-rs/target/release/fv-gpucheck.build-id)" = "${{ steps.bin.outputs.build_id }}"
            test -x /opt/fastvideo-rs/target/release/fv-gpucheck
            /opt/fastvideo-rs/target/release/fv-gpucheck -V || true   # tools releases from 0.1.1 report the version
            test -x /venv/main/bin/python
            /venv/main/bin/python -c "import torch; print(torch.__version__)"
            ldconfig -p | grep -E "libnvrtc|libcublas|libcudnn" >/dev/null
          '
          docker image inspect "$img" --format 'size={{.Size}}'
          echo "::notice title=Vast ${{ matrix.flavor }} image::$img (tools ${{ steps.pre.outputs.tag }})"
