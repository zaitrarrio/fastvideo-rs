# Builds the optional Vast pytorch image (FROM vastai/pytorch) for tiers that
# need Python+torch. Default rentals still use the slim gpucheck-runtime image.
# The oracle flavor (transformers/diffusers) is not published; build it locally
# with `scripts/gpu/docker.sh vast-oracle` if a parity tier needs it.
# See scripts/gpu/README.md and docker/vast-pytorch.Dockerfile.
name: vast-pytorch-image

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/vast-pytorch.Dockerfile"
      - "docker/gpucheck.Dockerfile"
      - ".dockerignore"
      - "scripts/gpu/**"
      - ".github/workflows/vast-pytorch-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: vast-pytorch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: vast
            flavor: pytorch
    steps:
      - uses: actions/checkout@v4

      - name: Build id and image name
        id: meta
        run: |
          echo "build_id=$(bash scripts/gpu/docker.sh build-id)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vast-pytorch.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_ID=${{ steps.meta.outputs.build_id }}
            VAST_PYTORCH_IMAGE=vastai/pytorch:cuda-13.0.3-auto
          tags: |
            ${{ steps.meta.outputs.image }}:build-${{ steps.meta.outputs.build_id }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.fastvideo.build-id=${{ steps.meta.outputs.build_id }}
            dev.fastvideo.flavor=${{ matrix.flavor }}
          cache-from: type=gha,scope=vast-pytorch-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=vast-pytorch-${{ matrix.target }}

      - name: Smoke-check (no GPU)
        run: |
          img="${{ steps.meta.outputs.image }}:build-${{ steps.meta.outputs.build_id }}"
          docker pull "$img"
          docker run --rm --entrypoint bash "$img" -euo pipefail -c '
            test "$(cat /opt/fastvideo-rs/target/release/fv-gpucheck.build-id)" = "${{ steps.meta.outputs.build_id }}"
            test -x /opt/fastvideo-rs/target/release/fv-gpucheck
            test -x /venv/main/bin/python
            /venv/main/bin/python -c "import torch; print(torch.__version__)"
            ldconfig -p | grep -E "libnvrtc|libcublas|libcudnn" >/dev/null
          '
          docker image inspect "$img" --format 'size={{.Size}}'
          echo "::notice title=Vast ${{ matrix.flavor }} image::$img"
