# Free preflight for scripts/gpu/README.md: the cudarc crates build, and every
# kernel compiles for every SM via nvcc (ahead of time) and NVRTC (run-time path).
name: gpucheck-t0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/fastvideo-cudarc/**"
      - "crates/fastvideo-gpucheck/**"
      - "scripts/gpu/**"
      - "scripts/gpu/cuda-13.pins"
      - "scripts/ci/prebuilt.sh"
      - "scripts/ci/tools-release.sh"
      - "scripts/ci/check-build-base.sh"
      - "docker/build-base.Dockerfile"
      - ".github/workflows/gpucheck-t0.yml"

concurrency:
  group: gpucheck-t0-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The unit-test binaries (cargo test --no-run) and the release
      # `--features cuda` fv-gpucheck (which covers the CUDA type-check), from
      # the tools release built from exactly this checkout's tools inputs
      # (docs/dev/tools-releases.md); a pull request that changes them has
      # none, so cargo runs here.
      - name: Prebuilt test binaries (tools release)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          FV_PREBUILT_DISABLE: ${{ vars.FV_PREBUILT_DISABLE || '0' }}
        run: bash scripts/ci/prebuilt.sh fetch gpucheck-tests gpucheck
      - name: Unit tests (prebuilt binaries)
        if: steps.pre.outputs.ok == 'true'
        run: bash scripts/ci/prebuilt.sh run-tests "${{ steps.pre.outputs.dir }}/gpucheck-tests"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.pre.outputs.ok != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.pre.outputs.ok != 'true'
      - name: Unit tests
        if: steps.pre.outputs.ok != 'true'
        run: cargo test -p fastvideo-gpucheck -p fastvideo-cudarc --lib --bins
      - name: CUDA feature type-check
        if: steps.pre.outputs.ok != 'true'
        env:
          CUDARC_CUDA_VERSION: "13000"
        run: cargo check -p fastvideo-gpucheck --features cuda

  nvrtc-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The build base image has CUDA 13.4 nvcc / NVRTC / tileiras
    # (scripts/gpu/cuda-13.pins) and the Rust toolchain: nothing is installed
    # here. No GPU and no driver: NVRTC compiles every kernel without one.
    # Tag pinned by scripts/dev/build-base-tag.sh (same as build-pod.sh).
    container:
      image: ghcr.io/zaitrarrio/fastvideo-rs-build-base:bb-d872f7724765429b
    env:
      CUDARC_CUDA_VERSION: "13000"
      LD_LIBRARY_PATH: /usr/local/cuda-13.4/lib64
      NVCC: /usr/local/cuda-13.4/bin/nvcc
      # The image routes rustc through sccache for the build pod; not here.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Image has CUDA 13.4 and the release fetch tools (no installs at run time)
        run: bash scripts/ci/check-build-base.sh cuda prebuilt
      - name: Prebuilt fv-gpucheck (tools release)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          FV_PREBUILT_DISABLE: ${{ vars.FV_PREBUILT_DISABLE || '0' }}
        run: bash scripts/ci/prebuilt.sh fetch gpucheck
      # The image's Rust (RUSTUP_TOOLCHAIN), no toolchain action.
      - uses: Swatinem/rust-cache@v2
        if: steps.pre.outputs.ok != 'true'
      # NVRTC (from the image) compiles every kernel at run time; the
      # prebuilt binary's AOT cubins come from the pod's nvcc.
      - name: Run both compile gates on the prebuilt binary
        if: steps.pre.outputs.ok == 'true'
        run: |
          install -m 755 "${{ steps.pre.outputs.dir }}/gpucheck/fv-gpucheck" fv-gpucheck
          ./fv-gpucheck --out gpucheck-out nvrtc
          grep -q aot_sms gpucheck-out/nvrtc.json || { echo "no embedded cubins in the prebuilt binary"; exit 1; }
      - name: Build with ahead-of-time cubins, then run both compile gates
        if: steps.pre.outputs.ok != 'true'
        run: |
          cargo build --release -p fastvideo-gpucheck --features cuda 2>&1 | tee build.log
          grep -q "embedded cubins for sm" build.log || { echo "build.rs did not find nvcc"; exit 1; }
          ./target/release/fv-gpucheck --out gpucheck-out nvrtc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpucheck-t0-nvrtc
          path: gpucheck-out/
