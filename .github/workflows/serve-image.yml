# Builds the fv-serve images (docker/gpucheck.Dockerfile, docs/serve/images.md)
# and pushes them to ghcr.io/<owner>/fastvideo-rs-serve:
#   :latest / :sha-<sha>                 the legacy all-in-one `serve` target (the
#                                        debug flavour: ssh, rsync, fv-gpucheck, scripts)
#   :<variant> / :<variant>-sha-<sha>    one slim image per pod variant
#                                        (h3-turbo h3-max ltx wan wan5b sfwan cpu)
# then, on main, records the build as the `latest` release in D1 (with a
# Cloudflare token secret) and, only when the repository variable
# FV_TEMPLATE_CHANNEL is `latest`, points the Runpod templates
# fv-serve-<variant>-{sls,pod} at the new digests. By default the templates
# follow `stable`, which moves only by .github/workflows/release.yml
# (docs/serve/releases.md). Deploy tooling pins digests.
name: serve-image

on:
  workflow_dispatch:
    inputs:
      features:
        description: "fv-serve cargo features"
        required: false
        default: "cuda,http-client"
      variants:
        description: "variant images to build (space list)"
        required: false
        default: "h3-turbo h3-max ltx wan wan5b sfwan cpu"
      compression:
        description: "variant layer compression: gzip or zstd (zstd tags get a -zstd- infix)"
        required: false
        default: "gzip"
      debug:
        description: "also build the legacy all-in-one (debug) image"
        required: false
        default: "true"
  # main only: agents push the same commits to their branches too, and a
  # second build of the same sha is wasted. Other branches: workflow_dispatch.
  push:
    branches: ["main"]
    paths:
      - "crates/**"
      - "configs/serve/**"
      - "deploy/**"
      - "third_party/**"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docker/gpucheck.Dockerfile"
      - "scripts/ci/base-images.sh"
      - ".dockerignore"
      - "scripts/gpu/**"
      - "scripts/serve/ci-images.sh"
      - "scripts/serve/runpod-templates.sh"
      - "scripts/serve/variants.sh"
      - "scripts/serve/release.sh"
      - "scripts/serve/lib/**"
      - "scripts/ci/prebuilt.sh"
      - "scripts/ci/tools-release.sh"
      - ".github/workflows/serve-image.yml"

permissions:
  contents: read
  packages: write

# main moves every few minutes; cancelling would never let a ~45 min build
# finish. One build runs, the newest push waits.
concurrency:
  group: serve-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Image name and tags
        id: meta
        run: |
          echo "build_id=$(bash scripts/gpu/docker.sh build-id)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-serve" >> "$GITHUB_OUTPUT"
          echo "runtime=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-runtime" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "features=${{ github.event.inputs.features || 'cuda,http-client' }}" >> "$GITHUB_OUTPUT"

      # Every Rust binary these images carry (fv-serve CUDA + cpu,
      # fv-gpucheck, the oxide cubins, hf-fm) from a tools release (built and
      # tested on the build pod, docs/dev/tools-releases.md), sha256-checked.
      # Without one every image compiles as before, with a warning.
      - name: Prebuilt tools (GitHub release)
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          # A rollback pin (e.g. 0.1.3); empty: this commit's release, else the newest.
          FV_TOOLS_VERSION: ${{ vars.FV_TOOLS_VERSION }}
          FV_PREBUILT_DISABLE: ${{ vars.FV_PREBUILT_DISABLE || '0' }}
          # main: the newest release when this commit's tools have none yet
          # (labelled); branches build their own code (compile fallback).
          FV_PREBUILT_STALE: ${{ github.ref == 'refs/heads/main' && 'latest' || 'compile' }}
          FV_PREBUILT_FEATURES: serve-cuda=${{ steps.meta.outputs.features }} serve-cpu=http-client
        run: bash scripts/ci/prebuilt.sh fetch oxide gpucheck hf-fm serve-cuda serve-cpu

      - name: Free disk space
        if: steps.pre.outputs.ok != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          docker image prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The shared lower layers (Ubuntu + ffmpeg, + CUDA libraries) as
      # published images, one per content hash, built here only when missing.
      # Passing them as named contexts puts this image on the same layer
      # digests as fastvideo-rs-runtime and every serve variant (docs/serve/images.md "Layers").
      - name: Shared base images
        id: base
        env:
          FV_BASE_DISABLE: ${{ vars.FV_BASE_DISABLE || '0' }}
        run: bash scripts/ci/base-images.sh ensure

      - name: Build and push (debug / legacy all-in-one)
        id: push
        if: github.event.inputs.debug != 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpucheck.Dockerfile
          target: serve
          platforms: linux/amd64
          push: true
          # Prebuilt: replace oxide, binary, hf-fm and serve-build (no compile).
          build-contexts: |
            ${{ steps.pre.outputs.contexts }}
            ${{ steps.base.outputs.contexts }}
          build-args: |
            BUILD_ID=${{ steps.meta.outputs.build_id }}
            FV_SERVE_FEATURES=${{ steps.meta.outputs.features }}
            FV_GIT_SHA=${{ github.sha }}
            FV_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.fastvideo.build-id=${{ steps.meta.outputs.build_id }}
            dev.fastvideo.tools=${{ steps.pre.outputs.tag || 'compiled' }}
          # The runtime image's registry cache covers builder/oxide/build and
          # runtime; the serve cache adds serve-build.
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.runtime }}:buildcache
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Smoke-check the pushed image (no GPU)
        if: github.event.inputs.debug != 'false'
        run: |
          img="${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          docker pull "$img"
          docker image inspect "$img" --format 'size={{.Size}} entrypoint={{json .Config.Entrypoint}}'
          docker run --rm "$img" --version
          docker run --rm --entrypoint bash "$img" -euo pipefail -c '
            test "$NVIDIA_DRIVER_CAPABILITIES" = compute,utility,video
            ffmpeg -hide_banner -encoders | grep " h264_nvenc "
            cat /opt/fastvideo-rs/bin/fv-serve.features
            test -f /opt/fastvideo-rs/deploy/vast/worker.py
            for c in /etc/fv/*.toml; do FV_ENGINE=fake /opt/fastvideo-rs/bin/fv-serve --config "$c" --print-config >/dev/null; echo "config ok: $c"; done'
          # HTTP mode on the fake engine: /healthz turns 200.
          cid=$(docker run -d -p 18000:8000 -e FV_ENGINE=fake -e FV_AUTH_MODE=none "$img" --config /etc/fv/runpod-fake.toml)
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS localhost:18000/healthz; then ok=1; break; fi
            sleep 1
          done
          curl -fsS localhost:18000/fv/v1/capabilities | head -c 400; echo
          docker logs "$cid" 2>&1 | tail -20
          docker rm -f "$cid" >/dev/null
          test "$ok" = 1

      - name: Digest
        if: github.event.inputs.debug != 'false'
        run: |
          ref="${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          echo "::notice title=fv-serve image::$ref"
          echo "fv-serve image (debug): \`$ref\` (tag sha-${{ steps.meta.outputs.short_sha }}, $(bash scripts/serve/ci-images.sh size "$ref") MB/layers compressed)" >> "$GITHUB_STEP_SUMMARY"
          docker image rm "$ref" >/dev/null 2>&1 || true

      # One slim image per variant, sharing the base, CUDA and binary layers.
      - name: Build and push the variant images
        env:
          FV_IMAGE: ${{ steps.meta.outputs.image }}
          FV_SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          FV_BUILD_ID: ${{ steps.meta.outputs.build_id }}
          FV_BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          FV_SERVE_FEATURES: ${{ steps.meta.outputs.features }}
          FV_LATEST: ${{ github.ref == 'refs/heads/main' && (github.event.inputs.compression || 'gzip') == 'gzip' && '1' || '0' }}
          FV_COMPRESSION: ${{ github.event.inputs.compression || 'gzip' }}
          FV_CACHE_FROM: ${{ steps.meta.outputs.runtime }}:buildcache ${{ steps.meta.outputs.image }}:buildcache
          FV_BUILD_CONTEXTS: |
            ${{ steps.pre.outputs.contexts }}
            ${{ steps.base.outputs.contexts }}
          FV_TOOLS_TAG: ${{ steps.pre.outputs.tag }}
        run: bash scripts/serve/ci-images.sh build ${{ github.event.inputs.variants || 'h3-turbo h3-max ltx wan wan5b sfwan cpu' }}

      - name: Smoke-check the variant images (no GPU)
        run: |
          while IFS=$'\t' read -r v ref mb; do
            echo "::group::$v ($mb MB)"
            bash scripts/serve/ci-images.sh smoke "$v" "$ref"
            echo "::endgroup::"
          done < artifacts/ci/variants.tsv
          { echo "### Variant images"; bash scripts/serve/ci-images.sh summary; } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r v ref mb; do echo "::notice title=fv-serve $v::$ref ($mb MB)"; done < artifacts/ci/variants.tsv

      # Publish to Runpod: the per-variant templates boot the new digests, when
      # they follow `latest` (vars.FV_TEMPLATE_CHANNEL); by default they follow
      # `stable` and move with release.yml.
      - name: Register the Runpod templates
        id: templates
        if: github.ref == 'refs/heads/main' && (github.event.inputs.compression || 'gzip') == 'gzip' && vars.FV_TEMPLATE_CHANNEL == 'latest'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_REGISTRY_AUTH_ID }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::warning title=Runpod templates::RUNPOD_API_KEY secret not set; templates not updated (docs/serve/images.md)"
            exit 0
          fi
          FV_RELEASE_CHANNEL=latest bash scripts/serve/runpod-templates.sh sync-all artifacts/ci/variants.tsv
          echo "synced=1" >> "$GITHUB_OUTPUT"
          { echo "### Runpod templates"; echo '```'; bash scripts/serve/runpod-templates.sh list; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The release history (D1): this build is now `latest`.
      - name: Record the latest release
        if: github.ref == 'refs/heads/main' && (github.event.inputs.compression || 'gzip') == 'gzip'
        env:
          FV_SERVE_REPO: ${{ steps.meta.outputs.image }}
          FV_CF_API_TOKEN: ${{ secrets.FV_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          FV_CF_ACCOUNT_ID: ${{ secrets.FV_CF_ACCOUNT_ID }}
          FV_D1_DATABASE_ID: ${{ secrets.FV_D1_DATABASE_ID }}
          FV_DEPLOYED_BY: ci:serve-image#${{ github.run_id }}
          DEBUG_REF: ${{ steps.push.outputs.digest && format('{0}@{1}', steps.meta.outputs.image, steps.push.outputs.digest) || '' }}
          SYNCED: ${{ steps.templates.outputs.synced }}
        run: |
          if [ -z "$FV_CF_API_TOKEN" ]; then
            echo "::warning title=Release history::no Cloudflare token secret (FV_CF_API_TOKEN); the build is not recorded (docs/serve/releases.md)"
            exit 0
          fi
          bash scripts/serve/release.sh record-build latest "$GITHUB_SHA" artifacts/ci/variants.tsv $DEBUG_REF ${SYNCED:+--templates-updated} \
            || echo "::warning title=Release history::could not record the build in D1"
