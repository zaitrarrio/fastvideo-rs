# The no-GPU checks serve-image.yml runs only on main, brought forward to pull requests where
# they do not need an image: fv-boot started exactly as the serve-image smoke starts the image
# without a config (no arguments, the image's environment, FV_FAIL_SLEEP_S=0) must refuse and
# exit at once (crates/fastvideo-deploy/tests/fv_boot_bin.rs); ci-images.sh `smoke` must fail,
# not hang, when an image does not refuse (scripts/serve/tests/ci-images.test.sh); and the
# image build must never take fv-boot from a tools release older than the commit
# (scripts/ci/test_tools_release.sh, prebuilt.sh contexts --stale). serve-image run 286 hung
# for hours on main because none of this ran before the merge.
#
# Building and smoking the serve images themselves stays on main (serve-image.yml): it needs
# the CUDA / cpu fv-serve compiled or a tools release built from the PR's own inputs, and
# GHCR pushes, ~45 min of runner time per PR.
name: serve-boot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/fastvideo-deploy/**"
      - "docker/gpucheck.Dockerfile"
      - "scripts/serve/ci-images.sh"
      - "scripts/serve/tests/ci-images.test.sh"
      - "scripts/ci/prebuilt.sh"
      - "scripts/ci/tools-release.sh"
      - "scripts/ci/test_tools_release.sh"
      - ".github/workflows/serve-image.yml"
      - ".github/workflows/serve-boot.yml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: serve-boot-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  scripts:
    name: ci-images.sh smoke is bounded; prebuilt fv-boot only from an exact release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ci-images.sh smoke fails (not hangs) on an image that does not refuse
        run: bash scripts/serve/tests/ci-images.test.sh
      - name: tools-release / prebuilt.sh selection rules (offline)
        run: bash scripts/ci/test_tools_release.sh

  refusal:
    name: fv-boot refuses a boot without a config at once
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The build base image (pinned by scripts/dev/build-base-tag.sh, as serve-compat's fmt
    # job): the toolchain the build pod runs.
    container:
      image: ghcr.io/zaitrarrio/fastvideo-rs-build-base:bb-d124c1066ca42695
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: serve-boot
      - name: fv-boot binary, the image smoke's refusal invocation
        run: timeout 1500 cargo test --locked -p fastvideo-deploy --features boot --test fv_boot_bin
