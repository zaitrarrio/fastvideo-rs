# fv-control and the family-manifest generation (plan A4, C1): everything
# control/gen-configs.mjs derives from families/*.toml, deploy/deploy.toml,
# configs/serve, the weights TSVs and the shell tables must be current
# (`--check`), the cross-checks between the manifests and their hand-written
# copies must agree, and fv-control's typecheck and unit tests must pass. No Rust, no GPU: node
# only (control/package-lock.json pins the tools). The shell lint runs here
# too, since the generator writes scripts/gpu/verify-weights.sh. The engine
# and model crates are inputs as well: test/unit/preset-trees.test.ts and
# templates.test.ts check the tables' claims against their sources, and
# fv-deploy's committed JSON Schemas (crates/fastvideo-deploy/schemas) are the
# source of control/src/launch-gen.ts (plan C3c, ADR-0018 §7).
name: control

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "families/**"
      - "deploy/deploy.toml"
      - "control/**"
      - "configs/serve/**"
      - "configs/autoscale.toml"
      - "scripts/gcp/families.tsv"
      - "scripts/gpu/volumes.sh"
      - "scripts/gpu/verify-weights.sh"
      - "scripts/gpu/verify-safetensors.sh"
      - "scripts/gpu/tests/verify-weights.test.sh"
      - "scripts/gpu/weights-*.tsv"
      - "scripts/gpu/r2-fetch.py"
      - "crates/fastvideo-deploy/fixtures/**"
      - "crates/fastvideo-deploy/schemas/**"
      - "scripts/serve/runpod-pod.sh"
      - "scripts/serve/runpod-endpoint.sh"
      - "scripts/serve/tests/fv-deploy-goldens.sh"
      # C3d (ADR-0018 §10): the release goldens run these against the mock.
      - "scripts/serve/tests/fv-deploy-release-goldens.sh"
      - "scripts/serve/tests/mock_api.py"
      - "scripts/serve/runpod-templates.sh"
      - "scripts/serve/release.sh"
      - "scripts/serve/lib/d1.sh"
      - "scripts/serve/lib/ghcr.sh"
      - "deploy/d1/registry.sql"
      - "scripts/serve/vast.sh"
      - "scripts/gcp/vm.sh"
      - "scripts/gcp/lib.sh"
      - "scripts/gcp/tests/**"
      - "scripts/gpu/runpod-matrix.sh"
      - "scripts/gpu/runpod-http.sh"
      - "scripts/gpu/tests/fv-lab-goldens.sh"
      - "scripts/gpu/fv-lab-compare-runs.sh"
      # its control arms come from the cells' `[repeats] controls` (ADR-0019 §15.7)
      - "lab/cells/**"
      - "scripts/gpu/fv-lab-retired.sh"
      - "scripts/gpu/tests/fv-lab-route.test.sh"
      # runpod.sh gpu / matrix: a retired family runs fv-lab on the pod (ADR-0019 §17.6)
      - "scripts/gpu/tests/runpod-plan.test.sh"
      - "scripts/gpu/tests/fv-lab-report-goldens.sh"
      # D1e (ADR-0019 §14): the experiment tiers' goldens, cut from the experiments' pod scripts (read from the history since §14.4)
      - "scripts/gpu/tests/fv-lab-experiment-goldens.sh"
      - "scripts/gpu/prompts-hd5.json"
      - "scripts/gpu/prompts-h3-graphs-*.json"
      - "scripts/gpu/hd_report.py"
      - "scripts/gpu/timings.sh"
      # the report goldens' inputs (fixtures/report is under crates/fastvideo-lab/fixtures/**)
      - "artifacts/runpod/**"
      - "artifacts/perf/**"
      - "artifacts/ports/**"
      - "scripts/gpu/runpod.sh"
      - "scripts/gpu/fv-boot-smoke-pod.sh"
      - "scripts/serve/e2e/segments-pod.sh"
      - "scripts/serve/tests/no-baked-config.test.sh"
      - "lab/tiers.toml"
      - "crates/fastvideo-lab/fixtures/**"
      - "scripts/gpu/runpod-cuda.sh"
      - "scripts/gpu/lib.sh"
      - "scripts/gpu/runpod-price.sh"
      - "scripts/serve/lib/registry.sh"
      - "scripts/serve/variants.sh"
      - "docker/gpucheck.Dockerfile"
      - ".github/workflows/serve-image.yml"
      - "docs/serve/images.md"
      - "crates/fastvideo-serve/console/**"
      - "crates/fastvideo-engine-service/**"
      - "crates/fastvideo-models/**"
      - "crates/fastvideo-cudarc/src/llm/prequant.rs"
      - "crates/fastvideo-cudarc/src/h3/dit_tree.rs"
      - "crates/fastvideo-cudarc/src/rt/quant.rs"
      - ".github/workflows/control.yml"
  push:
    branches: ["main"]
    paths:
      - "families/**"
      - "deploy/deploy.toml"
      - "control/**"
      - "configs/serve/**"
      - "configs/autoscale.toml"
      - "scripts/gcp/families.tsv"
      - "scripts/gpu/volumes.sh"
      - "scripts/gpu/verify-weights.sh"
      - "scripts/gpu/verify-safetensors.sh"
      - "scripts/gpu/tests/verify-weights.test.sh"
      - "scripts/gpu/weights-*.tsv"
      - "scripts/gpu/r2-fetch.py"
      - "crates/fastvideo-deploy/fixtures/**"
      - "crates/fastvideo-deploy/schemas/**"
      - "scripts/serve/runpod-pod.sh"
      - "scripts/serve/runpod-endpoint.sh"
      - "scripts/serve/tests/fv-deploy-goldens.sh"
      # C3d (ADR-0018 §10): the release goldens run these against the mock.
      - "scripts/serve/tests/fv-deploy-release-goldens.sh"
      - "scripts/serve/tests/mock_api.py"
      - "scripts/serve/runpod-templates.sh"
      - "scripts/serve/release.sh"
      - "scripts/serve/lib/d1.sh"
      - "scripts/serve/lib/ghcr.sh"
      - "deploy/d1/registry.sql"
      - "scripts/serve/vast.sh"
      - "scripts/gcp/vm.sh"
      - "scripts/gcp/lib.sh"
      - "scripts/gcp/tests/**"
      - "scripts/gpu/runpod-matrix.sh"
      - "scripts/gpu/runpod-http.sh"
      - "scripts/gpu/tests/fv-lab-goldens.sh"
      - "scripts/gpu/fv-lab-compare-runs.sh"
      # its control arms come from the cells' `[repeats] controls` (ADR-0019 §15.7)
      - "lab/cells/**"
      - "scripts/gpu/fv-lab-retired.sh"
      - "scripts/gpu/tests/fv-lab-route.test.sh"
      # runpod.sh gpu / matrix: a retired family runs fv-lab on the pod (ADR-0019 §17.6)
      - "scripts/gpu/tests/runpod-plan.test.sh"
      - "scripts/gpu/tests/fv-lab-report-goldens.sh"
      # D1e (ADR-0019 §14): the experiment tiers' goldens, cut from the experiments' pod scripts (read from the history since §14.4)
      - "scripts/gpu/tests/fv-lab-experiment-goldens.sh"
      - "scripts/gpu/prompts-hd5.json"
      - "scripts/gpu/prompts-h3-graphs-*.json"
      - "scripts/gpu/hd_report.py"
      - "scripts/gpu/timings.sh"
      # the report goldens' inputs (fixtures/report is under crates/fastvideo-lab/fixtures/**)
      - "artifacts/runpod/**"
      - "artifacts/perf/**"
      - "artifacts/ports/**"
      - "scripts/gpu/runpod.sh"
      - "scripts/gpu/fv-boot-smoke-pod.sh"
      - "scripts/serve/e2e/segments-pod.sh"
      - "scripts/serve/tests/no-baked-config.test.sh"
      - "lab/tiers.toml"
      - "crates/fastvideo-lab/fixtures/**"
      - "scripts/gpu/runpod-cuda.sh"
      - "scripts/gpu/lib.sh"
      - "scripts/gpu/runpod-price.sh"
      - "scripts/serve/lib/registry.sh"
      - "scripts/serve/variants.sh"
      - "docker/gpucheck.Dockerfile"
      - ".github/workflows/serve-image.yml"
      - "docs/serve/images.md"
      - "crates/fastvideo-serve/console/**"
      - "crates/fastvideo-engine-service/**"
      - "crates/fastvideo-models/**"
      - "crates/fastvideo-cudarc/src/llm/prequant.rs"
      - "crates/fastvideo-cudarc/src/h3/dit_tree.rs"
      - "crates/fastvideo-cudarc/src/rt/quant.rs"
      - ".github/workflows/control.yml"

permissions:
  contents: read

concurrency:
  group: control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen-check:
    name: gen-configs --check, typecheck, unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated files are current and the cross-checks agree
        run: node gen-configs.mjs --check
      - run: npm run typecheck
      - run: npx vitest run test/unit
      - name: Shell lint (verify-weights.sh carries a generated region)
        working-directory: .
        run: bash scripts/gpu/lint.sh
      - name: verify-weights.sh checks index shards, a published tree's shared shard at the copy the engine reads (docs/ops/r2-weights.md §15)
        working-directory: .
        run: bash scripts/gpu/tests/verify-weights.test.sh
      - name: fv-deploy goldens are what runpod-pod.sh / runpod-endpoint.sh / vast.sh / gcp/vm.sh / runpod-templates.sh / release.sh send (ADR-0018 §4, §8, §10)
        working-directory: .
        run: bash scripts/serve/tests/fv-deploy-goldens.sh --check
      - name: gcp/vm.sh creates, deletes and reaps against a local mock of Compute Engine (ADR-0018 §8.3)
        working-directory: .
        run: bash scripts/gcp/tests/vm.test.sh
      - name: fv-lab goldens are what runpod-matrix.sh / runpod-http.sh do for every lab/tiers.toml tier, frozen for the retired ones (ADR-0019 §9.3, §10)
        working-directory: .
        run: bash scripts/gpu/tests/fv-lab-goldens.sh --check
      - name: fv-lab report goldens are what the report scripts print on committed run directories (ADR-0019 §13.2)
        working-directory: .
        run: bash scripts/gpu/tests/fv-lab-report-goldens.sh --check
      - name: the experiment tiers run their one-off's own pod-script commands (ADR-0019 §14)
        working-directory: .
        run: bash scripts/gpu/tests/fv-lab-experiment-goldens.sh --check
      - name: runpod-http.sh routes the retired families to fv-lab, refusing what fv-lab would not honour and the families retired with no tier (ADR-0019 §10, §18)
        working-directory: .
        run: bash scripts/gpu/tests/fv-lab-route.test.sh
      - name: runpod.sh gpu / matrix run a retired family's tier with fv-lab, never runpod-matrix.sh, and stop before any pod on a family nothing runs (ADR-0019 §17.6, §18)
        working-directory: .
        run: bash scripts/gpu/tests/runpod-plan.test.sh
      - name: the pod scripts send a config the serve images can boot (one image, ADR-0011)
        working-directory: .
        run: bash scripts/serve/tests/no-baked-config.test.sh
