# Builds the upstream (Python) reference images for the Runpod comparison runs:
# ghcr.io/<owner>/fastvideo-rs-upstream-<target>:sha-<7> (+ :latest on main).
# See docker/upstream.Dockerfile and scripts/gpu/upstream/.
name: upstream-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/upstream*"
      - "scripts/gpu/upstream/**"
      - ".github/workflows/upstream-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: upstream-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [fastvideo, sol-h3, sol-h3-4step, sol-ltx25]
    steps:
      - name: Free disk (hosted runners ship ~14 GB free)
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/lib/jvm || true
          sudo docker system prune -af || true
          # Docker (and the buildx container's state) on the larger temp disk when present.
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 40 ]; then
            sudo systemctl stop docker
            sudo mkdir -p /mnt/docker
            echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt || true

      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastvideo-rs-upstream-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/upstream.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      - name: Report size
        run: |
          df -h / /mnt || true
          docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}" --raw \
            | jq '[.layers[].size] | add / 1e9 | "compressed GB: \(.)"' || true
          echo "::notice title=upstream ${{ matrix.target }}::${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"
