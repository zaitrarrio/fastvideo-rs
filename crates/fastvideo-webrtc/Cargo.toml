[package]
name = "fastvideo-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve WebRTC: str0m peer host (UDP mux, ICE-TCP), data channels, pre-encoded writers, WHIP client."

[dependencies]
fastvideo-protocol.workspace = true
fastvideo-media.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "net", "time", "rt", "io-util", "macros"] }
tracing.workspace = true
url.workspace = true

str0m = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["sync", "net", "time", "rt", "rt-multi-thread", "io-util", "macros"] }

[features]
default = []
# The str0m peer host (pure Rust, rust-crypto provider).
str0m = ["dep:str0m"]
# WHIP publisher client (HTTP via reqwest). The publisher itself also needs `str0m`.
whip = ["dep:reqwest"]
# Opus decoding of client microphone tracks in `ingest` (libopus).
opus = ["fastvideo-media/opus"]

[lints]
workspace = true
