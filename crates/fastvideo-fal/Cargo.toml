[package]
name = "fastvideo-fal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve adapter: fal queue/sync API, proxy mode, storage, webhooks, and the WMA director."

[dependencies]
fastvideo-protocol.workspace = true
fastvideo-serve-kit.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

fastvideo-media.workspace = true
fastvideo-webrtc.workspace = true
tokio = { workspace = true, features = ["sync", "time", "fs", "rt", "macros"] }
async-trait.workspace = true
futures.workspace = true
image.workspace = true
# Intra-only VP8 via libwebp (built from its vendored C source) for offers
# without H.264.
webp = { version = "0.3", default-features = false, optional = true }

[features]
default = []
# The WMA director runtime (design §5.6): str0m peers and Opus. Encoders:
# NVENC through ffmpeg (always built), OpenH264 with `openh264`, and
# intra-only VP8 (libwebp) for offers without H.264.
director = ["fastvideo-webrtc/str0m", "fastvideo-media/opus", "dep:webp"]
openh264 = ["fastvideo-media/openh264"]

[dev-dependencies]
fastvideo-engine-service.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util"] }

[lints]
workspace = true
