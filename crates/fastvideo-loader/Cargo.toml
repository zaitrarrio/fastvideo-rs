[package]
name = "fastvideo-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hugging Face Diffusers loaders and weight-name mapping."

[dependencies]
fastvideo-models.workspace = true
safetensors = { workspace = true }
thiserror = { workspace = true }
serde_json.workspace = true
memmap2.workspace = true
rayon.workspace = true

[features]
default = []

[lints.rust]
# `memmap2::Mmap::map` is `unsafe fn` (the file can in principle be mutated
# or truncated out from under the mapping) — the same narrow, well-precedented
# unsafe use every mmap-based safetensors loader in the ecosystem makes.
# Scoped to this crate only; the workspace default stays `forbid` elsewhere.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
