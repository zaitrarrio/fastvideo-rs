[package]
name = "fastvideo-serve-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve shared HTTP glue: ServeCtx, auth, job/artifact/upload stores, ingestion, callbacks, SSE."

[dependencies]
fastvideo-protocol.workspace = true
fastvideo-engine-service.workspace = true
fastvideo-media.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hmac.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "time", "net", "process", "io-util", "rt"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

reqwest = { workspace = true, optional = true }
# SQLite behind the D1 HTTP API mock (feature `d1-mock`; always in tests).
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
default = []
# Outbound HTTP: media fetch, MiniMax callbacks, fal webhooks, S3 uploads.
fetch = ["dep:reqwest"]
# `d1::mock::MockD1`: a SQLite-backed D1 HTTP API for other crates' tests.
d1-mock = ["dep:rusqlite"]

[lints]
workspace = true
