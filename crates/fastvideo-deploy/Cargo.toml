[package]
name = "fastvideo-deploy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve deploy: fv-deploy (the Provider trait, Launch schema, money guards and lifecycle), fv-boot (the serve containers' boot), Runpod queue worker, RUNPOD_*/VAST_* environment discovery, Vast forwarder assets."

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "net"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
url.workspace = true
# fv-deploy (docs/adr/0018-fv-deploy.md): a Launch is built from deploy/deploy.toml
# and families/*.toml; its types export a JSON Schema.
fastvideo-manifest = { workspace = true, features = ["fs"] }
schemars.workspace = true

reqwest = { workspace = true, optional = true }
# The fv-deploy binary's command line (feature `deploy`).
clap = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
default = []
# Runpod queue worker HTTP client (job-take, job-done, stream, ping, job-stop)
# over reqwest. Without it the worker runs on any `Transport` (the in-process
# simulator transport is always built).
runpod = ["dep:reqwest"]
# fv-boot (docs/adr/0014-fv-boot.md): the boot sequence's HTTP client
# (reports, aux files, cloudflared, the watchdog) over reqwest. The `boot`
# module itself always builds; only the binary needs this.
boot = ["runpod"]
# fv-deploy (docs/adr/0018-fv-deploy.md): the binary (its command line, the
# reqwest client of `boot`, SIGINT / SIGHUP handling). The library half
# (`provider`, `launch`, `guard`, `lifecycle`) always builds and is tested on
# the HTTP / clock / process seams without it.
deploy = ["boot", "dep:clap", "tokio/signal", "tokio/rt-multi-thread"]

[[bin]]
name = "fv-boot"
required-features = ["boot"]

[[bin]]
name = "fv-deploy"
required-features = ["deploy"]

[lints]
workspace = true
