[package]
name = "fastvideo-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve: one binary serving FastVideo, MiniMax, fal, LTX and Reactor APIs over the fastvideo-rs engines."

[lib]
path = "src/lib.rs"

[[bin]]
name = "fv-serve"
path = "src/main.rs"

# The edge on the host (src/edge_host.rs): local runs and the compat suites'
# edge mode (FV_COMPAT_EDGE=1).
[[bin]]
name = "fv-edge-local"
path = "src/bin/fv-edge-local.rs"
required-features = ["http-client"]

[dependencies]
fastvideo-protocol.workspace = true
fastvideo-trace.workspace = true
fastvideo-engine-service.workspace = true
fastvideo-media.workspace = true
fastvideo-webrtc.workspace = true
fastvideo-serve-kit.workspace = true
fastvideo-deploy.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
futures.workspace = true
sha2.workspace = true
base64.workspace = true
# The admin token sealed to an operator's X25519 key (src/admin_token.rs).
hmac.workspace = true
rand.workspace = true
x25519-dalek = "2"
aes = "0.8"
ctr = "0.9"
uuid.workspace = true
# Gateway (docs/serve/gateway.md) and worker input fetch; feature `http-client`.
reqwest = { workspace = true, optional = true }
# Push dispatch through a pool Durable Object (docs/serve/gateway-cloudflare.md):
# the shared protocol, and the worker's socket (feature `http-client`).
fastvideo-dispatch-proto.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }

# External-API adapters: mounted when their feature is on (src/adapters.rs).
fastvideo-openai-videos = { workspace = true, optional = true }
fastvideo-minimax = { workspace = true, optional = true }
fastvideo-ltxapi = { workspace = true, optional = true }
fastvideo-fal = { workspace = true, optional = true }
fastvideo-reactor = { workspace = true, optional = true }

[dev-dependencies]
fastvideo-serve-kit = { workspace = true, features = ["d1-mock"] }
# The native Durable Object stand-in in tests/edge_dispatch.rs.
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true, features = ["util"] }
# WHEP viewer in tests/streams_whip.rs.
reqwest.workspace = true
bytes.workspace = true
# Test images (PNG, EXIF-rotated JPEG) in tests/i2v_aspect.rs.
image.workspace = true
base64.workspace = true
# Unique per-test state directories (a shared path let parallel tests
# rename each other's temporary files).
tempfile = "3"

[features]
default = ["openai-videos", "minimax", "ltxapi", "fal", "reactor"]
# FakeBackend-only engine for CPU CI (FakeBackend is always compiled; the
# `[engine] backend` config selects it, and it is the default).
fake = []
# CudaBackend over fastvideo-cudarc (the only path to CUDA).
cuda = ["fastvideo-engine-service/cuda"]
# str0m peer host for Reactor and the fal director (the director also needs `fal`).
webrtc = ["fastvideo-webrtc/str0m", "fastvideo-webrtc/opus", "fastvideo-media/opus", "fastvideo-fal?/director"]
# In-process OpenH264 and Opus encoders.
encoders = ["fastvideo-media/openh264", "fastvideo-media/opus", "fastvideo-fal?/openh264"]
# Outbound HTTP: ingestion fetch, callbacks, webhooks, S3/R2 uploads, the
# Cloudflare D1 job store, WHIP, Runpod worker.
http-client = ["dep:reqwest", "dep:tokio-tungstenite", "axum/ws", "fastvideo-serve-kit/fetch", "fastvideo-webrtc/whip", "fastvideo-deploy/runpod"]
# Adapter mount points (design §9, src/adapters.rs); on by default once the
# adapter is on main. `reactor` brings the str0m host (it answers offers).
openai-videos = ["dep:fastvideo-openai-videos"]
minimax = ["dep:fastvideo-minimax"]
ltxapi = ["dep:fastvideo-ltxapi"]
fal = ["dep:fastvideo-fal"]
reactor = ["dep:fastvideo-reactor", "webrtc"]
# Seam, not implemented: a tracing-opentelemetry layer in main.rs's
# init_tracing (docs/control/README.md "Observability"). Off by default.
otel = []
# Everything except CUDA (and adapters not merged yet).
full = ["webrtc", "encoders", "http-client", "openai-videos", "minimax", "ltxapi", "fal", "reactor"]

[lints]
workspace = true
