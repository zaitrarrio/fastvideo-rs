[package]
name = "fastvideo-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fv-serve: one binary serving FastVideo, MiniMax, fal, LTX and Reactor APIs over the fastvideo-rs engines."

[[bin]]
name = "fv-serve"
path = "src/main.rs"

[dependencies]
fastvideo-protocol.workspace = true
fastvideo-engine-service.workspace = true
fastvideo-media.workspace = true
fastvideo-webrtc.workspace = true
fastvideo-serve-kit.workspace = true
fastvideo-openai-videos.workspace = true
fastvideo-minimax.workspace = true
fastvideo-ltxapi.workspace = true
fastvideo-fal.workspace = true
fastvideo-reactor.workspace = true
fastvideo-deploy.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# FakeBackend-only engine for CPU CI (FakeBackend is always compiled; this selects it).
fake = []
# CudaBackend over fastvideo-cudarc (the only path to CUDA).
cuda = ["fastvideo-engine-service/cuda"]
# str0m peer host for Reactor and the fal director.
webrtc = ["fastvideo-webrtc/str0m"]
# In-process OpenH264 and Opus encoders.
encoders = ["fastvideo-media/openh264", "fastvideo-media/opus"]
# Outbound HTTP: ingestion fetch, callbacks, webhooks, WHIP, Runpod worker.
http-client = ["fastvideo-serve-kit/fetch", "fastvideo-webrtc/whip", "fastvideo-deploy/runpod"]
# Everything except CUDA.
full = ["webrtc", "encoders", "http-client"]

[lints]
workspace = true
