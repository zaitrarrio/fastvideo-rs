[package]
name = "fastvideo-luminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Luminal TensorBackend for fastvideo-rs (compile-once DiT/VAE graphs)."

[dependencies]
fastvideo-ops.workspace = true
fastvideo-models.workspace = true
fastvideo-loader.workspace = true
luminal = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# crates.io luminal 0.2 advertises `cuda` but ships no `compilers/cuda` module.
# Do not wire `luminal/cuda` here — workspace `--features cuda` would break the build.

[lints]
workspace = true
