[package]
name = "fastvideo-cudarc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cudarc CUDA Wan T2V backend for fastvideo-rs."

[dependencies]
fastvideo-ops.workspace = true
fastvideo-models.workspace = true
fastvideo-loader.workspace = true
image.workspace = true
rand.workspace = true
rand_distr.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
half = "2"
sha2.workspace = true
rayon.workspace = true

[features]
default = []
# `cudarc/cupti` backs FASTVIDEO_GPU_TRACE (wan::gpu_trace); libcupti loads lazily.
# `cuda` picks no link mode: a build with it also enables exactly one of
# `link-dynamic` / `link-static` (lib.rs refuses a `cuda` build without one;
# cudarc's build refuses both).
cuda = ["dep:cudarc", "cudarc/cupti"]
# The CUDA libraries dlopened at run time (cudarc `dynamic-loading`): the
# `cuda` images, whose base-cuda layer carries them.
link-dynamic = ["cudarc/dynamic-loading"]
# cuBLAS, cuBLASLt, cudart, NVRTC (+ nvptxcompiler, builtins) and CUPTI linked
# statically from the toolkit's `*_static.a` (cudarc `static-linking`); cuDNN
# stays a shared library (its licence allows only the runtime `.so`, ADR-0024),
# through build.rs's shim. The `cuda-static` fv-serve and image.
link-static = ["cudarc/static-linking"]
# `rt::nvfp4_gemm`: the kernel-level NVFP4 GEMM backends (cuBLASLt block-scaled
# FP4, the scale swizzle and the device quantizer) that no served model path
# calls; fv-gpucheck's `nvfp4_gemm` / `nvfp4_linear` groups measure them. Off by
# default (ADR-0015).
nvfp4-gemm = ["cuda"]
# The oxide Tile-IR NVFP4 GEMM: build.rs embeds the `fv-oxide-aot` cubins
# (artifacts/oxide or FV_OXIDE_CUBIN_DIR; FV_REQUIRE_OXIDE checks them), the
# device loads them, and the LongLive NVFP4 linear may route to them under
# FASTVIDEO_NVFP4_OXIDE_GEMM. Off by default and in every served config; without
# it the setting falls back to the in-tree W4A4 kernel, as a build without the
# cubins always did (ADR-0015).
oxide = ["nvfp4-gemm"]

[dependencies.cudarc]
workspace = true
optional = true

# build.rs compiles the MoE AOT cubins with libnvrtc (dlopened at build time,
# only where the CUDA toolkit is found): ADR-0024 step 1a,
# FVID-2026-11-12-moe-aot-build-time-nvrtc. Its own small loader rather than
# cudarc: cargo unifies a build-dependency's features with the normal
# dependency's when host and target agree, so a cudarc build-dependency would
# carry the binary's link mode (and the fixed one it needed on top: cudarc's
# build refuses both).
[build-dependencies]
libloading = "0.8"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
