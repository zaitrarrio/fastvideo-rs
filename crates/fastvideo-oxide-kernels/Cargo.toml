[package]
name = "fastvideo-oxide-kernels"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Tile-IR NVFP4 W4A4 GEMM (cutile-rs), compiled ahead of time to cubins. Not a workspace member."
# Stable Rust >= 1.89 (cutile-rs v0.3.1). Excluded from the workspace so
# `cargo test` on a machine without the CUDA headers never builds this.
# Build needs CUDA headers (cuda.h, curand.h); running the exporter needs
# `tileiras` (CUDA >= 13.2). No GPU and no CUDA driver.

[dependencies]
cutile = { path = "../../third_party/cutile-rs/cutile" }

[[bin]]
name = "fv-oxide-aot"
path = "src/main.rs"

# Its own workspace root: never pulled into the repo workspace (or into an
# enclosing checkout's, e.g. a git worktree nested in the main clone).
[workspace]
