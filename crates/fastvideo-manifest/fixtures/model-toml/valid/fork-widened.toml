# The two widenings of 2026-10-23: [variant], [runtime].recipe/profile, [caps].
schema = 1
name = "zay/h3/dmd:4:bf16"
parent = "minimax/h3@89abcdef0123"
license = { spdx = "LicenseRef-MiniMax-Community", redistribution = true, url = "https://example.com/minimax-community" }

[runtime]
engine = "fastvideo-rs"
min_version = "0.1.1"
pipeline = "h3"
recipe = "4step-vsa"
profile = "h3/fasth3_4step_vsa"

[defaults]
steps = 4
width = 1344
height = 768
frames = 124
fps = 24

[components]
transformer = { path = "weights/transformer.safetensors", dtype = "bf16" }
text_encoder = { path = "weights/text_encoder.safetensors", dtype = "bf16" }
vae = { path = "weights/vae.safetensors", dtype = "bf16" }
lora = { path = "adapters/fasth3-4-step.safetensors", dtype = "bf16" }

[change]
summary = "FastH3 4-step DMD LoRA with sparse (VSA) attention"
reason = "Turbo tier: fastest configuration that passes the quality gate"

[variant]
attention_route = "vsa"
dit_quant = "bf16"
decoder = "tae"
adapters = ["fasth3-4-step-preview-v1-lora"]
stages = 1
tiers = ["turbo"]

[caps]
frames = { step = 17, offset = 5, min = 107, max = 362 }
canvas = { multiple = 32, max_area = 1032192, aspect = [0.25, 4.0], short_edges = [768, 1080] }
fps = { allowed = [24], default = 24 }
refs = { images = 9, videos = 3, audios = 3, total = 12 }
knobs = { seed = true, negative = false, steps = false, guidance = false, guidance_2 = false, flow_shift = false }
