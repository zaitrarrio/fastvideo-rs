# A vendor ref with [caps] only (the widening is independent of fork-ness).
schema = 1
name = "minimax/h3"
license = { spdx = "LicenseRef-MiniMax-Community", redistribution = false, url = "https://example.com/minimax-community" }

[runtime]
engine = "fastvideo-rs"
min_version = "0.1.0"
pipeline = "h3"

[components]
transformer = { path = "weights/transformer.safetensors", dtype = "bf16" }
text_encoder = { path = "weights/text_encoder.safetensors", dtype = "bf16" }
vae = { path = "weights/vae.safetensors", dtype = "bf16" }

[caps.frames]
step = 17
offset = 5
min = 107
max = 362

[caps.canvas]
multiple = 32
max_area = 1032192
aspect = [0.25, 4.0]
short_edges = [768]

[caps.fps]
allowed = [24]
default = 24

[caps.knobs]
seed = true
