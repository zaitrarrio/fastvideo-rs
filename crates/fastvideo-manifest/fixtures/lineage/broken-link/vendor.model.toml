schema = 1
name = "wan-ai/wan2.2-t2v"
license = { spdx = "Apache-2.0", redistribution = true, url = "https://github.com/Wan-Video/Wan2.2/blob/main/LICENSE.txt" }

[runtime]
engine = "fastvideo-rs"
min_version = "0.1.0"
pipeline = "wan"

[defaults]
steps = 40
guidance = 5.0
width = 832
height = 480
frames = 81
fps = 16

[components]
transformer = { path = "weights/transformer.safetensors", dtype = "bf16" }
text_encoder = { path = "weights/text_encoder.safetensors", dtype = "bf16" }
vae = { path = "weights/vae.safetensors", dtype = "bf16" }
