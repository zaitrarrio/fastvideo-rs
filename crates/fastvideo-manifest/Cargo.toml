[package]
name = "fastvideo-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The registry's public formats: model names, model.toml v1, the signed lineage manifest v1 with its canonical BLAKE3 digest, and their JSON Schemas. Pure: no I/O, no CUDA."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
blake3.workspace = true
# `pem` adds PKCS#8 / SPKI PEM parsing on top of the workspace's `pkcs8`.
ed25519-dalek = { workspace = true, features = ["pem"] }
base64.workspace = true
thiserror.workspace = true
semver.workspace = true
schemars.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
