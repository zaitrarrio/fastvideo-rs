[package]
name = "fastvideo-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The registry's public formats (model names, model.toml v1, the signed lineage manifest v1 with its canonical BLAKE3 digest) and the runtime's family manifest (layer 2), with their JSON Schemas. Pure: no I/O, no CUDA."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
blake3.workspace = true
# `pem` adds PKCS#8 / SPKI PEM parsing on top of the workspace's `pkcs8`.
ed25519-dalek = { workspace = true, features = ["pem"] }
base64.workspace = true
thiserror.workspace = true
semver.workspace = true
schemars.workspace = true

[features]
default = []
# `family::load_dir`: the one directory reader (families/*.toml) the runtime
# consumers share. Off by default: the crate stays I/O-free for the registry.
fs = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
