[package]
name = "fastvideo-gpucheck"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tiered, fail-fast numerical and performance validation for the cudarc Wan backend."

[[bin]]
name = "fv-gpucheck"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
safetensors.workspace = true
image.workspace = true
rayon.workspace = true
rand.workspace = true
rand_distr.workspace = true
fastvideo-models.workspace = true
fastvideo-cudarc.workspace = true
fastvideo-ops.workspace = true
fastvideo-loader.workspace = true
sha2.workspace = true
memmap2.workspace = true
cudarc = { workspace = true, optional = true }
half = { version = "2", optional = true }
# `fv-gpucheck engine`: the serve engine's CUDA backend end to end.
fastvideo-engine-service = { workspace = true, optional = true }
fastvideo-protocol = { workspace = true, optional = true }
fastvideo-media = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync"] }

[features]
default = []
# Device checks (nvrtc, device, kernels) and GPU runs of every other stage.
cuda = [
    "fastvideo-cudarc/cuda",
    "dep:cudarc",
    "dep:half",
    "dep:fastvideo-engine-service",
    "fastvideo-engine-service/cuda",
    "dep:fastvideo-protocol",
    "dep:fastvideo-media",
    "dep:tokio",
]

[lints.rust]
# Kernel-level parity checks launch NVRTC kernels directly (`unsafe fn`).
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
